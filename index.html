/* ===== Storage: IndexedDB on this device. Everything loads into memory at start; writes go straight through. ===== */
const TYPES = ['task', 'event', 'note', 'journal', 'habit', 'goal'];
const DB_NAME = 'lifebrain2';
const DEFAULT_SETTINGS = {
  theme: 'system', // system | light | dark
  name: '',
  accent: 'violet',
  look: 3, // 3 = the Tailwind look; settings from before it move from the old default (clay) to violet once
  ai: { active: 'auto', linked: [], models: {}, baseUrls: {}, timeoutSec: 60, rememberKeys: false },
};
const S = (LB.S = {
  records: new Map(),
  settings: structuredClone(DEFAULT_SETTINGS),
  aiKeys: {}, // provider id → key. Held in memory; stored only when the person turns that on.
  storage: 'pending', // ok | unavailable | error
  lastSnapshot: null,
  migrated: false,
  lastExport: null, // when a backup file was last saved
  persisted: null, // true if the browser promised not to clear our data
});
let idb = null;
const listeners = [];
const onChange = (fn) => listeners.push(fn);
let emitQueued = false;
function emit() {
  if (emitQueued) return;
  emitQueued = true;
  queueMicrotask(() => { emitQueued = false; listeners.forEach((f) => f()); });
}

function openDB() {
  return new Promise((res, rej) => {
    let r;
    try { r = indexedDB.open(DB_NAME, 1); } catch (e) { return rej(e); }
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('records', { keyPath: 'id' });
      d.createObjectStore('meta', { keyPath: 'key' });
      d.createObjectStore('snapshots', { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('Database blocked by another open tab'));
  });
}
const txDo = (db, store, mode, fn) => new Promise((res, rej) => {
  if (!db) return res(null);
  let t, out;
  try { t = db.transaction(store, mode); out = fn(t.objectStore(store)); } catch (e) { return rej(e); }
  t.oncomplete = () => res(out && typeof out === 'object' && 'result' in out ? out.result : out);
  t.onerror = () => rej(t.error);
  t.onabort = () => rej(t.error || new Error('Transaction aborted'));
});
const idbDo = (store, mode, fn) => txDo(idb, store, mode, fn);
/* true = saved; null = no storage in this browser (a banner says so); false = the save failed. */
async function persist(store, fn) {
  if (!idb) return null;
  try { await idbDo(store, 'readwrite', fn); return true; }
  catch (e) { console.error('Save failed', e); S.storage = 'error'; emit(); return false; }
}
const NOT_SAVED = 'Not saved. This phone refused to store the change. Export a backup from Settings.';
const mustPersist = async (store, fn) => { if ((await persist(store, fn)) === false) throw new Error(NOT_SAVED); };
function mergeSettings(v) {
  const d = structuredClone(DEFAULT_SETTINGS);
  const ai = { ...d.ai, ...((v && v.ai) || {}) };
  ['models', 'baseUrls'].forEach((k) => { if (!ai[k] || typeof ai[k] !== 'object' || Array.isArray(ai[k])) ai[k] = {}; });
  if (!Array.isArray(ai.linked)) ai.linked = [];
  const out = { ...d, ...(v || {}), ai };
  if (!['system', 'light', 'dark'].includes(out.theme)) out.theme = 'system';
  out.auto = { on: false, today: true, overdue: true, notes: true, week: true, plan: true, ...((v && v.auto) || {}) };
  if (!Array.isArray(out.pending)) out.pending = [];
  if (out.accent === 'purple') out.accent = 'violet'; // Purple became Violet, from the logo
  if (v && v.look !== 3) { out.look = 3; if (!v.accent || v.accent === 'clay' || (v.look !== 2 && v.accent === 'blue')) out.accent = 'violet'; }
  return out;
}
async function dbInit() {
  try { idb = await openDB(); S.storage = 'ok'; }
  catch (e) { idb = null; S.storage = 'unavailable'; console.warn('IndexedDB unavailable', e); return; }
  try {
    const fix = [], drop = [];
    for (const r of (await idbDo('records', 'readonly', (st) => st.getAll())) || []) {
      const c = cleanRecord(r);
      if (c) { S.records.set(c.id, c); if (r.type === 'journal') fix.push(c); } else if (r && r.id) drop.push(r.id);
    }
    if (fix.length || drop.length) await persist('records', (st) => { fix.forEach((c) => st.put(c)); drop.forEach((id) => st.delete(id)); }); // store converted journal entries once
    for (const m of (await idbDo('meta', 'readonly', (st) => st.getAll())) || []) {
      if (m.key === 'settings') S.settings = mergeSettings(m.value);
      if (m.key === 'aiKeys' && m.value && typeof m.value === 'object') S.aiKeys = { ...m.value };
      if (m.key === 'lastSnapshot') S.lastSnapshot = m.value;
      if (m.key === 'migrated') S.migrated = !!m.value;
      if (m.key === 'lastExport') S.lastExport = m.value;
    }
  } catch (e) { S.storage = 'error'; console.error(e); }
}

/* Every record that comes in from outside (a backup file, the old database) is reshaped to exactly the fields
   each kind uses. Ids, dates and times are checked, so nothing odd can reach the page as markup. */
const SAFE_ID = /^[A-Za-z0-9_-]{1,80}$/;
const TIME = /^([01]?\d|2[0-3]):[0-5]\d$/;
const str = (v, max = 20000) => (typeof v === 'string' ? v.slice(0, max) : v == null ? '' : String(v).slice(0, max));
const day = (v) => (isYmd(v) && ymd(parseYmd(v)) === v ? v : ''); // a real calendar day, not 2026-13-40
const isoOr = (v) => (typeof v === 'string' && !Number.isNaN(Date.parse(v)) ? v : '');
const dayLog = (o, num) => { const out = {}; if (o && typeof o === 'object' && !Array.isArray(o)) for (const [k, v] of Object.entries(o)) if (day(k)) { if (num) { const n = Number(v); if (Number.isFinite(n) && n) out[k] = clamp(Math.round(n), -100000, 100000); } else if (v) out[k] = true; } return out; };
function cleanRecord(r) {
  if (!r || typeof r !== 'object' || !TYPES.includes(r.type) || typeof r.id !== 'string' || !SAFE_ID.test(r.id)) return null;
  const b = { id: r.id, type: r.type, createdAt: isoOr(r.createdAt), updatedAt: isoOr(r.updatedAt) };
  switch (r.type) {
    case 'task': return { ...b, title: str(r.title, 300) || 'Task', date: day(r.date), done: !!r.done, doneDate: r.done ? day(r.doneDate) : '', note: str(r.note, 4000), moved: clamp(Math.round(Number(r.moved) || 0), 0, 999), goalId: SAFE_ID.test(r.goalId || '') ? r.goalId : '' };
    case 'event': { const time = TIME.test(r.time || '') ? r.time : ''; return day(r.date) ? { ...b, title: str(r.title, 300) || 'Event', date: day(r.date), time, end: time && TIME.test(r.end || '') ? r.end : '', note: str(r.note, 4000) } : null; }
    case 'note': return { ...b, title: str(r.title, 200), body: str(r.body, 100000), pinned: !!r.pinned, date: day(r.date) };
    case 'journal': { // the journal was folded into Notes: each written day becomes a dated note with the same id
      const text = str(r.text, 100000).trim(), mood = ['', '😞', '😕', '😐', '🙂', '😄'][clamp(Math.round(Number(r.mood) || 0), 0, 5)];

/* ---- The earlier Life Brain: turn its records into the new kinds. Example data is left behind. ---- */

      out.push({ ...base(r), type: 'habit', title: [r.emoji, r.title].filter(Boolean).join(' ') || 'Habit', log });
    } else if (r.type === 'memory' || r.type === 'insight') {
      out.push({ ...base(r), type: 'note', title: String(r.title || ''), body: [r.body, r.why && 'Why: ' + r.why].filter(Boolean).join('\n\n'), pinned: false });
    } else if (r.type === 'goal') {
      const done = r.status === 'done';
      out.push({ ...base(r), type: 'goal', title: String(r.title || 'Goal'), why: String(r.why || ''), by: isYmd(r.due) ? r.due : '', target: 0, unit: '', log: {}, done, doneDate: done ? today() : '' });

/* Read the old database once, if it is there. Never changes or deletes it. */
function readOldDB() {
  return new Promise((res) => {
    let r;
    try { r = indexedDB.open('lifebrain'); } catch (_) { return res(null); }
    r.onupgradeneeded = () => { try { r.transaction.abort(); } catch (_) {} }; // it doesn't exist: don't create it
    r.onerror = () => res(null);
    r.onblocked = () => res(null);
    r.onsuccess = async () => {
      const db = r.result;
      try {
        if (!db.objectStoreNames.contains('records')) { db.close(); return res(null); }
        const records = (await txDo(db, 'records', 'readonly', (st) => st.getAll())) || [];
        const meta = db.objectStoreNames.contains('meta') ? (await txDo(db, 'meta', 'readonly', (st) => st.getAll())) || [] : [];
        db.close();
        res({ records, meta: Object.fromEntries(meta.map((m) => [m.key, m.value])) });
      } catch (_) { try { db.close(); } catch (__) {} res(null); }
    };
  });
}
async function migrateOld() {
  if (S.migrated || !idb) return 0;

  let n = 0;
  if (old) {
    const recs = fromOld(old.records, old.meta.profile).map(cleanRecord).filter((r) => r && !S.records.has(r.id));
    for (const r of recs) S.records.set(r.id, r);
    if (recs.length) await mustPersist('records', (st) => recs.forEach((r) => st.put(r)));
    n = recs.length;
    const os = old.meta.settings;
    if (os && typeof os === 'object') {
      const patch = {};
      if (os.mode === 'black') patch.theme = 'dark';
      if (os.mode === 'white') patch.theme = 'light';
      if (os.ai && typeof os.ai === 'object') patch.ai = { ...S.settings.ai, ...os.ai, active: 'auto' };
      S.settings = mergeSettings({ ...S.settings, ...patch });

/* ---- Export / import / snapshots ---- */
async function markExported() { S.lastExport = new Date().toISOString(); await setMeta('lastExport', S.lastExport); emit(); }

}
function validateImport(obj) {

/* ===== The data, in the shapes the screens need ===== */
const byTitle = (a, b) => String(a.title || '').localeCompare(String(b.title || ''));
const byCreated = (a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || ''));
function data() {
  return {
    tasks: all('task'), events: all('event'), notes: all('note'), habits: all('habit').filter((h) => !h.archived), goals: all('goal'),
  };
}
LB.data = data;

/* Tasks */
const isOverdue = (x, t = today()) => !x.done && isYmd(x.date) && x.date < t;
const tasksOn = (D, date) => D.tasks.filter((x) => x.date === date || (x.done && x.doneDate === date && !x.date)).sort(byCreated);
const doneOn = (D, date) => D.tasks.filter((x) => x.done && x.doneDate === date);
const eventsOn = (D, date) => D.events.filter((e) => e.date === date).sort((a, b) => (a.time || '').localeCompare(b.time || '') || byTitle(a, b));

/* Notes written on a given day (by when they were first saved) */
/* A note belongs to the day you pick for it; older notes fall back to the (local) day they were written. */
const noteDay = (n) => (isYmd(n.date) ? n.date : n.createdAt && !Number.isNaN(Date.parse(n.createdAt)) ? ymd(new Date(n.createdAt)) : '');
const notesOn = (D, date) => D.notes.filter((n) => noteDay(n) === date);

/* Habits */
const habitDone = (h, date) => !!(h.log && h.log[date]);
function habitStreak(h, t = today()) {
  let d = habitDone(h, t) ? t : addDays(t, -1), n = 0;
  while (habitDone(h, d)) { n++; d = addDays(d, -1); }
  return n;
}
const habitCount = (h, from, to) => Object.keys(h.log || {}).filter((d) => h.log[d] && d >= from && d <= to).length;

/* Goals: a number you're counting toward, like 12 books */
const goalNow = (g) => Object.values(g.log || {}).reduce((a, b) => a + (Number(b) || 0), 0);
const goalIsNumber = (g) => Number(g.target) > 0;
const goalDone = (g) => (goalIsNumber(g) ? goalNow(g) >= Number(g.target) : !!g.done);
const goalSteps = (D, g) => D.tasks.filter((x) => x.goalId === g.id);
const goalHabits = (D, g) => D.habits.filter((h) => h.goalId === g.id);
const goalPct = (g, D = data()) => {
  if (goalIsNumber(g)) return clamp(goalNow(g) / Number(g.target), 0, 1);
  if (g.done) return 1;
  const st = goalSteps(D, g);
  return st.length ? st.filter((x) => x.done).length / st.length : 0;
};
const activeGoals = (D) => D.goals.filter((g) => !goalDone(g));
const localDay = (iso) => (iso && !Number.isNaN(Date.parse(iso)) ? ymd(new Date(iso)) : '');

/* ---- Where a goal stands: last time anything moved it, and whether the current pace makes the deadline. ---- */
function goalStatus(D, g, t = today()) {
  const steps = goalSteps(D, g), habits = goalHabits(D, g), from = addDays(t, -27);
  const dates = [...steps.filter((x) => x.done && x.doneDate).map((x) => x.doneDate), ...habits.flatMap((h) => Object.keys(h.log || {})), ...Object.keys(g.log || {}).filter((d) => Number(g.log[d]) > 0)].filter((d) => d <= t).sort();
  const last = dates[dates.length - 1] || '', born = localDay(g.createdAt) || t;
  const idle = daysBetween(last || born, t);
  const open = steps.filter((x) => !x.done), doneRecent = steps.filter((x) => x.done && x.doneDate >= from && x.doneDate <= t).length;
  const daysLeft = g.by ? daysBetween(t, g.by) : null;
  let eta = '', rate = 0, remaining = 0;
  if (goalIsNumber(g)) {
    remaining = Number(g.target) - goalNow(g);
    rate = Object.entries(g.log || {}).filter(([d]) => d >= from && d <= t).reduce((a, [, v]) => a + (Number(v) || 0), 0) / 28;
  } else { remaining = open.length; rate = doneRecent / 28; }
  if (remaining > 0 && rate > 0) eta = addDays(t, Math.ceil(remaining / rate));
  const perWeekNeed = daysLeft && daysLeft > 0 && remaining > 0 ? Math.ceil((remaining / daysLeft) * 7) : 0, perWeekNow = Math.round(rate * 7 * 10) / 10;
  let state = 'on-track';
  if (goalDone(g)) state = 'done';
  else if (!goalIsNumber(g) && !open.length) state = 'no-steps';
  else if (idle >= 10 && (last || daysBetween(born, t) >= 10)) state = 'stalled';
  else if (g.by && ((eta && eta > g.by) || (daysLeft != null && daysLeft < 0))) state = 'behind';
  else if (!last) state = 'new';
  return { state, last, idle, open, steps, habits, eta, daysLeft, remaining, perWeekNeed, perWeekNow };
}
const GOAL_WORDS = { done: 'Done', 'no-steps': 'Needs a next step', stalled: 'Stalled', behind: 'Behind', new: 'Just started', 'on-track': 'On track' };

/* ---- Where your effort went: finished tasks in the last 4 weeks, by goal ---- */
function direction(D, t = today()) {
  const from = addDays(t, -27), done = D.tasks.filter((x) => x.done && isYmd(x.doneDate) && x.doneDate >= from && x.doneDate <= t);
  const ids = new Set(D.goals.map((g) => g.id)), by = {};
  let none = 0;
  for (const x of done) { if (x.goalId && ids.has(x.goalId)) by[x.goalId] = (by[x.goalId] || 0) + 1; else none++; }
  const parts = D.goals.map((g) => ({ g, n: by[g.id] || 0 })).filter((p) => p.n || !goalDone(p.g)).sort((a, b) => b.n - a.n);
  return { total: done.length, parts, none };
}
function headingLine(D, t = today()) {
  const dir = direction(D, t), st = activeGoals(D).map((g) => ({ g, s: goalStatus(D, g, t) }));
  const behind = st.find((x) => x.s.state === 'behind');
  if (behind) return behind.s.eta ? `At this pace “${behind.g.title}” lands ${fmtDate(behind.s.eta, { month: 'short', day: 'numeric' })}, after your ${fmtDate(behind.g.by, { month: 'short', day: 'numeric' })} deadline.` : `“${behind.g.title}” is past its deadline.`;
  const stalled = st.filter((x) => x.s.state === 'stalled').sort((a, b) => b.s.idle - a.s.idle)[0];
  if (stalled) return `“${stalled.g.title}” hasn’t moved in ${stalled.s.idle} days.`;
  if (dir.total >= 4 && dir.none / dir.total >= 0.6) return `${Math.round((dir.none / dir.total) * 100)}% of what you finished in 4 weeks wasn’t toward any goal.`;
  const empty = st.find((x) => x.s.state === 'no-steps');
  if (empty) return `“${empty.g.title}” has no next step yet.`;
  const top = dir.parts[0];
  if (top && top.n) return `Most of your effort went to “${top.g.title}”, and nothing is off track.`;
  return dir.total ? 'Nothing you finished lately was tied to a goal yet.' : 'Tick tasks off as you go, and this shows where your effort really goes.';
}

/* ---- Patterns: what your own records show that's easy to miss. Plain sentences, only with enough data. ---- */
function patterns(D = data(), t = today()) {
  const out = [];
  // 2. A habit that slipped this week
  for (const h of D.habits) {
    const before = habitCount(h, addDays(t, -13), addDays(t, -7)), now = habitCount(h, addDays(t, -6), t);
    if (before >= 4 && now <= before - 3) out.push({ id: 'slip-' + h.id, text: `“${h.title}” slipped: ${plural(now, 'day')} this week, down from ${before}.` });
  }
  // 3. A task that keeps getting pushed
  const pushed = D.tasks.filter((x) => !x.done && (x.moved || 0) >= 3).sort((a, b) => b.moved - a.moved)[0];
  if (pushed) out.push({ id: 'moved-' + pushed.id, text: `“${pushed.title}” has been moved ${pushed.moved} times. Make it smaller, or let it go?` });
  // 4. Which weekday you get things done
  const from = addDays(t, -56), done = D.tasks.filter((x) => x.done && isYmd(x.doneDate) && x.doneDate >= from && x.doneDate <= t);
  if (done.length >= 15) {
    const first = done.reduce((m, x) => (x.doneDate < m ? x.doneDate : m), t);
    const per = [0, 0, 0, 0, 0, 0, 0], days = [0, 0, 0, 0, 0, 0, 0];
    for (let d = first; d <= t; d = addDays(d, 1)) days[parseYmd(d).getDay()]++;
    done.forEach((x) => per[parseYmd(x.doneDate).getDay()]++);
    const avg = per.map((n, w) => ({ w, v: days[w] ? n / days[w] : 0 })).filter((x) => days[x.w] >= 2);
    if (avg.length >= 5) {
      avg.sort((a, b) => b.v - a.v);
      const best = avg[0], worst = avg[avg.length - 1];
      if (best.v >= 1 && best.v >= worst.v * 2) out.push({ id: 'weekday', text: `You finish the most on ${weekdayName(best.w)}s and the least on ${weekdayName(worst.w)}s.` });
    }
  }
  // 5. The overdue pile
  const over = D.tasks.filter((x) => isOverdue(x, t)).length;
  if (over >= 5) out.push({ id: 'overdue', text: `${over} tasks are overdue. Move or delete the ones that don’t matter any more.` });
  return out.slice(0, 4);
}
LB.patterns = patterns;

/* The week at a glance, for Progress */
function weekStats(D = data(), t = today()) {
  const from = addDays(t, -6), days = [...Array(7)].map((_, i) => addDays(from, i));
  const perDay = days.map((d) => ({ d, n: doneOn(D, d).length }));
  // Count each habit only from the day it was added, so a new habit doesn't start at 14%.
  const since = (h) => { const c = String(h.createdAt || '').slice(0, 10), first = Object.keys(h.log || {}).sort()[0] || t; const s = [isYmd(c) ? c : t, first].sort()[0]; return s > from ? s : from; };

  return {
    perDay, tasks: perDay.reduce((s, x) => s + x.n, 0),
    habitRate: hDays ? hDone / hDays : null,
    overdue: D.tasks.filter((x) => isOverdue(x, t)).length,
  };
}

/* One fetch path for every provider: timeout, stop, and readable errors. */
async function aiFetch(href, init, { signal, secs } = {}) {
  const url = checkUrl(href);

  const onStop = () => { reason = reason || 'cancelled'; ctl.abort(); };
  signal && signal.addEventListener('abort', onStop);

    let res;
    try { res = await fetch(url.href, { ...init, signal: ctl.signal, referrerPolicy: 'no-referrer', credentials: 'omit' }); }
    catch (e) {
      if (reason === 'timeout') throw aiErr('timeout', `No answer after ${secs} seconds. Try again, or raise the timeout in Settings → AI.`);
      if (reason === 'cancelled') throw aiErr('cancelled', 'Stopped.');
      throw aiErr('network', `Could not reach ${url.host}. Check your internet. Some services refuse requests sent straight from a browser; if this keeps happening, that service needs a proxy (Settings → AI → Advanced).`);
    }
    let body = null;
    try { body = await res.json(); } catch (_) { if (reason === 'timeout') throw aiErr('timeout', `No answer after ${secs} seconds.`); }
    if (!res.ok) {
      const m = body && (body.error && (body.error.message || (typeof body.error === 'string' && body.error)) || body.message);
      const detail = m ? ` (${trunc(String(m), 160)})` : '';
      if (res.status === 401 || res.status === 403) throw aiErr('auth', 'The service rejected the API key' + detail + '.');
      if (res.status === 402) throw aiErr('credits', 'The account has no credit left' + detail + '.');
      if (res.status === 404) throw aiErr('not_found', 'The service could not find that model or address' + detail + '.');
      if (res.status === 429) throw aiErr('rate_limited', 'The service is rate-limiting requests or your quota is used up' + detail + '. Try again later.');
      if (res.status >= 500) throw aiErr('upstream', `The service had an error (${res.status})${detail}. Try again later.`);
      throw aiErr('http', `The service returned an error (${res.status})${detail}.`);
    }
    return body;
  } finally {
    clearTimeout(timer);
    signal && signal.removeEventListener('abort', onStop);
  }
}
const authHeaders = (p, key) => {

async function listModels(p, key = S.aiKeys[p], base = provBase(p)) {

async function callProvider(p, user, signal, system = SYSTEM_PROMPT) {
  const key = S.aiKeys[p] || '';
  if (!key && !PROVIDERS[p].local && p !== 'custom') throw aiErr('missing_key', `No API key is saved for ${PROVIDERS[p].name}. Add one in Settings → AI.`);
  const model = provModel(p);
  if (!model) throw aiErr('bad_model', `Choose a model for ${PROVIDERS[p].name} in Settings → AI.`);
  const base = provBase(p), st = PROVIDERS[p].style;
  const json = { 'Content-Type': 'application/json' };
  let body, text;
  if (st === 'anthropic') {
    body = await aiFetch(base + '/messages', { method: 'POST', headers: { ...json, ...authHeaders(p, key) }, body: JSON.stringify({ model, max_tokens: 2000, temperature: 0.4, system, messages: [{ role: 'user', content: user }] }) }, { signal });
    text = (body.content || []).filter((c) => c.type === 'text').map((c) => c.text).join('');
  } else if (st === 'gemini') {
    body = await aiFetch(`${base}/models/${encodeURIComponent(model)}:generateContent`, { method: 'POST', headers: { ...json, ...authHeaders(p, key) }, body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents: [{ role: 'user', parts: [{ text: user }] }], generationConfig: { temperature: 0.4 } }) }, { signal });
    const c = body.candidates && body.candidates[0];
    text = c && c.content && (c.content.parts || []).map((x) => x.text || '').join('');
    if (!text && c && c.finishReason && c.finishReason !== 'STOP') throw aiErr('refused', `Gemini stopped without an answer (${c.finishReason}).`);
  } else {
    body = await aiFetch(base + '/chat/completions', { method: 'POST', headers: { ...json, ...authHeaders(p, key) }, body: JSON.stringify({ model, temperature: 0.4, messages: [{ role: 'system', content: system }, { role: 'user', content: user }] }) }, { signal });
    text = body && body.choices && body.choices[0] && body.choices[0].message && body.choices[0].message.content;
  }
  if (!text || !String(text).trim()) throw aiErr('empty', 'The service answered with no text.');
  return String(text);
}
AI.call = (user, { signal, system } = {}) => {
  const p = AI.provider();
  if (PROVIDERS[p]) return callProvider(p, user, signal, system || SYSTEM_PROMPT);
  return Promise.reject(aiErr('none', 'No AI is set up yet. Paste an API key in Settings → AI.'));
};

  $('#ai-stop', root).addEventListener('click', () => ctl.abort());

  let title = String(v.title || '').trim(), date = pickedDay(v);
  if (!title && kind !== 'note') throw new Error(kind === 'goal' ? 'Say what you want, in a few words.' : 'Type something first.');
  if (kind === 'auto') await omniAdd(title, form);
  else if (kind === 'task') {
    const when = parseWhen(title); if (when) ({ title, date } = when);
    const r = await put({ type: 'task', title, date, done: false, doneDate: '', note: '', moved: 0, goalId: get(v.goalId) ? v.goalId : '' });
    closeSheet(); haptic();
    toast(date ? `Added for ${relDate(date)}` : 'Added to Anytime', '', { action: 'Undo', onAction: () => del(r.id) });
  } else if (kind === 'event') {
    let time = TIME.test(v.time || '') ? v.time : '', saidTime = '', saidDay = '';
    for (let i = 0; i < 2; i++) { // "Dentist 3pm friday" and "Dentist friday 3pm" both work
      const at = !saidTime && parseTime(title); if (at) ({ title, time: saidTime } = at);
      const when = !saidDay && parseWhen(title); if (when && when.date) ({ title, date: saidDay } = when);
    }
    time = time || saidTime; date = saidDay || date;
    if (!date) date = today();
    const r = await put({ type: 'event', title, date, time, end: '', note: '' });
    closeSheet(); haptic();
    toast(`Event added for ${relDate(date)}${time ? ' at ' + fmtTime(time) : ''}`, '', { action: 'Undo', onAction: () => del(r.id) });
  } else if (kind === 'note') {
    newNoteDay = date || today();
    if (!title) { noteSheet(null); return; }
    noteSheet(await put({ type: 'note', title: '', body: title, pinned: false, date: newNoteDay }));
  } else if (kind === 'habit') {
    const r = await put({ type: 'habit', title: title.slice(0, 80), log: {}, goalId: get(v.goalId) ? v.goalId : '' });
    closeSheet(); haptic();
    toast('Habit added', '', { action: 'Undo', onAction: () => del(r.id) });
  } else {
    const g = await put({ type: 'goal', title: title.slice(0, 120), why: '', by: '', target: 0, unit: '', log: {}, done: false, doneDate: '' });
    goalDetail(g);
    toast('Goal added. Now give it a first step.');
  }
};

/* ===== Home: for doing. Today's events and list first, ticked in place; then the one goal that needs you and one
   fix. The day drawn, what's coming, what's done and goals in full are folded away underneath. Built only from
   what's in the app. It observes and hands over: no orders, no pep talk, no scolding. ===== */
const DAY_START = 6 * 60, DAY_END = 24 * 60;
const toMins = (t) => { if (!/^\d{1,2}:\d{2}$/.test(t || '')) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
/* Timed events as [start, end] minutes; no end time means an hour. */
const spans = (events) => events.map((e) => { const s = toMins(e.time); if (s == null) return null; let en = toMins(e.end); if (en == null || en <= s) en = Math.min(s + 60, DAY_END); return { e, s, en }; }).filter(Boolean).sort((a, b) => a.s - b.s);
const tTime = (m) => fmtTime(`${Math.floor(m / 60) % 24}:${pad(m % 60)}`);
const joinAnd = (xs) => (xs.length < 2 ? xs.join('') : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1]);
const quoted = (s) => `“${trunc(s, 48)}”`;

function dayShape(sp) {
  const total = sp.reduce((n, x) => n + (x.en - x.s), 0);
  if (sp.length >= 4 || total >= 300) return 'heavy';
  if (!sp.length || (sp.length === 1 && total <= 60)) return 'open';
  return 'normal';
}
/* The one thing that's been waiting longest: most moved, then oldest overdue, then oldest open. */
function waitingTask(D, t) {
  const open = D.tasks.filter((x) => !x.done && (!x.date || x.date <= t));
  return open.sort((a, b) => (b.moved || 0) - (a.moved || 0) || String(a.date || '9').localeCompare(String(b.date || '9')) || byCreated(a, b))[0] || null;
}
function headline(D, t, sp, shape) {
  const nm = String(S.settings.name || '').trim(), n = nm ? `, ${esc(nm)}` : '';
  const near = D.goals.find((g) => goalIsNumber(g) && Number(g.target) - goalNow(g) === 1);
  if (near) return `One more and ${esc(quoted(near.title))} is done${n}.`;
  if (shape === 'open') {
    const w = waitingTask(D, t);
    return `The whole day is yours${n}.${w ? ` Room for ${esc(quoted(w.title))}.` : ''}`;
  }
  const first = sp[0].s, last = sp[sp.length - 1].en;
  if (shape === 'heavy') return last <= 19 * 60 ? `A steady climb until ${tTime(last)}${n}, then the day opens up.` : `A full day${n}, from ${tTime(first)} to ${tTime(last)}.`;
  if (last <= 12 * 60) return `A busy morning${n}, then the rest of the day is yours.`;
  if (first >= 12 * 60) return `The morning is yours${n}. Things start at ${tTime(first)}.`;
  return `${sp.length === 2 ? 'Two' : sp.length === 3 ? 'Three' : sp.length} things on the calendar${n}, with room in between.`;
}

/* The drawing: one stroke, elevation = load. A calm day is nearly still water. The "now" mark carries the
   logo's gradient: the one place on Home it appears. */
function terrain(sp, shape, t, nowMin, isToday) {
  const wide = window.innerWidth >= 640, W = wide ? 840 : 420, H = wide ? 150 : 112, BASE_Y = H - 24; // drawn at the phone's own shape, so dots stay round
  const xOf = (m) => 14 + ((clamp(m, DAY_START, DAY_END) - DAY_START) / (DAY_END - DAY_START)) * (W - 28);
  const scale = { heavy: 0.62, normal: 0.44, open: 0.28 }[shape] * (H - 36);
  const load = (m) => sp.reduce((v, x) => { const ramp = 75; if (m < x.s - ramp || m > x.en + ramp) return v; const k = m < x.s ? (m - (x.s - ramp)) / ramp : m > x.en ? ((x.en + ramp) - m) / ramp : 1; return v + (0.5 - 0.5 * Math.cos(Math.PI * k)); }, 0);
  const pts = [];
  for (let m = DAY_START; m <= DAY_END; m += 6) {
    const ripple = Math.sin(m / 23) * 1.6 + Math.sin(m / 9) * 0.6; // still water, not a flat ruler
    pts.push([xOf(m), BASE_Y - Math.min(load(m), 1.7) * scale + ripple]);
  }
  const yAt = (m) => { const x = xOf(m); let best = pts[0]; for (const p of pts) if (Math.abs(p[0] - x) < Math.abs(best[0] - x)) best = p; return best[1]; };
  const d = 'M' + pts.map((p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
  let marks = '';
  sp.forEach((x, i) => {
    const mid = (x.s + x.en) / 2, r = clamp(5 + (x.en - x.s) / 30, 5, wide ? 13 : 9);
    const overlap = sp.some((y, j) => j !== i && y.s < x.en && x.s < y.en);
    marks += `<circle cx="${xOf(mid).toFixed(1)}" cy="${(yAt(mid)).toFixed(1)}" r="${r.toFixed(1)}" class="${overlap ? 'hollow' : 'dot'}"><title>${esc(x.e.title)}</title></circle>`;
  });
  // A sun over the next open stretch of the day, a moon over a late finish.
  const parts = [[0, 12 * 60], [12 * 60, 17 * 60], [17 * 60, DAY_END]];
  let sun = false;
  parts.forEach(([from, to], i) => {
    const cx = W / 6 + (i * W) / 3, busy = sp.some((x) => x.s < to && x.en > from);
    if (!busy && !sun && (!isToday || nowMin < to)) {
      sun = true;
      marks += `<g class="motif" transform="translate(${cx} 22)"><circle r="8"/>${[0, 45, 90, 135, 180, 225, 270, 315].map((g) => `<line x1="0" y1="-12.5" x2="0" y2="-16.5" transform="rotate(${g})"/>`).join('')}</g>`;
    } else if (i === 2 && sp.some((x) => x.en >= 21 * 60)) {
      marks += `<path class="motif" d="M${cx + 6} 12 a12 12 0 1 0 0 22 a9 9 0 1 1 0 -22z"/>`;
    }
  });
  if (isToday && nowMin >= DAY_START && nowMin <= DAY_END) {
    const nx = xOf(nowMin).toFixed(1), ny = yAt(nowMin).toFixed(1);
    marks += `<circle class="halo" cx="${nx}" cy="${ny}" r="13" fill="url(#lb-grad)"/><circle class="now" cx="${nx}" cy="${ny}" r="6.5" fill="url(#lb-grad)"><title>Now</title></circle>`;
  }
  const hours = [9, 12, 15, 18, 21].map((h) => `<text x="${xOf(h * 60).toFixed(1)}" y="${H - 3}" text-anchor="middle" class="fill-muted text-[11px] font-medium">${esc(fmtTime(`${h}:00`).replace(':00', ''))}</text>`).join('');
  return `<svg class="terrain" viewBox="0 0 ${W} ${H}" role="img" aria-label="The day drawn as a line: higher where the calendar is fuller"><defs><linearGradient id="lb-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7856fe"/><stop offset=".55" stop-color="#cb53fa"/><stop offset="1" stop-color="#ff7ada"/></linearGradient></defs><path d="${d}" class="ridge"/>${marks}${hours}</svg>`;
}

/* Today's events as a strip of chips, so the times are readable without opening anything. */
function eventStrip(D, t, nowMin) {
  const evs = eventsOn(D, t);
  if (!evs.length) return '';
  return `<div class="ev-strip mt-3" role="group" aria-label="Today’s events">${evs.map((e) => {
    const s = toMins(e.time), en = toMins(e.end) ?? (s == null ? null : s + 60), past = en != null && en <= nowMin;
    return `<button class="ev-chip${past ? ' past' : ''}" data-action="event-edit" data-id="${e.id}"><b>${e.time ? esc(fmtTime(e.time)) : 'All day'}</b><span>${esc(e.title)}</span></button>`;
  }).join('')}</div>`;
}

/* Today, ready to tick: overdue first, then today's, then habits, and a box to add one more. The rest lives on Today. */
function todaySection(D, t) {
  const over = D.tasks.filter((x) => isOverdue(x, t)).sort((a, b) => a.date.localeCompare(b.date) || byCreated(a, b));
  const todays = D.tasks.filter((x) => !x.done && x.date === t).sort(byCreated);
  const list = [...over, ...todays], shown = list.slice(0, 6), more = list.length - shown.length;
  const habits = D.habits.slice().sort(byCreated);
  return `<section class="mt-5" id="home-today">
    <div class="sec-h"><h2>Today</h2><button class="link" data-action="nav" data-to="today">${list.length ? `${list.length} left` : 'All tasks'}</button></div>
    <div class="card mt-1 !py-1">
      ${shown.map((x) => taskRow(x, t, { compact: true })).join('') || '<p class="calm py-3 text-[15px] text-muted">Nothing due today.</p>'}
      ${more ? `<button class="fold border-t border-line" data-action="nav" data-to="today">${icon('down')}${plural(more, 'more task')} on Today</button>` : ''}
      <div class="border-t border-line">${addTaskForm(t, 'add-home', 'Add a task for today', true).replace('class="add-row"', 'class="add-row !bg-transparent !px-1"')}</div>
    </div>
    ${habits.length ? `<div class="habits mt-3">${habits.map((h) => habitChip(h, t)).join('')}</div>` : ''}
  </section>`;
}

/* What's next: tomorrow's events and notes left for today or tomorrow. */
function comingUp(D, t) {
  const tm = addDays(t, 1), rows = [];
  const written = (n) => (n.createdAt && !Number.isNaN(Date.parse(n.createdAt)) ? ymd(new Date(n.createdAt)) : '');
  const noteName = (n) => n.title || trunc(String(n.body || '').split('\n')[0], 60) || 'Note';
  const row = (action, id, when, title, text) => `<button class="soon-row" data-action="${action}" data-id="${id}"><span class="soon-when">${when}</span><span class="min-w-0 flex-1"><b class="block font-semibold break-words">${esc(title)}</b><span class="block text-sm text-muted">${text}</span></span></button>`;
  D.notes.filter((n) => noteDay(n) === t && written(n) < t).slice(0, 2).forEach((n) => rows.push(row('note-open', n.id, 'Today', noteName(n), 'A note you left for today')));
  eventsOn(D, tm).slice(0, 3).forEach((e) => rows.push(row('event-edit', e.id, e.time ? esc(fmtTime(e.time)) : 'All day', e.title, `Tomorrow${e.note ? `. ${esc(trunc(e.note.split('\n')[0], 90))}` : ''}`)));
  D.notes.filter((n) => noteDay(n) === tm).slice(0, 2).forEach((n) => rows.push(row('note-open', n.id, 'Tomorrow', noteName(n), 'A note for tomorrow')));
  return rows.length ? `<section class="mt-7" id="coming-up"><div class="sec-h"><h2>Coming up</h2></div><div class="card mt-1 !py-1">${rows.join('')}</div></section>` : '';
}

/* What's already done, in a few quiet lines. */
function doneLines(D, t) {
  const y = addDays(t, -1), out = [];
  const doneT = doneOn(D, t), doneY = doneOn(D, y), keptY = D.habits.filter((h) => habitDone(h, y));
  const names = (xs) => esc(joinAnd(xs.slice(0, 3).map((x) => quoted(x.title)))) + (xs.length > 3 ? ' and more' : '');
  if (doneT.length) out.push(`${plural(doneT.length, 'task')} done today: ${names(doneT)}.`);
  if (doneY.length) out.push(`${plural(doneY.length, 'task')} done yesterday: ${names(doneY)}.`);
  if (keptY.length) out.push(`${keptY.length === 1 ? 'A habit' : plural(keptY.length, 'habit')} kept yesterday: ${esc(joinAnd(keptY.slice(0, 3).map((h) => h.title)))}${keptY.length === 1 && habitStreak(keptY[0], y) > 1 ? `, ${habitStreak(keptY[0], y)} days in a row` : ''}.`);
  D.goals.filter((g) => (goalIsNumber(g) ? goalNow(g) >= Number(g.target) && Object.keys(g.log || {}).some((d) => d >= addDays(t, -6)) : g.done && g.doneDate >= addDays(t, -6))).slice(0, 1).forEach((g) => out.push(`${esc(g.title)}: reached this week.`));
  return out.length ? `<section class="mt-7" id="home-done"><div class="sec-h"><h2>Already done</h2></div><ul class="mt-1 flex flex-col gap-1.5 text-[15px] text-muted">${out.slice(0, 4).map((l) => `<li>${l}</li>`).join('')}</ul></section>` : '';
}

/* Everything that isn't for doing right now, folded away: the day drawn, what's coming, what's done, goals in full. */
function moreFold(D, t, sp, shape, nowMin) {
  const soon = comingUp(D, t), done = doneLines(D, t);
  const label = joinAnd(['Your day', soon && 'coming up', done && 'done', 'goals'].filter(Boolean));
  return `<details class="more-fold mt-6" id="home-more" ${ui.homeMore ? 'open' : ''}><summary class="fold">${icon('down')}${esc(label)}</summary>
    <section class="mt-2" id="home-day"><p class="day-line font-display text-[18px] leading-snug" id="day-line">${headline(D, t, sp, shape)}</p><div class="mt-3">${terrain(sp, shape, t, nowMin, true)}</div></section>
    ${soon}${done}${headingSection(D, t)}</details>`;
}
document.addEventListener('toggle', (ev) => { if (ev.target.id === 'home-more') ui.homeMore = ev.target.open; }, true); // stays open across redraws
const greeting = (now) => (now.getHours() < 12 ? 'Good morning' : now.getHours() < 17 ? 'Good afternoon' : 'Good evening');

/* Home, for doing: what's on, today's list to tick, the one goal that needs you, one fix. */
VIEWS.home = () => {
  const D = data(), t = today(), now = LB.now(), nowMin = now.getHours() * 60 + now.getMinutes();
  const sp = spans(eventsOn(D, t)), shape = dayShape(sp), nm = String(S.settings.name || '').trim();
  const ai = AUTO.busy ? `<p class="ai-line mt-3 flex items-center gap-2 text-muted" id="ai-busy"><span class="ai-mark animate-spin">${icon('spark')}</span>Your AI is working on ${esc(AUTO.busy)}…</p>`
    : homeLine() ? `<p class="ai-line mt-3" id="home-line">${esc(homeLine())}</p>` : '';
  return `<div class="brief">
    <div class="top !pb-0">${menuBtn()}<p class="daydate flex-1 text-[15px] font-medium text-muted">${esc(fmtDate(t, { weekday: 'long', month: 'long', day: 'numeric' }))}</p>
      <button class="icon-btn ai-today" data-action="home-ai" aria-label="${homeLine() ? 'Ask again about today' : 'What matters today?'}"><span class="ai-mark !h-7 !w-7">${icon('spark')}</span></button></div>
    <h1 class="headline mt-1 !text-[28px]">${greeting(now)}${nm ? `, ${esc(nm)}` : ''}.</h1>
    ${ai}
    ${eventStrip(D, t, nowMin)}
    ${todaySection(D, t)}
    ${goalPulse(D, t)}
    ${fixesSection(D, t)}
    ${moreFold(D, t, sp, shape, nowMin)}
    ${fab()}</div>`;
};
let homeResize;
window.addEventListener('resize', () => { clearTimeout(homeResize); homeResize = setTimeout(() => { if (route.name === 'home' && !SH.open) render(false); }, 200); });

/* ===== Today: today's tasks and habit ticks ===== */
const ui = { anytime: true, done: false };

/* One task row. The circle ticks it; the rest opens it. On a phone, swipe right to tick it off, left for tomorrow. */
function taskRow(x, t = today(), { showDate = true, showGoal = true, compact = false } = {}) {
  const over = isOverdue(x, t);
  const gl = showGoal && x.goalId && get(x.goalId);
  const tags = [
    showDate && over ? `<span class="tag late">Due ${esc(relDate(x.date, t).replace(/^(Yesterday)$/, 'yesterday'))}</span>` : '',
    showDate && !over && isYmd(x.date) && x.date > t ? `<span class="tag">${esc(relDate(x.date, t))}</span>` : '',
    gl ? `<span class="tag tgoal">${icon('goal')}<span class="truncate">${esc(trunc(gl.title, compact ? 16 : 28))}</span></span>` : '',
    x.note && !gl ? '<span class="tag">Note</span>' : '',
  ].filter(Boolean);
  const circle = `<button class="circle" data-action="task-toggle" data-id="${x.id}" role="checkbox" aria-checked="${!!x.done}" aria-label="${x.done ? 'Mark not done' : 'Mark done'}: ${esc(x.title)}">${icon('check')}</button>`;
  const main = compact // one line: the title, and the one tag that matters most on the right
    ? `<button class="task-main !flex-row items-center !gap-2" data-action="task-edit" data-id="${x.id}"><span class="task-title min-w-0 flex-1 truncate">${esc(x.title)}</span>${tags[0] ? `<span class="shrink-0">${tags[0]}</span>` : ''}</button>`
    : `<button class="task-main" data-action="task-edit" data-id="${x.id}"><span class="task-title">${esc(x.title)}</span>${tags.length ? `<span class="task-meta">${tags.join('')}</span>` : ''}</button>`;
  return `<div class="task${compact ? ' compact' : ''}${x.done ? ' done' : ''}" data-task="${x.id}">
    <div class="task-swipe" aria-hidden="true"><span>${icon('check')}Done</span><span>Tomorrow</span></div>
    <div class="task-face">${circle}${main}</div></div>`;
}
const addTaskForm = (date, id, ph = 'Add a task', parse = false) => `<form class="add-row" data-form="task-add" data-date="${date}"${parse ? ' data-parse="1"' : ''}><span class="add-ic">${icon('plus')}</span>
  <input id="${id}" name="title" placeholder="${esc(ph)}" maxlength="300" autocomplete="off" enterkeyhint="done" aria-label="${esc(ph)}"></form>`;
const eventRow = (e) => `<button class="event" data-action="event-edit" data-id="${e.id}"><span class="event-time">${e.time ? esc(fmtTime(e.time)) : 'All day'}</span><span class="event-title">${esc(e.title)}</span></button>`;
const sectionH = (title, right = '') => `<div class="sec-h"><h2>${title}</h2>${right}</div>`;
const habitChip = (h, d) => { const on = habitDone(h, d); return `<button class="habit" data-action="habit-toggle" data-id="${h.id}" data-date="${d}" aria-pressed="${on}"><span class="habit-tick">${icon('check')}</span>${esc(h.title)}</button>`; };

VIEWS.today = () => {
  const D = data(), t = today();
  const events = eventsOn(D, t);
  const open = D.tasks.filter((x) => !x.done && isYmd(x.date) && x.date <= t).sort((a, b) => a.date.localeCompare(b.date) || byCreated(a, b));
  const anytime = D.tasks.filter((x) => !x.done && !x.date).sort(byCreated);
  const done = doneOn(D, t).sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
  const overdue = open.filter((x) => x.date < t).length;
  return header('Today', esc(fmtDate(t, { weekday: 'long', month: 'long', day: 'numeric' })), `<button class="pill ai-pill" data-action="plan-week"><span class="ai-mark !h-5 !w-5">${icon('spark')}</span>Plan week</button>`)
    + (events.length ? `<section class="card mb-4 !py-1">${events.map(eventRow).join('')}</section>` : '')
    + addTaskForm(t, 'add-today', 'Add a task (try “… tomorrow”)', true)
    + (overdue ? `<div class="mt-4 flex flex-wrap items-center gap-2 rounded-2xl bg-warn-bg px-4 py-2.5 text-warn" id="overdue-bar"><b class="mr-auto text-[15px] font-semibold">${plural(overdue, 'overdue task')}</b>
        <button class="btn sm bg-raised text-ink" data-action="overdue-sort"><span class="ai-mark !h-5 !w-5">${icon('spark')}</span>Sort out</button><button class="btn sm bg-raised text-ink" data-action="overdue-today">Move to today</button></div>` : '')
    + `<section class="card tasks mt-4 !py-1">
      ${(ui.allOpen ? open : open.slice(0, 40)).map((x) => taskRow(x, t)).join('')}
      ${open.length > 40 && !ui.allOpen ? `<button class="fold" data-action="fold" data-k="allOpen" aria-expanded="false">${icon('down')}Show ${open.length - 40} more</button>` : ''}
      ${!open.length && !anytime.length && !done.length ? '<p class="empty-line py-3">Nothing for today. Type above to add a task.</p>' : ''}
      ${anytime.length ? `<button class="fold${open.length ? ' border-t border-line' : ''}" data-action="fold" data-k="anytime" aria-expanded="${ui.anytime}">${icon('down')}Anytime <span class="count">${anytime.length}</span></button>${ui.anytime ? anytime.map((x) => taskRow(x, t)).join('') : ''}` : ''}
      ${done.length ? `<button class="fold${open.length || anytime.length ? ' border-t border-line' : ''}" data-action="fold" data-k="done" aria-expanded="${ui.done}">${icon('down')}Done <span class="count">${done.length}</span></button>${ui.done ? done.map((x) => taskRow(x, t)).join('') : ''}` : ''}
    </section>`
    + `<section class="mt-7">${sectionH('Habits', D.habits.length ? '<button class="link" data-action="nav" data-to="progress">History</button>' : '')}
      <div class="habits mt-1">${D.habits.sort(byCreated).map((h) => habitChip(h, t)).join('')}
        <button class="habit add" data-action="habit-new" aria-label="Add a habit">${icon('plus')}${D.habits.length ? '' : 'Add a habit'}</button></div></section>`
    + fab(t);
};

A.fold = (el) => { ui[el.dataset.k] = !ui[el.dataset.k]; render(); };

/* ---- Tasks ---- */
/* Quick add understands a date word at the end, so "Call mom tomorrow" needs one step, not five. */
const WEEKDAYS = { sunday: 0, mon: 1, monday: 1, tue: 2, tues: 2, tuesday: 2, wed: 3, wednesday: 3, thu: 4, thur: 4, thurs: 4, thursday: 4, fri: 5, friday: 5, saturday: 6 }; // not "sun" or "sat": too often ordinary words
function parseWhen(text, t = today()) {
  const m = text.match(/^(.*?\S)\s+(?:(?:on|by)\s+)?(today|tonight|tomorrow|tmrw|tmr|next week|anytime|someday|[a-z]+)$/i);
  if (!m) return null;
  const w = m[2].toLowerCase();
  let date;
  if (w === 'today' || w === 'tonight') date = t;
  else if (['tomorrow', 'tmrw', 'tmr'].includes(w)) date = addDays(t, 1);
  else if (w === 'next week') date = addDays(t, 7);
  else if (w === 'anytime' || w === 'someday') date = '';
  else if (w in WEEKDAYS) { const d = (WEEKDAYS[w] - parseYmd(t).getDay() + 7) % 7 || 7; date = addDays(t, d); }
  else return null;
  return { title: m[1].trim(), date };
}
LB.parseWhen = parseWhen;
F['task-add'] = async (form, v) => {
  let title = String(v.title || '').trim(), date = form.dataset.date || '';
  if (!title) return;
  const inp = $('input', form);
  if (inp) inp.value = '';
  const when = form.dataset.parse ? parseWhen(title) : null;
  if (when) ({ title, date } = when);
  const r = await put({ type: 'task', title, date, done: false, doneDate: '', note: '', moved: 0 });
  haptic();
  if (when && date !== today()) toast(date ? `Added for ${relDate(date)}` : 'Added to Anytime', '', { action: 'Undo', onAction: () => del(r.id) });
};
A['task-toggle'] = async (el) => {
  const x = get(el.dataset.id);
  if (!x) return;
  const was = { done: x.done, doneDate: x.doneDate };
  await put({ ...x, done: !x.done, doneDate: x.done ? '' : today() });
  if (SH.open && $('#goal-steps') && ui.goalOpen) LB.goalDetail(get(ui.goalOpen)); // ticked from inside a goal
  if (!x.done) { haptic(); toast('Done', '', { action: 'Undo', onAction: () => put({ ...get(x.id), ...was }) }); }
};
/* Push a task to tomorrow: the swipe left, and the Tomorrow chip's shortcut. */
async function toTomorrow(x) {
  const t = today(), tm = addDays(t, 1), was = { date: x.date, moved: x.moved || 0 };
  await put({ ...x, date: tm, moved: (x.moved || 0) + (isYmd(x.date) && x.date <= t ? 1 : 0) });
  haptic();
  toast(`“${trunc(x.title, 28)}” moved to tomorrow`, '', { action: 'Undo', onAction: () => put({ ...get(x.id), ...was }) });
}
A['overdue-today'] = async () => {
  const t = today(), list = data().tasks.filter((x) => isOverdue(x, t));
  for (const x of list) await put({ ...x, date: t, moved: (x.moved || 0) + 1 }, { quiet: true });
  emit();
  toast(`${plural(list.length, 'task')} moved to today`);
};
A['task-edit'] = (el) => taskSheet(get(el.dataset.id));
A['task-new'] = (el) => taskSheet(null, el.dataset.date || '');
function taskSheet(x, date = '') {

  openSheet({ title: x ? 'Task' : 'New task', body: `<form class="form" data-form="task" data-id="${x ? x.id : ''}">
    <input name="title" class="note-title" value="${esc(r.title)}" maxlength="300" required autocomplete="off" placeholder="What needs doing?" aria-label="Task">
    <div class="field"><span>When</span>${dayChips('date', r.date || '', { none: true })}</div>
    ${goalChips(r.goalId || '')}
    <label class="field"><span>Note</span><textarea name="note" rows="3" maxlength="4000" placeholder="Why, or what you need for it">${esc(r.note || '')}</textarea></label>
    <p class="err" data-form-error></p>
    <div class="sheet-foot">${x ? `<button type="button" class="btn icon-only danger" data-action="delete" data-id="${x.id}" aria-label="Delete task">${icon('trash')}</button>${x.done ? '' : `<button type="button" class="btn" data-action="task-break" data-id="${x.id}"><span class="ai-mark !h-5 !w-5">${icon('spark')}</span>Break down</button>`}` : ''}<span class="spacer"></span><button class="btn primary">Save</button></div></form>`,
  onMount(root) { root.addEventListener('change', otherDayChanged); } });
}
F.task = async (form, v) => {
  const title = String(v.title || '').trim(), date = pickedDay(v, 'date');
  if (!title) throw new Error('Give the task a name.');
  const old = get(form.dataset.id);
  const later = old && isYmd(old.date) && (!date || date > old.date) && old.date <= today(); // pushed back once it was due
  await put({ ...(old || { type: 'task', done: false, doneDate: '', moved: 0 }), title, date, note: String(v.note || '').trim(), goalId: v.goalId !== undefined ? (get(v.goalId) ? v.goalId : '') : (old && old.goalId) || '', moved: (old && old.moved || 0) + (later && !old.done ? 1 : 0) });

};
/* Delete anything, with Undo. */
A.delete = async (el) => {
  const r = get(el.dataset.id);
  if (!r) return;
  closeSheet();
  await del(r.id);
  const name = { task: 'Task', event: 'Event', note: 'Note', habit: 'Habit', goal: 'Goal' }[r.type] || 'Item';
  toast(`${name} deleted`, '', { action: 'Undo', onAction: () => put(r) });
};

/* Swipe a task row: right ticks it off, left moves it to tomorrow. Touch only; the buttons do the same. */
(() => {
  let st = null, swallow = 0;
  const reset = (row) => { const f = $('.task-face', row), b = $('.task-swipe', row); if (!f) return; f.style.transition = 'transform .25s cubic-bezier(.2,.8,.2,1)'; f.style.transform = ''; if (b) b.style.opacity = '0'; };
  document.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'touch') return;
    const row = e.target.closest('.task[data-task]');
    st = row && $('.task-face', row) && !row.classList.contains('done') && !SH.open ? { row, id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, on: false } : null;
  }, { passive: true });
  document.addEventListener('pointermove', (e) => {
    if (!st || e.pointerId !== st.id) return; // one finger at a time
    const dx = e.clientX - st.x0, dy = e.clientY - st.y0;
    if (!st.on) { if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { st = null; return; } if (Math.abs(dx) < 14) return; st.on = true; }
    st.dx = dx;
    const f = $('.task-face', st.row), b = $('.task-swipe', st.row);
    f.style.transition = 'none'; f.style.transform = `translateX(${dx}px)`;
    b.style.opacity = String(clamp(Math.abs(dx) / 90, 0, 1));
    b.style.background = dx > 0 ? 'rgb(var(--brand))' : 'rgb(var(--warn-bg))';
    b.style.color = dx > 0 ? 'rgb(var(--on-brand))' : 'rgb(var(--warn))';
    b.style.justifyContent = dx > 0 ? 'flex-start' : 'flex-end';
    b.children[0].style.display = dx > 0 ? '' : 'none'; b.children[1].style.display = dx > 0 ? 'none' : '';
  }, { passive: true });
  const end = (e) => {
    if (!st || e.pointerId !== st.id) return;
    const { row, dx, on } = st; st = null;
    if (!on) return;
    swallow = Date.now();
    const x = get(row.dataset.task);
    if (Math.abs(dx) < 90 || !x) { reset(row); return; }
    const f = $('.task-face', row);
    f.style.transition = 'transform .2s ease-out'; f.style.transform = `translateX(${dx > 0 ? '100%' : '-100%'})`;
    setTimeout(() => settle(() => (dx > 0 ? A['task-toggle']({ dataset: { id: x.id } }) : toTomorrow(x))).catch((err) => toast(err.message, 'bad')), 160);
  };
  document.addEventListener('pointerup', end, { passive: true });
  document.addEventListener('pointercancel', () => { if (st) { reset(st.row); st = null; } }, { passive: true });
  document.addEventListener('click', (e) => { if (Date.now() - swallow < 400 && e.target.closest('.task[data-task]')) { e.stopPropagation(); e.preventDefault(); } }, true); // a swipe is not a tap
})();

/* ===== Calendar: the month, and the day you tap underneath it ===== */
const calDay = () => (isYmd(route.sub) ? route.sub : today());
VIEWS.calendar = () => {
  const D = data(), t = today(), sel = calDay();
  const m0 = parseYmd(sel.slice(0, 7) + '-01'), y = m0.getFullYear(), mo = m0.getMonth();
  const first = ymd(m0), last = ymd(new Date(y, mo + 1, 0));
  const start = addDays(first, -parseYmd(first).getDay()); // weeks start on Sunday
  const end = addDays(last, 6 - parseYmd(last).getDay());
  const dows = [...Array(7)].map((_, i) => `<span>${parseYmd(addDays(start, i)).toLocaleDateString(undefined, { weekday: 'narrow' })}</span>`).join('');
  let cells = '';
  for (let d = start; d <= end; d = addDays(d, 1)) {
    const ev = eventsOn(D, d).length, tk = D.tasks.filter((x) => x.date === d || (x.done && x.doneDate === d && !x.date));
    const openN = tk.filter((x) => !x.done).length, doneN = tk.filter((x) => x.done).length, nt = notesOn(D, d).length;
    const dots = [ev ? '<i class="dot ev"></i>' : '', openN ? '<i class="dot task"></i>' : '', doneN ? '<i class="dot done"></i>' : '', nt ? '<i class="dot jr"></i>' : ''].join('');
    const label = [fmtDate(d, { weekday: 'long', month: 'long', day: 'numeric' }), ev && plural(ev, 'event'), openN && plural(openN, 'open task'), doneN && `${doneN} done`].filter(Boolean).join(', ');
    cells += `<button class="day${d.slice(0, 7) !== sel.slice(0, 7) ? ' out' : ''}${d === t ? ' today' : ''}" data-action="cal-pick" data-date="${d}" aria-pressed="${d === sel}" aria-label="${esc(label)}"><span class="day-n">${parseYmd(d).getDate()}</span><span class="dots">${dots}</span></button>`;
  }
  const shift = (n) => { const d = new Date(y, mo + n, 1); const want = Math.min(parseYmd(sel).getDate(), new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()); d.setDate(want); return ymd(d); };
  const right = `${sel.slice(0, 7) !== t.slice(0, 7) ? `<button class="pill mr-1" data-action="nav" data-to="calendar" data-sub="${t}">Today</button>` : ''}
    <button class="icon-btn" data-action="nav" data-to="calendar" data-sub="${shift(-1)}" aria-label="Previous month">${icon('left')}</button><button class="icon-btn" data-action="nav" data-to="calendar" data-sub="${shift(1)}" aria-label="Next month">${icon('right')}</button>`;
  return header(m0.toLocaleDateString(undefined, { month: 'long' }), String(y), right)
    + `<section class="card cal mt-1 !px-2"><div class="cal-grid dows" aria-hidden="true">${dows}</div><div class="cal-grid days" id="cal-grid">${cells}</div>
      <p class="legend px-2" aria-hidden="true"><span><i class="dot ev"></i>Event</span><span><i class="dot task"></i>To do</span><span><i class="dot done"></i>Done</span><span><i class="dot jr"></i>Note</span></p></section>`
    + dayAgenda(D, sel, t) + fab(sel);
};
function dayAgenda(D, d, t) {
  const events = eventsOn(D, d), tasks = tasksOn(D, d).sort((a, b) => Number(a.done) - Number(b.done) || byCreated(a, b));
  const habits = D.habits.filter((h) => habitDone(h, d)), notes = notesOn(D, d);
  const rel = relDate(d, t), title = ['Today', 'Tomorrow', 'Yesterday'].includes(rel) ? `${rel}, ${fmtDate(d, { month: 'short', day: 'numeric' })}` : fmtDate(d, { weekday: 'long', month: 'short', day: 'numeric' });
  return `<section class="agenda mt-6">${sectionH(esc(title),
      `<div class="flex gap-1.5"><button class="pill" data-action="note-new" data-date="${d}">${icon('plus')}Note</button><button class="pill" data-action="event-new" data-date="${d}">${icon('plus')}Event</button></div>`)}
    ${events.length ? `<div class="card mt-2 !py-1">${events.map(eventRow).join('')}</div>` : ''}
    <div class="mt-3">${addTaskForm(d, 'add-cal', 'Add a task for this day')}</div>
    ${tasks.length ? `<div class="card mt-3 !py-1">${tasks.map((x) => taskRow(x, t, { showDate: false })).join('')}</div>` : ''}
    ${habits.length ? `<p class="line-note mt-3 text-sm text-muted">Habits kept: ${habits.map((h) => esc(h.title)).join(', ')}</p>` : ''}
    ${notes.map((n) => `<button class="journal-peek mt-3 flex w-full items-center gap-3 rounded-2xl bg-raised p-3 text-left" data-action="note-open" data-id="${n.id}"><span class="face grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-sunk text-muted">${icon('notes')}</span><span class="min-w-0 flex-1 truncate font-medium">${esc(trunc(n.title || String(n.body || '').split('\n')[0], 80)) || 'Note'}</span></button>`).join('')}
  </section>`;
}
A['cal-pick'] = (el) => go('calendar', el.dataset.date);

/* Swipe the month left or right. */
(() => {
  let x0 = null, y0 = null;
  document.addEventListener('touchstart', (e) => { if (e.target.closest('#cal-grid')) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } else x0 = null; }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx) * 0.7) return;
    const s = calDay(), d = parseYmd(s.slice(0, 7) + '-01');
    d.setMonth(d.getMonth() + (dx < 0 ? 1 : -1));
    go('calendar', ymd(d));
  }, { passive: true });
})();

/* ===== Goals: what you want, why, by when, and the steps that get you there. The rest of the app measures
   everything you do against these, so this is where the brain learns what matters to you. ===== */
const GOAL_EXAMPLES = [
  { title: 'Finish Paper 2', why: 'Get it out before the conference', by: 'month' },
  { title: 'Read books', target: 12, unit: 'books', by: 'year' },
  { title: 'Get fit', why: 'More energy for long work days' },
  { title: 'Run 5 km', target: 5, unit: 'km' },
];
const byWhen = (k, t = today()) => (k === 'month' ? addDays(t, 30) : k === 'year' ? `${t.slice(0, 4)}-12-31` : k === 'quarter' ? addDays(t, 90) : '');
const md = (d) => fmtDate(d, { month: 'short', day: 'numeric' });
const goalLine = (D, g, t) => {
  const s = goalStatus(D, g, t);
  const left = g.by ? (s.daysLeft >= 0 ? `By ${md(g.by)}, ${plural(s.daysLeft, 'day')} left` : `Was due ${md(g.by)}`) : 'No deadline';
  const prog = goalIsNumber(g) ? `${goalNow(g)} of ${g.target}${g.unit ? ' ' + g.unit : ''}` : `${s.steps.filter((x) => x.done).length} of ${plural(s.steps.length, 'step')} done`;
  return { s, left, prog };
};
/* One line per goal for the AI: what, why, where it stands */
const goalForAI = (D, g, t) => { const { s, left, prog } = goalLine(D, g, t); return `${g.title}${g.why ? ` (why: ${trunc(g.why.replace(/\s+/g, ' '), 160)})` : ''} | ${prog} | ${left} | ${goalStateText(g, s)} | ${plural(s.open.length, 'open step')}`; };
/* The state in a word, and the detail behind it: "Behind", "at this pace Nov 25". */
const goalDetailText = (g, s) => (s.state === 'stalled' ? `nothing in ${s.idle} days`
  : s.state === 'behind' ? (s.eta ? `at this pace ${md(s.eta)}` : 'past its date')
  : s.state === 'on-track' && s.eta ? `about ${md(s.eta)}` : '');
const goalStateText = (g, s) => { const d = goalDetailText(g, s); return GOAL_WORDS[s.state] + (d ? ', ' + d : ''); };

VIEWS.goals = () => {
  const D = data(), t = today(), act = activeGoals(D), done = D.goals.filter(goalDone);
  const card = (g) => {
    const { s, left, prog } = goalLine(D, g, t), d = goalDetailText(g, s);
    return `<div class="gcard state-${s.state}"><button class="gcard-main" data-action="goal-open" data-id="${g.id}">
        <span class="flex items-start justify-between gap-3"><b class="gtitle">${esc(g.title)}</b><span class="state-pill state-${s.state} mt-0.5">${esc(GOAL_WORDS[s.state])}</span></span>
        <span class="meter mt-1"><i style="width:${Math.round(goalPct(g, D) * 100)}%"></i></span>
        <span class="flex flex-wrap justify-between gap-x-3 gap-y-0.5"><span class="gmeta font-semibold text-ink">${esc(prog)}</span><span class="gmeta">${esc(left)}</span></span>
        ${d ? `<span class="gstate text-sm text-muted">${esc(d[0].toUpperCase() + d.slice(1))}</span>` : ''}</button>
      ${goalIsNumber(g) && !goalDone(g) ? `<button class="plus" data-action="goal-inc" data-id="${g.id}" aria-label="Add 1 to ${esc(g.title)}">+1</button>` : ''}</div>`;
  };
  if (!D.goals.length) {
    return header('Goals', 'What you want, and whether you’re getting there')
      + `<section class="card goal-empty mt-2"><p class="font-display text-[19px] leading-snug">A goal is something you want, with or without a deadline.</p>
        <p class="mt-2 text-[15px] text-muted">Tie tasks and habits to it, and Home shows whether your days are really heading there.</p>
        <button class="btn primary mt-5 w-full" data-action="goal-new">${icon('plus')}Add your first goal</button>
        <p class="mb-2 mt-6 text-sm font-semibold text-muted">Or start from one of these</p>
        <div class="chips">${GOAL_EXAMPLES.map((e, i) => `<button class="chip" data-action="goal-example" data-i="${i}">${esc(e.title)}</button>`).join('')}</div></section>`
      + `<button class="fab" data-action="goal-new" aria-label="Add a goal">${icon('plus')}</button>`;
  }
  return header('Goals', `${plural(act.length, 'active goal')}`)
    + `<section class="mt-2">${act.map(card).join('') || '<p class="empty-line">Every goal is done. Add the next one.</p>'}</section>`
    + (done.length ? `<section class="mt-6"><button class="fold" data-action="fold" data-k="goalsDone" aria-expanded="${!!ui.goalsDone}">${icon('down')}Done <span class="count">${done.length}</span></button>${ui.goalsDone ? done.map(card).join('') : ''}</section>` : '')
    + `<button class="fab" data-action="goal-new" aria-label="Add a goal">${icon('plus')}</button>`;
};

/* ---- One goal up close: where it stands, its steps, its habits ---- */
A['goal-open'] = (el) => goalDetail(get(el.dataset.id));
function goalDetail(g) {
  if (!g) return;
  ui.goalOpen = g.id;
  const D = data(), t = today(), { s, left, prog } = goalLine(D, g, t), d = goalDetailText(g, s);
  const open = s.steps.filter((x) => !x.done).sort((a, b) => (a.date || '9').localeCompare(b.date || '9') || byCreated(a, b)), doneSteps = s.steps.filter((x) => x.done);
  const why = s.state === 'behind' && s.perWeekNeed ? `To make the date, about ${plural(s.perWeekNeed, 'step')} a week; lately ${s.perWeekNow}.` : s.state === 'stalled' ? `Nothing has moved it since ${s.last ? md(s.last) : 'you added it'}.` : '';
  openSheet({ title: g.title, body: `${g.why ? `<p class="gwhy">${esc(g.why)}</p>` : ''}
    <div class="gstate big state-${s.state} mt-3 flex flex-wrap items-center gap-2"><span class="state-pill state-${s.state}">${esc(GOAL_WORDS[s.state])}</span>${d ? `<span class="text-sm font-medium">${esc(d[0].toUpperCase() + d.slice(1))}</span>` : ''}</div>
    ${why ? `<p class="mt-2 text-sm text-muted">${esc(why)}</p>` : ''}
    <div class="state-${s.state} mt-4"><span class="meter"><i style="width:${Math.round(goalPct(g, D) * 100)}%"></i></span>
      <p class="mt-2 flex flex-wrap justify-between gap-x-3 text-sm"><span class="font-semibold">${esc(prog)}</span><span class="text-muted">${esc(left)}</span></p></div>
    ${goalIsNumber(g) ? `<button class="btn mt-4" data-action="goal-inc" data-id="${g.id}">+1 ${esc(g.unit || '')}</button>` : ''}
    <div class="sec-h mt-5"><h2>Steps</h2>${AI.provider() !== 'none' ? `<button class="link" data-action="goal-steps" data-id="${g.id}"><span class="ai-mark !h-5 !w-5">${icon('spark')}</span>Plan steps</button>` : ''}</div>
    <form class="add-row mt-1" data-form="goal-step" data-goal="${g.id}"><span class="add-ic">${icon('plus')}</span><input id="goal-step-in" name="title" placeholder="Add a step (try “… tomorrow”)" maxlength="300" autocomplete="off" enterkeyhint="done" aria-label="Add a step"></form>
    <div id="goal-steps" class="mt-1">${open.map((x) => taskRow(x, t, { showGoal: false })).join('')}${doneSteps.length ? `<p class="py-2 text-sm text-muted">${plural(doneSteps.length, 'step')} done</p>` : ''}</div>
    ${s.habits.length ? `<div class="sec-h mt-3"><h2>Habits for this goal</h2></div><div class="habits">${s.habits.map((h) => habitChip(h, t)).join('')}</div>` : ''}
    <div class="sheet-foot"><button class="btn" data-action="goal-edit" data-id="${g.id}">Edit</button>
      ${goalIsNumber(g) ? '' : `<button class="btn" data-action="goal-done" data-id="${g.id}">${g.done ? 'Reopen' : 'Mark done'}</button>`}
      <span class="spacer"></span><button class="btn primary" data-action="sheet-close">Done</button></div>` });
}
LB.goalDetail = goalDetail;

/* ---- Adding and editing a goal: four plain questions, only the first is needed ---- */
A['goal-new'] = () => goalForm(null);
A['goal-edit'] = (el) => goalForm(get(el.dataset.id));
A['goal-example'] = (el) => { const e = GOAL_EXAMPLES[Number(el.dataset.i)]; goalForm(null, { ...e, by: byWhen(e.by) }); };
function goalForm(g, preset = {}) {

      <label class="chip relative"><input type="date" name="by-other" id="goal-by" class="absolute inset-0 h-full w-full cursor-pointer opacity-0" aria-label="Other date" data-other="by">${icon('calendar')}<span data-other-label="by" data-empty="Other date">Other date</span></label></div></div>
    <div class="grid grid-cols-2 gap-3"><label class="field"><span>Counting something? <small>(optional)</small></span><input name="target" type="number" inputmode="numeric" min="0" max="100000" value="${Number(r.target) > 0 ? esc(r.target) : ''}" placeholder="12"></label>
      <label class="field"><span>Of what</span><input name="unit" value="${esc(r.unit || '')}" maxlength="20" placeholder="books"></label></div>
