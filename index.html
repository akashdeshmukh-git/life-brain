/* ===== Life Brain: plain and quiet, like the first good apps. Light, or true black. ===== */
:root {
  --bg: #ffffff; --card: #f6f7f9; --line: #e3e5e8; --text: #1f1f1f; --muted: #5f6368; --faint: #9aa0a6;
  --accent: #1a73e8; --bad: #d93025; --ok: #188038; --scrim: rgba(0, 0, 0, .32); --sheet: #ffffff;
  --tint: color-mix(in srgb, var(--accent) 14%, transparent);
  --r: 18px; --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #111214; --line: #26282b; --text: #e8eaed; --muted: #9aa0a6; --faint: #6b7075;
  --bad: #f28b82; --ok: #81c995; --scrim: rgba(0, 0, 0, .6); --sheet: #17181a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.45 var(--font); font-feature-settings: "cv11", "ss01"; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
svg { width: 22px; height: 22px; flex: none; }
.muted { color: var(--muted); }
.small { font-size: 14px; color: var(--muted); margin: 8px 0; }
.bad { color: var(--bad); }
.ok { color: var(--ok); }
.err { color: var(--bad); font-size: 14px; margin: 8px 0 0; }
.err:empty { display: none; }

/* ---- Layout ---- */
.app { max-width: 640px; margin: 0 auto; min-height: 100vh; }
main { padding: 0 16px calc(96px + var(--safe-b)); outline: none; }
.top { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top, 0px) + 18px) 0 14px; }
.top-text { flex: 1; min-width: 0; }
.top h1 { margin: 0; font-size: 30px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; }
.top-sub { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
.top-right { display: flex; align-items: center; gap: 2px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.icon-btn:active { background: var(--card); }
.card { background: var(--card); border-radius: var(--r); padding: 6px 16px; margin: 0 0 12px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.sec-h h2 { margin: 0; font-size: 15px; font-weight: 600; }
.sec-btns { display: flex; gap: 6px; }
.link { color: var(--accent); font-weight: 600; font-size: 14px; padding: 10px 4px; }
.empty { color: var(--muted); text-align: center; padding: 40px 12px; }
.empty-line { color: var(--muted); font-size: 14px; margin: 4px 0 12px; }
.mini-label { font-size: 12px; font-weight: 600; color: var(--muted); margin: 14px 4px 8px; text-transform: uppercase; letter-spacing: .06em; }
.banner { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--text); border-radius: 12px; padding: 10px 14px; margin: 12px 0 0; font-size: 14px; }

/* ---- Tabs ---- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 4px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding: 8px 8px calc(8px + var(--safe-b)); }
.tab { flex: 1; max-width: 140px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 500; color: var(--muted); }
.tab-ic { width: 60px; height: 30px; border-radius: 15px; display: grid; place-items: center; transition: background .2s; }
.tab[aria-current="page"] { color: var(--text); font-weight: 650; }
.tab[aria-current="page"] .tab-ic { background: var(--tint); color: var(--accent); }

/* ---- Tasks ---- */
.add-row { display: flex; align-items: center; gap: 12px; min-height: 52px; }
.add-ic { width: 26px; display: grid; place-items: center; color: var(--accent); }
.add-row input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; padding: 12px 0; }
.add-row input::placeholder { color: var(--muted); }
.task { display: flex; align-items: flex-start; gap: 12px; border-top: 1px solid var(--line); }
.circle { flex: none; width: 26px; height: 26px; margin: 13px 0; border-radius: 50%; border: 2px solid var(--faint); display: grid; place-items: center; color: transparent; transition: background .15s, border-color .15s; }
.circle svg { width: 16px; height: 16px; stroke-width: 3; }
.task.done .circle { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.task-main { flex: 1; min-width: 0; padding: 14px 0; display: flex; flex-direction: column; }
.task-title { overflow-wrap: anywhere; }
.task.done .task-title { text-decoration: line-through; color: var(--muted); }
.task-meta { font-size: 13px; color: var(--muted); margin-top: 1px; }
.mini-h { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); font-size: 13px; color: var(--bad); }
.fold { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 48px; border-top: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--muted); }
.fold svg { width: 18px; height: 18px; transition: transform .2s; transform: rotate(-90deg); }
.fold[aria-expanded="true"] svg { transform: none; }
.count { font-weight: 500; }
.event { display: flex; gap: 14px; width: 100%; padding: 12px 0; align-items: baseline; }
.event + .event { border-top: 1px solid var(--line); }
.event-time { flex: none; width: 72px; font-size: 13px; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.event-title { flex: 1; overflow-wrap: anywhere; }

/* ---- Habits ---- */
.habits { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 0 14px; }
.habit { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px 0 10px; border-radius: 20px; border: 1.5px solid var(--line); background: var(--bg); font-size: 15px; }
.habit-tick { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--faint); display: grid; place-items: center; color: transparent; }
.habit-tick svg { width: 13px; height: 13px; stroke-width: 3; }
.habit[aria-pressed="true"] { border-color: var(--accent); background: var(--tint); }
.habit[aria-pressed="true"] .habit-tick { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.streak { font-size: 12px; font-weight: 700; color: var(--accent); margin-left: 2px; }
.habit.add { padding: 0 12px; color: var(--muted); border-style: dashed; }
.habit.add svg { width: 18px; height: 18px; }

/* ---- Journal ---- */
.moods { display: flex; gap: 6px; margin: 0 0 8px; }
.mood { width: 44px; height: 44px; border-radius: 50%; font-size: 24px; display: grid; place-items: center; filter: grayscale(1); opacity: .55; transition: transform .15s; }

/* ===== Storage: IndexedDB on this device. Everything loads into memory at start; writes go straight through. ===== */
const TYPES = ['task', 'event', 'note', 'journal', 'habit', 'goal'];
const DB_NAME = 'lifebrain2';
const DEFAULT_SETTINGS = {
  theme: 'system', // system | light | dark
  accent: 'blue',
  ai: { active: 'auto', linked: [], models: {}, baseUrls: {}, timeoutSec: 60, rememberKeys: false },
};
const S = (LB.S = {
  records: new Map(),
  settings: structuredClone(DEFAULT_SETTINGS),
  aiKeys: {}, // provider id → key. Held in memory; stored only when the person turns that on.
  storage: 'pending', // ok | unavailable | error
  lastSnapshot: null,
  migrated: false,
});
let idb = null;
const listeners = [];
const onChange = (fn) => listeners.push(fn);
let emitQueued = false;
function emit() {
  if (emitQueued) return;
  emitQueued = true;
  queueMicrotask(() => { emitQueued = false; listeners.forEach((f) => f()); });
}

function openDB() {
  return new Promise((res, rej) => {
    let r;
    try { r = indexedDB.open(DB_NAME, 1); } catch (e) { return rej(e); }
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('records', { keyPath: 'id' });
      d.createObjectStore('meta', { keyPath: 'key' });
      d.createObjectStore('snapshots', { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('Database blocked by another open tab'));
  });
}
const txDo = (db, store, mode, fn) => new Promise((res, rej) => {
  if (!db) return res(null);
  let t, out;
  try { t = db.transaction(store, mode); out = fn(t.objectStore(store)); } catch (e) { return rej(e); }
  t.oncomplete = () => res(out && typeof out === 'object' && 'result' in out ? out.result : out);
  t.onerror = () => rej(t.error);
  t.onabort = () => rej(t.error || new Error('Transaction aborted'));
});
const idbDo = (store, mode, fn) => txDo(idb, store, mode, fn);
/* true = saved; null = no storage in this browser (a banner says so); false = the save failed. */
async function persist(store, fn) {
  if (!idb) return null;
  try { await idbDo(store, 'readwrite', fn); return true; }
  catch (e) { console.error('Save failed', e); S.storage = 'error'; emit(); return false; }
}
const NOT_SAVED = 'Not saved. This phone refused to store the change. Export a backup from Settings.';
const mustPersist = async (store, fn) => { if ((await persist(store, fn)) === false) throw new Error(NOT_SAVED); };
function mergeSettings(v) {
  const d = structuredClone(DEFAULT_SETTINGS);
  const ai = { ...d.ai, ...((v && v.ai) || {}) };
  ['models', 'baseUrls'].forEach((k) => { if (!ai[k] || typeof ai[k] !== 'object' || Array.isArray(ai[k])) ai[k] = {}; });
  if (!Array.isArray(ai.linked)) ai.linked = [];
  const out = { ...d, ...(v || {}), ai };
  if (!['system', 'light', 'dark'].includes(out.theme)) out.theme = 'system';
  return out;
}
async function dbInit() {
  try { idb = await openDB(); S.storage = 'ok'; }
  catch (e) { idb = null; S.storage = 'unavailable'; console.warn('IndexedDB unavailable', e); return; }
  try {
    for (const r of (await idbDo('records', 'readonly', (st) => st.getAll())) || []) S.records.set(r.id, r);
    for (const m of (await idbDo('meta', 'readonly', (st) => st.getAll())) || []) {
      if (m.key === 'settings') S.settings = mergeSettings(m.value);
      if (m.key === 'aiKeys' && m.value && typeof m.value === 'object') S.aiKeys = { ...m.value };
      if (m.key === 'lastSnapshot') S.lastSnapshot = m.value;
      if (m.key === 'migrated') S.migrated = !!m.value;
    }
  } catch (e) { S.storage = 'error'; console.error(e); }
}

const all = (type) => [...S.records.values()].filter((r) => r.type === type);
const get = (id) => (id ? S.records.get(id) || null : null);
/* quiet: save without redrawing the screen (used while typing, so the cursor isn't lost). */
async function put(rec, { quiet = false } = {}) {
  const now = new Date().toISOString();
  const r = { ...rec, id: rec.id || uid(), createdAt: rec.createdAt || now, updatedAt: now };
  S.records.set(r.id, r);
  if (!quiet) emit();
  await mustPersist('records', (st) => st.put(r));
  return r;
}
async function del(id) {
  S.records.delete(id);
  emit();
  await mustPersist('records', (st) => st.delete(id));
}
async function setMeta(key, value) { return mustPersist('meta', (st) => st.put({ key, value })); }
async function delMeta(key) { return mustPersist('meta', (st) => st.delete(key)); }
async function saveSettings(patch) {
  S.settings = mergeSettings({ ...S.settings, ...patch, ai: { ...S.settings.ai, ...(patch.ai || {}) } });
  emit();
  return setMeta('settings', S.settings);
}
async function setAiKey(provider, key) {
  if (key) S.aiKeys[provider] = key; else delete S.aiKeys[provider];
  await storeAiKeys();
  emit();
}
async function storeAiKeys() {
  if (S.settings.ai.rememberKeys && Object.keys(S.aiKeys).length) await setMeta('aiKeys', S.aiKeys); else await delMeta('aiKeys');
}
async function requestPersistence() { try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (_) {} }

/* ---- The earlier Life Brain: turn its records into the new kinds. Example data is left behind. ---- */
function fromOld(records, profile) {
  const out = [], now = new Date().toISOString();
  const keep = (r) => r && typeof r === 'object' && !r.ex && typeof r.id === 'string';
  const base = (r) => ({ id: r.id, createdAt: r.createdAt || now, updatedAt: r.updatedAt || now });
  for (const r of records.filter(keep)) {
    if (r.type === 'task' && (r.status === 'open' || r.status === 'done' || !r.status)) {
      const done = r.status === 'done';
      const note = [r.firstStep && 'First step: ' + r.firstStep, r.why].filter(Boolean).join('\n');
      out.push({ ...base(r), type: 'task', title: String(r.title || 'Task'), done, doneDate: done ? r.doneDate || r.statusDate || '' : '', date: isYmd(r.plannedDate) ? r.plannedDate : done && isYmd(r.doneDate) ? r.doneDate : '', note, moved: Number(r.deferrals) || 0 });
    } else if (r.type === 'event' && isYmd(r.date)) {
      out.push({ ...base(r), type: 'event', title: String(r.title || 'Event'), date: r.date, time: r.allDay ? '' : /^\d{1,2}:\d{2}$/.test(r.start || '') ? r.start : '', note: [r.location, r.notes].filter(Boolean).join('\n') });
    } else if (r.type === 'habit') {
      const log = {};
      for (const [d, v] of Object.entries(r.log || {})) if (isYmd(d) && v) log[d] = true;
      out.push({ ...base(r), type: 'habit', title: [r.emoji, r.title].filter(Boolean).join(' ') || 'Habit', log });
    } else if (r.type === 'memory' || r.type === 'insight') {
      out.push({ ...base(r), type: 'note', title: String(r.title || ''), body: [r.body, r.why && 'Why: ' + r.why].filter(Boolean).join('\n\n'), pinned: false });
    } else if (r.type === 'goal') {

        if (!db.objectStoreNames.contains('records')) { db.close(); return res(null); }

async function migrateOld() {

function exportData() {

  raw.forEach((r, i) => {

/* Tasks */

const journalId = (date) => 'journal-' + date;

/* ---- Patterns: what your own records show that's easy to miss. Plain sentences, only with enough data. ---- */
function patterns(D = data(), t = today()) {
  const out = [];
  // 1. Moods that move with a habit
  const moods = D.journals.filter((j) => Number(j.mood) > 0 && j.date <= t && daysBetween(j.date, t) <= 60);
  for (const h of D.habits) {
    const yes = moods.filter((j) => habitDone(h, j.date)).map((j) => Number(j.mood));
    const no = moods.filter((j) => !habitDone(h, j.date)).map((j) => Number(j.mood));
    if (yes.length < 4 || no.length < 4) continue;
    const a = yes.reduce((s, x) => s + x, 0) / yes.length, b = no.reduce((s, x) => s + x, 0) / no.length;
    if (Math.abs(a - b) >= 0.6) out.push({ id: 'mood-' + h.id, text: `Your mood is ${a > b ? 'better' : 'worse'} on days you do “${h.title}” (${a.toFixed(1)} vs ${b.toFixed(1)} out of 5).` });
  }
  // 2. A habit that slipped this week
  for (const h of D.habits) {
    const before = habitCount(h, addDays(t, -13), addDays(t, -7)), now = habitCount(h, addDays(t, -6), t);
    if (before >= 4 && now <= before - 3) out.push({ id: 'slip-' + h.id, text: `“${h.title}” slipped: ${plural(now, 'day')} this week, down from ${before}.` });
  }
  // 3. A task that keeps getting pushed
  const pushed = D.tasks.filter((x) => !x.done && (x.moved || 0) >= 3).sort((a, b) => b.moved - a.moved)[0];
  if (pushed) out.push({ id: 'moved-' + pushed.id, text: `“${pushed.title}” has been moved ${pushed.moved} times. Make it smaller, or let it go?` });
  // 4. Which weekday you get things done
  const from = addDays(t, -56), done = D.tasks.filter((x) => x.done && isYmd(x.doneDate) && x.doneDate >= from && x.doneDate <= t);
  if (done.length >= 15) {
    const first = done.reduce((m, x) => (x.doneDate < m ? x.doneDate : m), t);
    const per = [0, 0, 0, 0, 0, 0, 0], days = [0, 0, 0, 0, 0, 0, 0];
    for (let d = first; d <= t; d = addDays(d, 1)) days[parseYmd(d).getDay()]++;
    done.forEach((x) => per[parseYmd(x.doneDate).getDay()]++);
    const avg = per.map((n, w) => ({ w, v: days[w] ? n / days[w] : 0 })).filter((x) => days[x.w] >= 2);
    if (avg.length >= 5) {
      avg.sort((a, b) => b.v - a.v);
      const best = avg[0], worst = avg[avg.length - 1];
      if (best.v >= 1 && best.v >= worst.v * 2) out.push({ id: 'weekday', text: `You finish the most on ${weekdayName(best.w)}s and the least on ${weekdayName(worst.w)}s.` });
    }

  // 5. The overdue pile
  const over = D.tasks.filter((x) => isOverdue(x, t)).length;
  if (over >= 5) out.push({ id: 'overdue', text: `${over} tasks are overdue. Move or delete the ones that don’t matter any more.` });
  return out.slice(0, 4);
}

async function callProvider(p, user, signal) {

  const model = provModel(p);

    + (pinned.length ? `<p class="mini-label">Pinned</p><div class="notes">${pinned.map(card).join('')}</div>${rest.length ? '<p class="mini-label">Others</p>' : ''}` : '')
    + (rest.length ? `<div class="notes">${rest.map(card).join('')}</div>` : '')
    + (!notes.length ? `<p class="empty">${q ? 'No notes match.' : 'No notes yet. Tap + to write one.'}</p>` : '')
    + `<button class="fab" data-action="note-new" aria-label="New note">${icon('plus')}</button>`;
};
document.addEventListener('input', (ev) => { if (ev.target.dataset && ev.target.dataset.live === 'notes-q') { notesUI.q = ev.target.value; render(); } });

/* The note editor saves as you type. A new note is only created once something is written. */
let noteId = null;
A['note-new'] = () => noteSheet(null);
A['note-open'] = (el) => noteSheet(get(el.dataset.id));
function noteSheet(n) {
  noteId = n ? n.id : null;
  openSheet({ title: n ? 'Note' : 'New note', body: `<input class="note-title" id="note-title" data-note="title" value="${esc(n ? n.title : '')}" placeholder="Title" maxlength="200" aria-label="Title">
    <textarea class="note-body" id="note-body" data-note="body" rows="12" placeholder="Note" aria-label="Note">${esc(n ? n.body : '')}</textarea>
    <div class="row-end"><button type="button" class="btn" data-action="note-pin" id="note-pin" aria-pressed="${!!(n && n.pinned)}">${icon('pin')}${n && n.pinned ? 'Pinned' : 'Pin'}</button>
      <button type="button" class="btn danger" data-action="note-delete" ${n ? '' : 'hidden'} id="note-del">Delete</button><span class="spacer"></span><button class="btn primary" data-action="sheet-close">Done</button></div>` });
}
async function saveNote(patch) {
  const old = get(noteId);
  if (!old && !String(patch.title || patch.body || '').trim()) return;
  noteId = noteId || uid(); // set before saving, so quick typing can't create two notes
  const d = $('#note-del'); if (d) d.hidden = false;
  await put({ ...(old || { type: 'note', title: '', body: '', pinned: false }), ...patch, id: noteId }, { quiet: true });
}
document.addEventListener('input', (ev) => {
  const k = ev.target.dataset && ev.target.dataset.note;
  if (k) saveNote({ [k]: ev.target.value }).catch((e) => toast(e.message, 'bad'));
});
A['note-pin'] = async (el) => {
  const old = get(noteId), pinned = !(old && old.pinned);
  if (!old) { await saveNote({ title: $('#note-title').value || 'Untitled', body: $('#note-body').value, pinned }); }
  else await put({ ...old, pinned }, { quiet: true });
  el.setAttribute('aria-pressed', pinned);
  el.innerHTML = icon('pin') + (pinned ? 'Pinned' : 'Pin');
};
A['note-delete'] = async () => { if (noteId) await A.delete({ dataset: { id: noteId } }); };

/* ===== Progress: the week, streaks, goals, patterns, and AI ===== */
VIEWS.progress = () => {
  const D = data(), t = today(), w = weekStats(D, t), pats = patterns(D, t);
  const max = Math.max(1, ...w.perDay.map((x) => x.n));
  const stat = (n, l) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`;
  const grid28 = (h) => [...Array(28)].map((_, i) => { const d = addDays(t, i - 27); return `<i class="${habitDone(h, d) ? 'on' : ''}${d === t ? ' now' : ''}" title="${esc(fmtDate(d))}"></i>`; }).join('');
  return header('Progress', 'Last 7 days')
    + `<section class="card"><div class="stats">${stat(w.tasks, 'tasks done')}${stat(w.habitRate == null ? '–' : Math.round(w.habitRate * 100) + '%', 'habits kept')}${stat(`${w.journalDays}/7`, 'journal days')}${stat(w.mood == null ? '–' : moodFace(Math.round(w.mood)), 'mood')}</div>
      <div class="bars" aria-label="Tasks done each day">${w.perDay.map((x) => `<div class="bar"><small>${x.n || ''}</small><i style="height:${Math.round((x.n / max) * 72)}px" class="${x.n ? '' : 'zero'}"></i><span>${esc(parseYmd(x.d).toLocaleDateString(undefined, { weekday: 'narrow' }))}</span></div>`).join('')}</div></section>`
    + `<section class="card">${sectionH('What you might be missing')}
      ${pats.length ? `<ul class="pats">${pats.map((p) => `<li>${esc(p.text)}</li>`).join('')}</ul>` : '<p class="empty-line">Patterns show up here after a week or two of use.</p>'}
      <button class="btn block ai-btn" data-action="ask-ai">${icon('spark')}Ask AI what it sees</button></section>`
    + `<section class="card">${sectionH('Habits', '<button class="link" data-action="habit-new">Add</button>')}
      ${D.habits.length ? D.habits.sort(byCreated).map((h) => { const s = habitStreak(h, t); return `<button class="hrow" data-action="habit-edit" data-id="${h.id}"><span class="hrow-top"><b>${esc(h.title)}</b><span class="muted">${s ? `${plural(s, 'day')} streak` : 'No streak'} · ${habitCount(h, addDays(t, -27), t)}/28</span></span><span class="h28">${grid28(h)}</span></button>`; }).join('')
        : '<p class="empty-line">No habits yet.</p>'}</section>`
    + `<section class="card">${sectionH('Goals', '<button class="link" data-action="goal-new">Add</button>')}
      ${D.goals.length ? D.goals.sort(byCreated).map((g) => { const n = goalNow(g), done = n >= Number(g.target); return `<div class="goal${done ? ' done' : ''}"><button class="goal-main" data-action="goal-edit" data-id="${g.id}"><span class="goal-top"><b>${esc(g.title)}</b><span class="muted">${n} / ${esc(g.target)}${g.unit ? ' ' + esc(g.unit) : ''}</span></span><span class="meter"><i style="width:${Math.round(goalPct(g) * 100)}%"></i></span></button>
          <button class="icon-btn plus" data-action="goal-inc" data-id="${g.id}" aria-label="Add 1 to ${esc(g.title)}">${done ? icon('check') : '+1'}</button></div>`; }).join('')
        : '<p class="empty-line">Something to count toward, like 12 books or 30 runs.</p>'}</section>`;
};
A['ask-ai'] = () => askAI();

/* ---- Goals ---- */
A['goal-new'] = () => goalSheet(null);
A['goal-edit'] = (el) => goalSheet(get(el.dataset.id));
function goalSheet(g) {
  openSheet({ title: g ? 'Goal' : 'New goal', body: `<form class="form" data-form="goal" data-id="${g ? g.id : ''}">
    <label class="field"><span>Goal</span><input name="title" value="${esc(g ? g.title : '')}" maxlength="120" required autocomplete="off" placeholder="Read books"></label>
    <div class="two"><label class="field"><span>Target</span><input name="target" type="number" inputmode="numeric" min="1" max="100000" value="${esc(g ? g.target : '')}" required placeholder="12"></label>
      <label class="field"><span>Unit</span><input name="unit" value="${esc(g ? g.unit || '' : '')}" maxlength="20" placeholder="books"></label></div>
    ${g ? `<label class="field"><span>So far</span><input name="now" type="number" inputmode="numeric" min="0" max="100000" value="${goalNow(g)}"></label>` : ''}
    <p class="err" data-form-error></p>
    <div class="row-end">${g ? `<button type="button" class="btn danger" data-action="delete" data-id="${g.id}">Delete</button><span class="spacer"></span>` : ''}<button class="btn primary">Save</button></div></form>` });
}
F.goal = async (form, v) => {
  const title = String(v.title || '').trim(), target = Number(v.target);
  if (!title) throw new Error('Give the goal a name.');
  if (!Number.isFinite(target) || target < 1) throw new Error('The target is a number, 1 or more.');
  const old = get(form.dataset.id), log = { ...((old && old.log) || {}) };
  if (old && v.now !== undefined && v.now !== '') { // a correction is logged today, so the history still adds up
    const diff = Math.round(Number(v.now)) - goalNow(old);
    if (Number.isFinite(diff) && diff) log[today()] = (Number(log[today()]) || 0) + diff;
  }
  await put({ ...(old || { type: 'goal' }), title, target: Math.round(target), unit: String(v.unit || '').trim(), log });
  closeSheet();
};
A['goal-inc'] = async (el) => {
  const g = get(el.dataset.id);
  if (!g) return;
  const t = today(), log = { ...(g.log || {}) };
  log[t] = (Number(log[t]) || 0) + 1;
  await put({ ...g, log });
  haptic();
  if (goalNow({ log }) === Number(g.target)) toast(`Goal reached: ${g.title}`);
};

/* ===== Settings: look, AI, data ===== */
let snapCache = null;
const aiStatus = {}; // provider → { ok, text } from the last check
let pendingConn = null;
VIEWS.settings = (sub) => {
  const st = S.settings;
  if (!snapCache) listSnapshots().then((l) => { snapCache = l; if (route.name === 'settings') render(); }).catch(() => { snapCache = []; });
  if (sub === 'ai') setTimeout(() => { const el = $('#ai-card'); if (el) el.scrollIntoView({ block: 'start' }); }, 0);
  const offline = !window.LB_PWA ? '' : LB.swState === 'ready' ? 'Works offline.' : LB.swState === 'error' ? 'Offline mode could not be set up.' : 'Setting up offline mode…';
  return `<header class="top"><button class="icon-btn" data-action="nav" data-to="today" aria-label="Back">${icon('left')}</button><div class="top-text"><h1>Settings</h1></div></header>`
    + `<section class="card">${sectionH('Look')}
      <div class="seg" role="radiogroup" aria-label="Theme">${[['system', 'Auto'], ['light', 'Light'], ['dark', 'Dark']].map(([k, l]) => `<button role="radio" data-action="set-theme" data-v="${k}" aria-selected="${st.theme === k}" aria-checked="${st.theme === k}">${l}</button>`).join('')}</div>
      <div class="swatches" role="radiogroup" aria-label="Colour">${Object.entries(ACCENTS).map(([k, a]) => `<button class="swatch" role="radio" data-action="set-accent" data-v="${k}" aria-checked="${st.accent === k}" aria-label="${a.name}" title="${a.name}" style="--c:${isDark() ? a.dark : a.light}"></button>`).join('')}</div></section>`
    + `<section class="card" id="ai-card">${sectionH('AI')}${aiSection()}</section>`
    + `<section class="card">${sectionH('Your data')}
      <p class="small">Everything stays on this phone. No account, no server. ${offline}</p>
      <div class="chips"><button class="btn" data-action="export">Export backup</button><label class="btn" for="import-file">Import backup</label><input id="import-file" type="file" accept="application/json,.json" data-import hidden></div>
      <details class="more"><summary>Backups on this phone</summary>
        ${snapCache == null ? '<p class="small muted">Loading…</p>' : snapCache.length ? snapCache.map((s) => `<div class="srow"><span><b>${esc(new Date(s.at).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }))}</b><small>${esc(s.reason)} · ${plural(s.count, 'item')}</small></span><button class="btn sm" data-action="snap-restore" data-id="${s.id}">Restore</button></div>`).join('') : '<p class="small muted">One is made each day you open the app.</p>'}
        <p class="small muted">These sit in the same storage as your data. Export now and then to keep a copy somewhere else.</p></details>
      <button class="btn danger block" data-action="wipe">Delete everything</button></section>`
    + `<p class="about"><img src="${LB.LOGO}" alt="" width="28" height="28">Life Brain · ${esc(LB.BUILD || 'dev')}</p>`;
};
A['set-theme'] = async (el) => { await saveSettings({ theme: el.dataset.v }); applyTheme(); };
A['set-accent'] = async (el) => { if (ACCENTS[el.dataset.v]) { await saveSettings({ accent: el.dataset.v }); applyTheme(); } };

/* ---- AI: paste any key; the service is recognised, checked for free, and a model is picked. ---- */
function aiSection() {
  const ai = S.settings.ai, active = AI.provider(), conns = connected();
  const lost = (ai.linked || []).filter((p) => PROVIDERS[p] && !conns.includes(p));
  return `${conns.length ? conns.map((p) => connCard(p, active)).join('') : '<p class="small muted">Paste any API key. The app works out which service it is for.</p>'}
    ${lost.length ? `<p class="small muted">Paste the key again for ${esc(lost.map((p) => PROVIDERS[p].name).join(', '))}. Keys are forgotten when the app closes unless you keep them on this phone.</p>` : ''}
    <form class="form" data-form="ai-connect">
      <label class="field"><span>${conns.length ? 'Add another key' : 'API key'}</span><input id="f-aikey" name="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-or-…  sk-ant-…  AIza…  gsk_…" maxlength="400" data-live="ai-key"><small id="ai-detect"></small></label>
      <details class="more"><summary>Service and address</summary>
        <label class="field"><span>Service</span><select id="f-aiprov" name="provider"><option value="">Work it out from the key</option>${Object.entries(PROVIDERS).map(([k, v]) => `<option value="${k}">${esc(v.name)}</option>`).join('')}</select></label>
        <label class="field"><span>Address</span><input name="base" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="Leave empty for the usual one" maxlength="300"></label></details>
      <p class="err" data-form-error></p>
      <button class="btn primary block">Connect</button></form>
    <label class="check"><input type="checkbox" data-action="ai-remember" ${ai.rememberKeys ? 'checked' : ''}> Keep keys on this phone</label>
    <p class="small muted">Otherwise you paste the key again after closing the app. A kept key can be read by anyone with this phone, so use one with a spending limit. Keys are never in backups.</p>`;
}
function connCard(p, active) {
  const models = AIX.models[p], st = aiStatus[p], P = PROVIDERS[p];
  return `<div class="conn${active === p ? ' on' : ''}" data-conn="${p}"><div class="conn-top"><button class="radio-btn" data-action="ai-use" data-p="${p}" role="radio" aria-checked="${active === p}" aria-label="Use ${esc(P.name)}"></button><b>${esc(P.name)}</b><span class="muted small">${S.aiKeys[p] ? '••••' + esc(S.aiKeys[p].slice(-4)) : ''}</span></div>
    <label class="field"><span>Model</span><input list="models-${p}" value="${esc(provModel(p))}" data-model-for="${p}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type a model name">
      <datalist id="models-${p}">${(models || []).map((m) => `<option value="${esc(m.id)}">${esc(m.free ? 'free' : '')}</option>`).join('')}</datalist></label>
    ${st ? `<p class="small ${st.ok ? 'ok' : 'err'}" data-status="${p}">${esc(st.text)}</p>` : ''}
    <div class="chips"><button class="btn sm" data-action="ai-check" data-p="${p}">Check key</button><button class="btn sm danger" data-action="ai-remove" data-p="${p}">Remove</button></div></div>`;
}
document.addEventListener('input', (ev) => {
  if (ev.target.dataset.live !== 'ai-key') return;
  const d = detectProvider(ev.target.value), hint = $('#ai-detect'), sel = $('#f-aiprov');
  if (!hint) return;
  if (!ev.target.value.trim()) { hint.textContent = ''; return; }
  hint.textContent = d ? (d.sure ? `${PROVIDERS[d.id].name} key` : `Probably ${PROVIDERS[d.id].name}. If not, pick the service below.`) : 'Not sure which service this is. Pick it below.';
  if (d && sel && (!sel.value || sel.dataset.auto)) { sel.value = d.id; sel.dataset.auto = '1'; }
});
document.addEventListener('change', (ev) => {
  const p = ev.target.dataset && ev.target.dataset.modelFor;
  if (!p) return;
  const v = ev.target.value.trim();
  saveSettings({ ai: { models: { ...S.settings.ai.models, [p]: v } } }).then(() => toast(v ? `Using ${v}` : 'Model cleared')).catch((e) => toast(e.message, 'bad'));
});
async function commitConn({ p, key, base, models }) {
  if (key) S.aiKeys[p] = key;
  const ai = S.settings.ai;
  await saveSettings({ ai: {
    linked: [...new Set([...(ai.linked || []), p])], active: p,
    baseUrls: base ? { ...ai.baseUrls, [p]: base } : ai.baseUrls,
    models: { ...ai.models, [p]: ai.models[p] || (models ? pickModel(p, models) : PROVIDERS[p].fallback || '') },
  } });
  await storeAiKeys();
}
F['ai-connect'] = async (form, v) => {
  const key = String(v.key || '').trim(), d = detectProvider(key), p = v.provider || (d && d.id);
  if (!p || !PROVIDERS[p]) throw new Error('Can’t tell which service this key is for. Pick it under “Service and address”.');
  const P = PROVIDERS[p];
  if (!key && !P.local && p !== 'custom') throw new Error('Paste the key first.');
  if (/\s/.test(key)) throw new Error('The key has a space in it. Copy it again.');
  const base = String(v.base || '').trim().replace(/\/+$/, '');
  if (base) checkUrl(base);
  if (!base && !P.base) throw new Error('Add the server’s address. It usually ends in /v1.');
  const btn = $('button.primary', form), err = $('.err', form);
  btn.disabled = true; btn.textContent = 'Checking…';
  try {
    const models = await listModels(p, key, base || P.base);
    await commitConn({ p, key, base, models });
    aiStatus[p] = { ok: true, text: `Connected · ${plural(models.length, 'model')}` };
    render();
    toast(`Connected to ${P.name}`);
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Connect';
    if (['auth', 'credits', 'bad_url'].includes(e.code)) throw e;
    pendingConn = { p, key, base };
    err.innerHTML = `${esc(e.message)} <button type="button" class="btn sm" data-action="ai-connect-anyway">Save anyway</button>`;
  }
};
A['ai-connect-anyway'] = async () => {
  if (!pendingConn) return;
  const { p } = pendingConn;
  await commitConn(pendingConn);
  pendingConn = null;
  aiStatus[p] = { ok: false, text: 'Saved without checking. Type a model name if needed.' };
  render();
};
A['ai-use'] = async (el) => { await saveSettings({ ai: { active: el.dataset.p } }); };
A['ai-remove'] = async (el) => {
  const p = el.dataset.p, ai = S.settings.ai;
  delete S.aiKeys[p]; delete AIX.models[p]; delete aiStatus[p];
  await saveSettings({ ai: { linked: (ai.linked || []).filter((x) => x !== p), active: ai.active === p ? 'auto' : ai.active } });
  await storeAiKeys();
  toast(`${PROVIDERS[p].name} removed`);
};
A['ai-check'] = async (el) => {
  const p = el.dataset.p;
  el.disabled = true; el.textContent = 'Checking…';
  try { aiStatus[p] = { ok: true, text: await checkKey(p) }; } catch (e) { aiStatus[p] = { ok: false, text: e.message }; }
  render();
};
A['ai-remember'] = async (el) => {
  await saveSettings({ ai: { rememberKeys: !!el.checked } });
  await storeAiKeys();
  toast(el.checked ? 'Keys kept on this phone' : 'Keys kept in memory only');
};

/* ---- Data ---- */
function saveFile(filename, text) {
  const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Backup downloaded');
}
A.export = () => saveFile(`life-brain-backup-${today()}.json`, JSON.stringify(exportData(), null, 2));
document.addEventListener('change', async (ev) => {
  if (!ev.target.matches('[data-import]')) return;
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  if (file.size > 50 * 1024 * 1024) { toast('That file is too big to be a backup.', 'bad'); return; }
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (_) { toast('That file isn’t a backup.', 'bad'); return; }
  importPreview(validateImport(obj));
});
let pendingImport = null;
const NAMES = { task: 'tasks', event: 'events', note: 'notes', journal: 'journal entries', habit: 'habits', goal: 'goals' };
function importPreview(v) {
  pendingImport = v;
  openSheet({ title: 'Import backup', body: v.ok
    ? `<p>${Object.entries(v.counts).map(([k, n]) => `${n} ${NAMES[k]}`).join(', ') || 'Nothing in it.'}</p>
      <p class="small muted"><b>Add</b> keeps what you have and adds these. <b>Replace</b> clears everything first. A backup of what you have now is made either way.</p>
      <div class="row-end"><button class="btn" data-action="import-go" data-mode="replace">Replace</button><button class="btn primary" data-action="import-go" data-mode="merge">Add</button></div>`
    : `<p class="err">${v.errors.map(esc).join('<br>')}</p><div class="row-end"><button class="btn" data-action="sheet-close">Close</button></div>` });
}
LB.importPreview = importPreview;
A['import-go'] = async (el) => {
  if (!pendingImport || !pendingImport.ok) return;
  const mode = el.dataset.mode === 'replace' ? 'replace' : 'merge';
  if (mode === 'replace') {
    closeSheet();
    if (!(await confirmSheet({ title: 'Replace everything?', text: 'What you have now is replaced by the backup. A copy of it is kept under “Backups on this phone”.', confirmLabel: 'Replace', danger: true }))) return;
  }
  await importData(pendingImport, mode);
  pendingImport = null; snapCache = null;
  closeSheet();
  toast(mode === 'replace' ? 'Backup restored' : 'Backup added');
};
A['snap-restore'] = async (el) => {
  if (!(await confirmSheet({ title: 'Restore this backup?', text: 'What you have now is replaced. A copy of it is kept first, so you can undo this.', confirmLabel: 'Restore', danger: true }))) return;
  await restoreSnapshot(el.dataset.id);
  snapCache = null;
  toast('Backup restored');
};
A.wipe = async () => {
  if (!(await confirmSheet({ title: 'Delete everything?', text: 'Every task, event, note, journal entry, habit, goal, key and backup on this phone is erased. This can’t be undone.', confirmLabel: 'Delete everything', danger: true, requireText: 'DELETE' }))) return;
  await deleteEverything();
  snapCache = null;
  go('today');
  toast('Everything deleted');
};

/* ===== Start ===== */
function registerSW() {
  if (!window.LB_PWA || !('serviceWorker' in navigator)) return;
  LB.swState = 'pending';
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => { LB.swState = 'ready'; document.documentElement.dataset.sw = 'ready'; if (route.name === 'settings') render(); })
    .catch((e) => { console.warn('Service worker failed', e); LB.swState = 'error'; });
}
async function boot() {
  await dbInit();
  applyTheme();
  let moved = 0;
  try { moved = await migrateOld(); } catch (e) { console.error('Could not bring over old data', e); }
  Object.assign(route, parseHash());
  onChange(() => render(false));
  render(false);
  if (moved) toast(`Brought over ${plural(moved, 'item')} from the old version`);
  window.addEventListener('hashchange', () => { const r = parseHash(); if (r.name !== route.name || r.sub !== route.sub) { Object.assign(route, r); render(true); } });
  /* Past midnight, "today" changes: redraw when the app comes back. */
  let day = today();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== day) { day = today(); render(false); } });
  requestPersistence();
  autoSnapshot().catch(() => {});
  registerSW();
  LB.ready = true;
  document.documentElement.dataset.ready = '1';
}
boot().catch((e) => { console.error(e); $('#view').innerHTML = `<div class="empty">Life Brain couldn’t start: ${esc(e.message)}</div>`; });
</script>
