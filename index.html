const boardCols = (B) => `<div class="board-cols inline"><span>${B.cols[0]}</span><span>${B.cols[1]}</span></div>${B.html}`;
A['notices-jump'] = () => { const n = $('#notices'); if (n) n.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' }); };

function ruleTags(pol) {
  const e = Object.entries(pol);
  return e.length ? `<div class="cluster">${e.map(([k, v]) => `<span class="tag accent">${v.from === 'experiment' ? 'Testing' : 'Rule'}: ${esc(POLICIES[k].label(v.value))}</span>`).join('')}</div>` : '';
}
/* The morning plan: each row's bullet is its switch. Ticked rows get a departure time, in order from now. */
function planBoard(D, date, which) {
  const P = Loop.propose(D, date);
  const label = which === 'tomorrow' ? 'Plan tomorrow' : 'Plan today';
  // Changing a plan you already made: keep what you picked, and what's already done stays in it.
  const prev = Loop.day(D, date), doneIds = prev ? prev.plannedIds.filter((id) => doneOn(D, id, date)) : [];
  if (prev && prev.plannedIds.length) P.items = P.items.map((i) => ({ ...i, selected: prev.plannedIds.includes(i.x.id) }));
  const doneNote = doneIds.length ? `<p class="small muted">Already done, stays in the plan: ${doneIds.map((id) => esc(D.tasks.find((x) => x.id === id).title)).join(', ')}.</p>` : '';
  if (!P.items.length && !doneIds.length) return { cols: [label, ''], html: `<section class="next board"><div class="board-msg"><b class="next-title msg-title">Nothing to plan</b><p class="muted">Add what’s on your mind below. It will be suggested here.</p></div></section>` };
  const k = P.pol.estimate ? Number(P.pol.estimate.value) : 1;
  // Ticked tasks plus a few alternatives stay in view; the rest fold away.
  const lastSel = P.items.reduce((m, it, i) => (it.selected ? i : m), -1), shown = Math.min(P.items.length, Math.max(lastSel + 1, P.items.filter((it) => it.selected).length) + 3);
  const start = startFor(date);
  let clock = start;
  const rows = P.items.map(({ x, minutes, selected, tooBig, overDay, needsStep }, i) => {
    const unclear = (x.skips || []).filter((s) => s.reason === 'unclear').length;
    const askStep = needsStep || (!x.firstStep && unclear >= 2);
    const ch = Brain.chain(D, x), at = selected ? clock : null;
    if (selected) clock += minutes;
    const more = i === shown ? `</div><details class="disclosure plan-more"><summary>${plural(P.items.length - shown, 'more option')}</summary><div class="plan-list">` : '';
    return `${more}<label class="dep plan-row"><input type="checkbox" class="pick" name="sel" value="${x.id}" data-min="${minutes}" ${selected ? 'checked' : ''}>${lineBullet(Lines.forTask(D, x))}
      <span class="dep-main"><span class="item-title">${esc(x.title)}</span>
      ${planMeta([ch.linked ? esc(ch.head) : '', tooBig ? '<b class="warn-text">Longer than your rule allows</b>' : overDay ? '<b class="warn-text">Bigger than your usual day</b>' : '', (x.deferrals || 0) >= 3 ? `Put off ${x.deferrals} times${unclear >= 2 ? `, ${unclear} as unclear` : ''}` : ''])}
      <span class="dep-at" data-at data-m="${at ?? ''}">${at == null ? '—' : clockAt(at)}</span>
      ${askStep ? `<input class="input" name="fs_${x.id}" aria-label="First step for ${esc(x.title)}" placeholder="${needsStep ? 'First step (your rule asks for one)' : 'Write a first step'}" maxlength="200" value="${esc(x.firstStep || '')}">` : x.firstStep ? `<span class="item-meta">Start with: ${esc(x.firstStep)}</span>` : ''}</span>
      ${depTime(bigTime(minutes), 'takes about ' + fmtMin(minutes))}</label>`;
  }).join('');
  return { cols: [label, 'Takes'], html: `<section class="next board"><form data-form="commit-plan" data-date="${date}" class="stack" style="gap:.7rem">
    <p class="small muted board-intro">Sized to what you really get done: about <b class="num">${fmtMin(P.budget.minutes)}</b> of planned work a day${P.budget.from === 'history' ? `, the median of your last ${plural(P.budget.n, 'closed day')}` : ', from your settings until you’ve closed 3 days'}.${k !== 1 ? ` Estimates are multiplied by ${k}.` : ''} Tap a bullet to add or remove a task.</p>
    ${ruleTags(P.pol)}${doneNote}
    <div class="plan-list deps">${rows}</div>${shown < P.items.length ? '</details>' : ''}
    <p class="small" id="plan-total" data-budget="${P.budget.minutes}" data-start="${start}">${planTotalText(P.items.filter((i) => i.selected).reduce((s, i) => s + i.minutes, 0), P.items.filter((i) => i.selected).length, P.budget.minutes, start)}</p>
    <p class="err" data-form-error></p>
    <div class="task-actions"><button class="btn primary block">Commit plan</button></div></form></section>` };
}
const planMeta = (parts) => { const p = parts.filter(Boolean); return p.length ? `<span class="item-meta">${p.join('. ')}</span>` : ''; };
const planTotalText = (m, n, budget, start) => `${plural(n, 'task')}, about ${fmtMin(m)}${n ? `, ${finishText(start + m)}` : ''}.${m > budget ? ` <b class="warn-text">${fmtMin(m - budget)} more than you usually manage.</b>` : ''}`;
/* Ticking a task re-times the board: departures follow in order from the first. */
document.addEventListener('change', (ev) => {
  const form = ev.target.closest && ev.target.closest('form[data-form="commit-plan"]');
  if (!form || ev.target.name !== 'sel') return;
  const out = $('#plan-total', form), start = Number(out.dataset.start);
  let clock = start;
  $$('.plan-row', form).forEach((row) => {
    const box = $('[name="sel"]', row), at = $('[data-at]', row);
    if (box.checked) { at.textContent = clockAt(clock); at.dataset.m = clock; clock += Number(box.dataset.min); }
    else { at.textContent = '—'; at.dataset.m = ''; }
  });
  out.innerHTML = planTotalText(clock - start, $$('[name="sel"]:checked', form).length, Number(out.dataset.budget), start);
});
F['commit-plan'] = async (form) => {
  const D = data(), date = form.dataset.date, pol = Loop.policies(D), old = Loop.day(D, date);
  const doneIds = old ? old.plannedIds.filter((id) => doneOn(D, id, date)) : [];
  const ids = [...doneIds, ...$$('[name="sel"]:checked', form).map((i) => i.value).filter((id) => !doneIds.includes(id))];
  if (!ids.length) throw new Error('Pick at least one task, or add one below.');
  if (pol.cap && ids.length > Number(pol.cap.value)) throw new Error(`Your ${pol.cap.from === 'experiment' ? 'experiment' : 'rule'} says at most ${pol.cap.value} tasks. Untick one, or change the rule in Memory → Rules.`);
  for (const id of ids.filter((i) => !doneIds.includes(i))) {
    const x = get(id), step = String((form.elements['fs_' + id] || {}).value || '').trim();
    if (pol.firstStep && !x.firstStep && !step) throw new Error(`Write a first step for “${x.title}”. Your ${pol.firstStep.from === 'experiment' ? 'experiment' : 'rule'} asks for one.`);
    if (pol.maxSize && Loop.minutes(x, pol) > Number(pol.maxSize.value)) throw new Error(`“${x.title}” is longer than ${fmtMin(pol.maxSize.value)}. Split it, or shrink its estimate, first.`);
  }
  let minutes = 0;
  for (const id of ids) {
    const x = get(id), step = String((form.elements['fs_' + id] || {}).value || '').trim();
    minutes += Loop.minutes(x, pol);
    if (!doneIds.includes(id)) await put({ ...applyTaskPlan(x, { ...x, plannedDate: date }), firstStep: step || x.firstStep || '' });
  }
  for (const x of all('task')) if (x.status === 'open' && x.plannedDate === date && !ids.includes(x.id)) await put({ ...x, plannedDate: '' });
  await put({ ...(old || {}), type: 'day', date, plannedIds: ids, minutes, committedAt: new Date().toISOString(), kept: [], missed: [], extras: [] });
  haptic('success');
  toast(`Plan set: ${plural(ids.length, 'task')}.`);
};

/* The day as departures: what's live, what's next and when it leaves, and how long until each one. */
function todayBoard(D, day, t, hour) {
  const tasks = day.plannedIds.map((id) => D.tasks.find((x) => x.id === id)).filter(Boolean);
  const isDone = (x) => x.status === 'done' && x.doneDate === t;
  const moved = (x) => !isDone(x) && (x.status !== 'open' || x.plannedDate !== t);
  const pol = Loop.policies(D), now = nowMin();
  const live = tasks.find((x) => isLive(x, t));
  const nextTask = live || tasks.find((x) => !isDone(x) && !moved(x));
  const done = tasks.filter(isDone).length;
  let clock = live ? Math.max(now, now - elapsedMin(live) + Loop.minutes(live, pol)) : now;

/* ===== Calendar ===== */
const cal = { month: null, sel: null, mode: 'month' };
VIEWS.calendar = () => {
  const D = data(), t = today();
  cal.month = cal.month || t.slice(0, 7);
  cal.sel = cal.sel || t;
  const loadCls = (r) => (r > 1 ? 'bad' : r > 0.8 ? 'warn' : '');
  const weekLoads = [...Array(7)].map((_, i) => Brain.dayLoad(D, addDays(weekStart(t), i), t));
  const wkTotal = weekLoads.reduce((s, l) => s + l.total, 0), wkCap = weekLoads.reduce((s, l) => s + l.cap, 0);
  const overDays = weekLoads.filter((l) => l.ratio > 1).length;
  const conflicts = Brain.overlaps(D.events.filter((e) => isYmd(e.date) && e.date >= t));
  const conflictIds = new Set(conflicts.flat().map((e) => e.id));
  const dayPanel = (d) => {
    const L = Brain.dayLoad(D, d, t);
    const evs = L.events.slice().sort((a, b) => (a.start || '').localeCompare(b.start || ''));
    return `<div class="split" style="margin-top:4px"><h3 style="font-size:17px;font-weight:600">${fmtDate(d, { weekday: 'long', month: 'long', day: 'numeric' })}</h3><button class="btn sm primary" data-action="add" data-type="event" data-date="${d}">${icon('plus')}Event</button></div>
      <div class="meter ${loadCls(L.ratio)}" style="margin-top:10px"><i style="width:${Math.min(100, L.ratio * 100)}%"></i><span class="mark" style="left:80%"></span></div>
      <p class="xs muted" style="margin-top:6px">${fmtMin(L.total)} of ${fmtMin(L.cap)} capacity · ${fmtMin(L.eventMin)} events · ${fmtMin(L.taskMin)} tasks</p>
      <div class="list" style="margin-top:10px">${evs.map((e) => `<button class="item" data-action="edit" data-id="${e.id}"><span class="num muted small" style="width:92px;flex:none">${e.allDay ? 'All day' : esc(e.start || '—') + (e.end ? '–' + esc(e.end) : '')}</span><span class="item-main"><span class="item-title">${esc(e.title)}</span>${e.location || e.notes ? `<span class="item-meta">${esc([e.location, trunc(e.notes, 80)].filter(Boolean).join(' · '))}</span>` : ''}</span>${conflictIds.has(e.id) ? '<span class="tag bad">Overlaps</span>' : ''}</button>`).join('')}
      ${L.tasks.map((x) => `<button class="item" data-action="edit" data-id="${x.id}"><span class="num muted small" style="width:92px;flex:none">Task</span><span class="item-main"><span class="item-title">${esc(x.title)}</span><span class="item-meta">${x.status === 'done' ? 'Done' : x.estimateMin ? fmtMin(x.estimateMin) : 'No estimate'}</span></span></button>`).join('')}
      ${!evs.length && !L.tasks.length ? '<div class="empty" style="margin-top:10px">Nothing on this day.</div>' : ''}</div>`;
  };
  let body;
  if (cal.mode === 'month') {
    const first = parseYmd(cal.month + '-01');
    const start = weekStart(ymd(first));
    const last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
    const cells = Math.ceil((daysBetween(start, ymd(last)) + 1) / 7) * 7;
    body = `<div class="cal" role="grid">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d) => `<div class="dow">${d}</div>`).join('')}
      ${[...Array(cells)].map((_, i) => {
        const d = addDays(start, i), L = Brain.dayLoad(D, d, t);
        return `<button class="day ${d.slice(0, 7) !== cal.month ? 'out' : ''} ${d === t ? 'today' : ''}" data-action="cal-select" data-date="${d}" aria-pressed="${d === cal.sel}" aria-label="${fmtDate(d, { weekday: 'long', month: 'long', day: 'numeric' })}, ${plural(L.events.length, 'event')}, ${pct(L.ratio)} of capacity">
          <span class="dn">${Number(d.slice(8))}</span><span class="dots">${L.events.slice(0, 3).map(() => '<i></i>').join('')}</span>
          ${L.total ? `<span class="load ${loadCls(L.ratio)}"><i style="width:${Math.min(100, L.ratio * 100)}%"></i></span>` : ''}</button>`;
      }).join('')}</div>
      <div class="section">${dayPanel(cal.sel)}</div>`;
  } else {
    const days = [...Array(30)].map((_, i) => addDays(t, i)).map((d) => ({ d, L: Brain.dayLoad(D, d, t) })).filter(({ L }) => L.events.length || L.tasks.length);
    body = days.length ? days.map(({ d, L }) => `<div class="agenda-day"><h3>${d === t ? 'Today' : fmtDate(d, { weekday: 'long', month: 'short', day: 'numeric' })}${L.ratio > 1 ? '<span class="tag bad">Over capacity</span>' : L.ratio > 0.8 ? '<span class="tag warn">Tight</span>' : ''}</h3><div class="list">
      ${L.events.slice().sort((a, b) => (a.start || '').localeCompare(b.start || '')).map((e) => `<button class="item" data-action="edit" data-id="${e.id}"><span class="num muted small" style="width:92px;flex:none">${e.allDay ? 'All day' : esc(e.start || '—') + (e.end ? '–' + esc(e.end) : '')}</span><span class="item-main"><span class="item-title">${esc(e.title)}</span>${e.location ? `<span class="item-meta">${esc(e.location)}</span>` : ''}</span>${conflictIds.has(e.id) ? '<span class="tag bad">Overlaps</span>' : ''}</button>`).join('')}
      ${L.tasks.map((x) => `<button class="item" data-action="edit" data-id="${x.id}"><span class="num muted small" style="width:92px;flex:none">Task</span><span class="item-main"><span class="item-title">${esc(x.title)}</span></span></button>`).join('')}</div></div>`).join('')
      : '<div class="empty">Nothing in the next 30 days.</div>';
  }
  const m = parseYmd(cal.month + '-01');
  return head(`This week: ${fmtMin(wkTotal)} of ${fmtMin(wkCap)}${overDays ? ` · ${plural(overDays, 'day')} over` : ''}`, 'Calendar', `<button class="btn primary" data-action="add" data-type="event" data-date="${cal.sel}">${icon('plus')}Event</button>`)
    + `<div class="split" style="margin-bottom:14px"><div class="seg" role="group" aria-label="View"><button data-action="cal-mode" data-mode="month" aria-pressed="${cal.mode === 'month'}">Month</button><button data-action="cal-mode" data-mode="agenda" aria-pressed="${cal.mode === 'agenda'}">Agenda</button></div>
      ${conflicts.length ? `<span class="tag bad">${plural(conflicts.length, 'overlap')}</span>` : ''}</div>`
    + (cal.mode === 'month' ? `<div class="cal-head"><button class="icon-btn" data-action="cal-shift" data-n="-1" aria-label="Previous month">${icon('left')}</button><h2>${m.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</h2><div class="cluster"><button class="btn sm" data-action="cal-today">Today</button><button class="icon-btn" data-action="cal-shift" data-n="1" aria-label="Next month">${icon('right')}</button></div></div>` : '')
    + body;
};
A['cal-select'] = (el) => { cal.sel = el.dataset.date; if (el.dataset.date.slice(0, 7) !== cal.month) cal.month = el.dataset.date.slice(0, 7); render(); };
A['cal-shift'] = (el) => { const d = parseYmd(cal.month + '-01'); d.setMonth(d.getMonth() + Number(el.dataset.n)); cal.month = ymd(d).slice(0, 7); render(); };

/* ===== Lines: your life areas as subway lines, each with its own letter and colour ===== */

      : '<div class="empty">Close a few days and this shows which parts of your life get done and which keep slipping.</div>');

A['line-open'] = (el) => {
  const D = data(), a = get(el.dataset.id), t = today();

/* ===== Month: a record of your days, not an appointment book. Each day shows a dot per task in its line's
   colour: filled if it happened, a ring if it didn't, a faint ring if it's still planned. Tap a day for detail. ===== */
const month = { line: '' }; // optional line filter
const monthKey = () => (/^\d{4}-\d{2}$/.test(route.sub) ? route.sub : today().slice(0, 7));
/* Everything a day holds: planned tasks with what became of them, unplanned finishes, events. */
function dayRecord(D, date, t = today()) {
  const rec = Loop.day(D, date), items = [];
  const task = (id) => D.tasks.find((x) => x.id === id);
  const planned = rec && (rec.plannedIds || []).length ? rec.plannedIds : null;
  if (planned && (rec.reviewedAt || date >= t)) {
    for (const id of planned) {
      const x = task(id); if (!x) continue;
      const miss = (rec.missed || []).find((m) => m.id === id);
      const state = rec.reviewedAt ? ((rec.kept || []).includes(id) ? 'kept' : 'missed') : x.status === 'done' && x.doneDate === date ? 'kept' : 'planned';
      items.push({ x, state, reason: miss && miss.reason });
    }
  } else if (date >= t) {
    D.tasks.filter((x) => x.status === 'open' && x.plannedDate === date).forEach((x) => items.push({ x, state: 'planned' }));
  }
  D.tasks.filter((x) => x.status === 'done' && x.doneDate === date && !items.some((i) => i.x.id === x.id)).forEach((x) => items.push({ x, state: 'extra' }));
  const events = D.events.filter((e) => e.date === date);
  const closed = !!(rec && rec.reviewedAt && !rec.unknown && (rec.plannedIds || []).length);
  return { rec, items, events, closed, unknown: !!(rec && rec.unknown), open: !!(planned && !rec.reviewedAt && date < t) };
}
/* Which weekdays your plans hold up on, once there are at least two closed days of each to compare. */
function weekdayPattern(D, t = today()) {
  const by = {};
  for (const d of Loop.reviewed(D, addDays(t, -56), t)) {
    const w = parseYmd(d.date).getDay();
    (by[w] = by[w] || { planned: 0, kept: 0, days: 0 }).days++;
    by[w].planned += d.plannedIds.length; by[w].kept += (d.kept || []).length;
  }
  const rows = Object.entries(by).filter(([, v]) => v.days >= 2 && v.planned).map(([w, v]) => ({ w: Number(w), rate: v.kept / v.planned }));
  if (rows.length < 2) return null;
  rows.sort((a, b) => b.rate - a.rate);
  const best = rows[0], worst = rows[rows.length - 1];
  if (best.rate - worst.rate < 0.2) return null;
  const name = (w) => new Date(2024, 0, 7 + w).toLocaleDateString(undefined, { weekday: 'long' }); // 7 Jan 2024 was a Sunday
  return `Your plans hold up best on ${name(best.w)}s (${pct(best.rate)} kept) and worst on ${name(worst.w)}s (${pct(worst.rate)}).`;
}

F['exp-finish'] = async (form, v) => {

  const outcome = String(v.outcome || '').trim(), learning = String(v.learning || '').trim();

  if (v.remember) await put({ type: 'memory', kind: status === 'done' ? 'worked' : 'failed', title: `${e.title}: ${trunc(learning, 70)}`, body: `Hypothesis: ${e.hypothesis}\nOutcome: ${outcome}\nLearning: ${learning}${v.adaptation ? `\nNext: ${v.adaptation}` : ''}`, date: today(), links: [e.id] });

};

/* ===== Learning & Memory ===== */
const mem = { kind: 'all', q: '' };

    <span class="item-title">${esc(m.title)}</span>${m.body ? `<span class="item-meta">${esc(trunc(m.body, 160))}</span>` : ''}${m.why ? `<span class="item-meta">Why: ${esc(trunc(m.why, 120))}</span>` : ''}</span></button>`).join('')}</div>`

};
A['mem-kind'] = (el) => { mem.kind = el.dataset.k; render(); };
document.addEventListener('input', (ev) => {

/* ===== Brain ===== */
let showDismissed = false;
VIEWS.brain = () => {
  const D = data(), t = today();
  const all_ = Brain.analyze(D, t);
  const dismissed = all_.filter((f) => Brain.verdict(D, f.id)?.status === 'rejected');
  const shown = all_.filter((f) => showDismissed || Brain.verdict(D, f.id)?.status !== 'rejected');
  const prov = AI.provider();
  const tool = (action, title, text) => `<button class="card" style="text-align:left;cursor:pointer;color:inherit;display:grid;gap:4px;align-content:start;font:inherit" data-action="${action}"><b>${title}</b><span class="small muted">${text}</span></button>`;
  return head(`Local Brain · ${prov === 'none' ? 'external AI not set up' : esc(AI.providerName(prov))}`, 'Brain')
    + `<div class="grid-2">${tool('brain-analyze', 'Analyze life', 'A read of direction, load and reality.')}${tool('brain-decide', 'Help me decide', 'Weigh options against your values.')}${tool('brain-suggest', 'Suggest experiments', 'Small tests for what is not working.')}${tool('brain-ask', 'Ask anything', 'Search your records, then ask AI.')}</div>`
    + section(`Diagnose · ${plural(shown.length, 'finding')}`, shown.length ? `<div class="list">${shown.map((f) => findingRow(f, D)).join('')}</div>` : '<div class="empty">The local Brain found nothing worth flagging. It checks structure, load, conflicts, delays, estimates, plan-keeping, experiments and habits.</div>',
      dismissed.length ? `<button class="btn ghost sm" data-action="toggle-dismissed">${showDismissed ? 'Hide' : 'Show'} ${dismissed.length} dismissed</button>` : '')
    + `<p class="xs muted section">The local Brain uses only your stored records and runs on this device. It offers competing explanations with a confidence, never certainty. You can agree, reject or annotate every conclusion.</p>`;
};
A['toggle-dismissed'] = () => { showDismissed = !showDismissed; render(); };
function findFinding(id) { return Brain.analyze(data(), today()).find((f) => f.id === id); }
A.finding = (el) => {
  const D = data(), f = findFinding(el.dataset.id);
  if (!f) { toast('That finding no longer applies.', 'bad'); render(); return; }
  const v = Brain.verdict(D, f.id);
  openSheet({ title: 'Diagnosis', body: `<div class="stack">
      <div class="cluster">${sevTag(f.severity)}${f.uncertain ? '<span class="tag">Uncertain: evidence is thin</span>' : ''}</div>
      <h3 style="font-size:18px">${esc(f.title)}</h3><p class="muted">${esc(f.summary)}</p>
      ${f.evidence.length ? `<div><div class="eyebrow" style="margin-bottom:4px">Evidence</div><ul class="evidence">${f.evidence.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></div>` : ''}
      ${f.hypotheses ? `<div class="eyebrow" style="margin-top:6px">Competing explanations</div>${f.hypotheses.map((h) => `<div class="hyp"><div class="split"><span class="hyp-label">${h.label}</span><span class="xs muted">${confLabel(h.confidence)} confidence</span></div><b>${esc(h.text)}</b>
        <div class="conf"><div class="meter"><i style="width:${Math.round(h.confidence * 100)}%"></i></div><span class="num xs">${pct(h.confidence)}</span></div><ul class="evidence">${h.evidence.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></div>`).join('')}
        <p class="xs muted">Confidence comes from simple counts in your records and is capped below certainty. Explanations can all be partly true.</p>` : ''}
      ${f.wouldChange ? `<div><div class="eyebrow" style="margin-bottom:4px">What would change this conclusion</div><ul class="evidence">${f.wouldChange.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></div>` : ''}
    </div>
    <form class="form section" data-form="verdict" data-fid="${esc(f.id)}" data-title="${esc(f.title)}">
      ${fieldHTML(['note', 'Your note (optional)', 'area', { ph: 'What the Brain is missing, or what you think is really going on' }], v ? v.note : '')}
      <div class="form-actions">${v ? `<span class="tag ${v.status === 'accepted' ? 'good' : ''}" style="margin-right:auto">${v.status === 'accepted' ? 'You agreed' : v.status === 'rejected' ? 'You rejected this' : 'Noted'}</span>` : ''}
        <button class="btn" name="status" value="rejected">Reject</button><button class="btn" name="status" value="noted">Save note</button><button class="btn primary" name="status" value="accepted">Agree</button></div></form>
    <div class="form-actions" style="margin-top:4px">
      ${f.route ? `<button class="btn sm ghost" data-action="nav" data-to="${f.route.split('-')[0]}" data-sub="${f.route.split('-')[1] || ''}">Go to it</button>` : ''}
      ${f.suggest ? `<button class="btn sm" data-action="start-suggested" data-fid="${esc(f.id)}">Turn into experiment</button>` : ''}
      <button class="btn sm" data-action="finding-ai" data-fid="${esc(f.id)}">Ask AI about this</button></div>` });
};
document.addEventListener('click', (ev) => { const b = ev.target.closest('form[data-form="verdict"] button[name="status"]'); if (b) b.form.dataset.status = b.value; }, true);
F.verdict = async (form, v) => {

A['start-suggested'] = (el) => {

};
A['finding-ai'] = (el) => {

  const extra = [`Finding: ${f.title}`, f.summary, ...f.evidence.map((e) => '- ' + e), ...(f.hypotheses || []).map((h) => `${h.label} (${confLabel(h.confidence)}): ${h.text} Evidence: ${h.evidence.join(' ')}`)].join('\n');
  askAI({ title: 'Diagnose with AI', question: 'Reason about this finding. Do the local hypotheses hold up? Is there an explanation they miss? What single piece of information would most change the conclusion? Suggest one small experiment.', scopes: ['direction', 'plan', 'reality'], extra, saveAs: 'pattern' });
};

/* Analyze life: a local read first, AI optional. */
A['brain-analyze'] = () => {
  const D = data(), t = today();
  const open = D.tasks.filter((x) => x.status === 'open');
  const linked = open.filter((x) => Brain.chain(D, x).linked).length;
  const goals = D.goals.filter((g) => g.status === 'active');
  const goalsLinked = goals.filter((g) => g.aimId || g.areaId).length;
  const wk = Brain.weekly(D, t, 2), planned = wk.reduce((s, w) => s + w.planned, 0), kept = wk.reduce((s, w) => s + w.kept, 0);
  const cal = Brain.calibration(D);
  const loads = [...Array(7)].map((_, i) => Brain.dayLoad(D, addDays(t, i), t));
  const avgLoad = loads.reduce((s, l) => s + l.ratio, 0) / 7;
  const fs = Brain.active(D, t);
  const lines = [
    D.profile.direction ? `Your stated direction: “${esc(trunc(D.profile.direction, 160))}”.` : 'You have not written a direction yet, so nothing can be judged against it.',
    goals.length ? `${goalsLinked} of ${plural(goals.length, 'active goal')} ${goalsLinked === 1 ? 'is' : 'are'} linked to a life area or aim.` : 'There are no active goals.',
    open.length ? `${pct(linked / open.length)} of open tasks connect to a goal (${linked}/${open.length}).` : 'There are no open tasks.',
    planned ? `In the last two weeks you kept ${kept} of ${planned} plans (${pct(kept / planned)}).` : 'There is no plan-keeping data for the last two weeks yet.',
    cal.n >= 3 ? `Finished tasks took ${cal.median.toFixed(1)}× their estimate (median of ${cal.n}).` : `Only ${plural(cal.n, 'task')} ${cal.n === 1 ? 'has' : 'have'} an estimate and an actual time, so estimate accuracy is unknown.`,
    `The next 7 days average ${pct(avgLoad)} of your capacity${avgLoad > 0.85 ? ', above the sustainable 80%' : ''}.`,
    fs.length ? `The local Brain has ${plural(fs.length, 'open finding')}; the most pressing: “${esc(fs[0].title)}”.` : 'The local Brain has no open findings.',
  ];
  openSheet({ title: 'Analyze life', body: `<div class="prose stack">${lines.map((l) => `<p>${l}</p>`).join('')}</div>
    <p class="xs muted section">Computed on this device from your records. Missing data is reported as unknown, not guessed.</p>
    <div class="form-actions"><button class="btn" data-action="sheet-close">Close</button><button class="btn primary" data-action="analyze-ai">Ask AI for a deeper read</button></div>` });
};
A['analyze-ai'] = () => askAI({ title: 'Analyze my life', question: 'Give a short, honest read of how my plans and reality line up with my direction. Name the two most important tensions, with evidence, and one change worth testing. Mark anything uncertain.', scopes: ['direction', 'model', 'plan', 'reality', 'findings'], saveAs: 'lesson' });

/* Help me decide: weighted matrix with sensitivity, plus what your records say. */
let decision = null;
A['brain-decide'] = () => {
  decision = null;
  openSheet({ title: 'Help me decide', body: `<form class="form" data-form="decide-setup">
    ${fieldHTML(['question', 'What are you deciding?', 'text', { req: 1, max: 200, ph: 'Take the course now or after the project ships?' }], '')}
    ${fieldHTML(['options', 'Options, one per line (2–5)', 'area', { req: 1, ph: 'Start the course now\nWait until v1 ships' }], '')}
    ${fieldHTML(['criteria', 'What matters, one per line', 'area', { hint: 'Prefilled from your values. Edit freely.' }], (S.profile.values || []).slice(0, 5).join('\n'))}
    <p class="err" data-form-error></p><div class="form-actions"><button type="button" class="btn" data-action="sheet-close">Cancel</button><button class="btn primary">Next: score options</button></div></form>` });
};
F['decide-setup'] = (form, v) => {
  const lines = (s) => String(s || '').split('\n').map((x) => x.trim()).filter(Boolean);
  const options = [...new Set(lines(v.options))].slice(0, 5), criteria = [...new Set(lines(v.criteria))].slice(0, 6);
  if (!String(v.question || '').trim()) throw new Error('Write the decision first.');
  if (options.length < 2) throw new Error('Add at least two options, one per line.');
  if (!criteria.length) throw new Error('Add at least one thing that matters.');
  decision = { question: v.question.trim(), options, criteria: criteria.map((name) => ({ name, weight: 2 })), scores: options.map(() => criteria.map(() => 3)) };
  renderDecision();
};
function renderDecision() {
  const d = decision, res = Brain.decide(d.options, d.criteria, d.scores);
  const recall = Brain.recall(data(), d.question + ' ' + d.options.join(' '));
  const sel = (name, val, max, label) => `<select class="input num" name="${name}" aria-label="${esc(label)}" style="min-height:36px;padding:4px 8px">${[...Array(max + 1).keys()].slice(max === 3 ? 0 : 1).map((n) => `<option ${n === val ? 'selected' : ''}>${n}</option>`).join('')}</select>`;
  openSheet({ title: 'Help me decide', wide: true, body: `<p class="lead" style="font-size:19px">${esc(d.question)}</p>
    <form data-form="decide-score" class="section"><div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;min-width:${200 + d.options.length * 90}px">
      <thead><tr><th style="text-align:left;padding:6px 4px" class="xs muted">What matters · weight 0–3</th>${d.options.map((o) => `<th class="small" style="padding:6px 4px;text-align:left">${esc(o)}</th>`).join('')}</tr></thead>
      <tbody>${d.criteria.map((c, ci) => `<tr style="border-top:1px solid var(--line)"><td style="padding:8px 4px"><div class="small" style="font-weight:600">${esc(c.name)}</div>${sel('w' + ci, c.weight, 3, 'Weight for ' + c.name)}</td>${d.options.map((o, oi) => `<td style="padding:8px 4px">${sel(`s${oi}_${ci}`, d.scores[oi][ci], 5, `${o} on ${c.name}`)}</td>`).join('')}</tr>`).join('')}</tbody>
      <tfoot><tr style="border-top:1px solid var(--line)" id="dec-totals">${decisionTotals(d, res)}</tr></tfoot></table></div>
      <p class="xs muted" style="margin-top:6px">Score each option 1 (poor) to 5 (great) on each line. Totals update as you change them.</p></form>
    <div class="section card" id="dec-result">${decisionResult(res)}</div>
    ${section('What your records say', recall.length ? `<div class="list">${recall.map((r) => `<div class="item"><span class="item-main"><span class="tag">${esc(r.label)}</span> <span class="item-title">${esc(r.r.title)}</span><span class="item-meta">${esc(trunc(r.r.body || r.r.learning || r.r.outcomeNote || r.r.hypothesis || '', 160))}</span></span></div>`).join('')}</div>` : '<div class="empty">Nothing in your memory or experiments mentions this yet.</div>')}
    <form class="form section" data-form="decision-save">${fieldHTML(['choice', 'I’m choosing', 'select', { options: d.options.map((o) => [o, o]) }], res.ranked[0].option)}${fieldHTML(['why', 'Why (your future self will want this)', 'area', { req: 1 }], '')}
      <p class="err" data-form-error></p><div class="form-actions"><button type="button" class="btn" data-action="decide-ai">Ask AI about the trade-offs</button><button class="btn primary">Save decision</button></div></form>`,
  onMount(root) {
    $('form[data-form="decide-score"]', root).addEventListener('change', (ev) => {
      const n = ev.target.name, val = Number(ev.target.value);
      if (/^w\d+$/.test(n)) d.criteria[Number(n.slice(1))].weight = val;
      const m = n.match(/^s(\d+)_(\d+)$/);
      if (m) d.scores[Number(m[1])][Number(m[2])] = val;
      const r = Brain.decide(d.options, d.criteria, d.scores);
      $('#dec-totals', root).innerHTML = decisionTotals(d, r);
      $('#dec-result', root).innerHTML = decisionResult(r);
    });
  } });
}
const decisionTotals = (d, res) => `<td class="small muted" style="padding:8px 4px">Weighted total</td>${d.options.map((o, oi) => `<td class="num" style="padding:8px 4px;font-weight:600">${res.ranked.find((r) => r.index === oi).total}</td>`).join('')}`;
const decisionResult = (res) => `<b>${esc(res.ranked[0].option)}</b> scores highest${res.margin != null ? `, ahead by <span class="num">${res.margin}</span>` : ''}.
  <p class="small muted" style="margin-top:6px">${res.margin === 0 ? 'It is a tie. The scores alone do not decide this.' : res.flip ? `This would flip to “${esc(res.flip.winner)}” if “${esc(res.flip.criterion)}” were weighted ${res.flip.to} instead of ${res.flip.from}. Ask yourself whether that weight is honest.` : 'No single weight change of one or two points would flip it, so the result is fairly robust.'}</p>`;
F['decide-score'] = () => {};
F['decision-save'] = async (form, v) => {
  if (!decision) throw new Error('Start the decision again.');

    body: `Options: ${decision.options.join(' / ')}\nScores: ${res.ranked.map((r) => `${r.option} ${r.total}`).join(', ')}\nWeights: ${decision.criteria.map((c) => `${c.name} ${c.weight}`).join(', ')}` });

};
A['decide-ai'] = () => {

  askAI({ title: 'Trade-offs', question: 'Explain the real trade-offs between these options in my context. What does the matrix miss? What would I regret with each option? Do not choose for me; end with the one question I should answer to decide.', scopes: ['direction', 'memory'], extra, saveAs: 'decision' });

    done('gymA', 'Gym: full body', -9, { estimateMin: 60, actualMin: 60 }),
    done('hosting', 'Set up hosting', -8, { projectId: P1, estimateMin: 60, actualMin: 110, outcome: 'different', outcomeNote: 'DNS took most of the time' }),
    done('maya', 'Reply to Maya about the weekend', -8, { estimateMin: 10, actualMin: 15 }),
    done('gymB', 'Gym: upper body', -6, { estimateMin: 60, actualMin: 60 }),
    done('landing', 'Design the landing page', -5, { projectId: P1, estimateMin: 90, actualMin: 150, plans: [d(-6), d(-5)], deferrals: 1, skips: [{ date: d(-6), reason: 'time' }] }),
    done('plumber', 'Call the plumber', -4, { estimateMin: 15, actualMin: 20 }),
    done('groceries', 'Weekly groceries', -4, { estimateMin: 45, actualMin: 60 }),
    done('inbox', 'Clear the inbox', -3, { estimateMin: 20, actualMin: 45, plans: [d(-4), d(-3)], deferrals: 1, skips: [{ date: d(-4), reason: 'time' }] }),
    done('deploy', 'Fix the deploy script', -3, { projectId: P1, estimateMin: 30, actualMin: 50 }),
    done('emails', 'Write onboarding emails', -2, { projectId: P1, estimateMin: 45, actualMin: 60 }),
    done('gymC', 'Gym: legs', -2, { estimateMin: 60, actualMin: 60 }),
    done('walk', 'Evening walk with Sam', -1, { goalId: G1, estimateMin: 30, actualMin: 35 }),
    done('analytics', 'Set up analytics', -1, { projectId: P1, estimateMin: 60, actualMin: 90 }),
    { type: 'habit', emoji: '🌙', title: 'Lights out by 23:00', areaId: A1, perWeek: 5, log: { [d(-1)]: true, [d(-4)]: true, [d(-5)]: true, [d(-8)]: true }, createdAt: iso(d(-20)) },
    { type: 'habit', emoji: '🚶', title: 'Walk 30 minutes', areaId: A1, perWeek: 4, log: { [d(-1)]: true, [d(-2)]: true, [d(-3)]: true, [d(-6)]: true, [d(-9)]: true, [d(-10)]: true }, createdAt: iso(d(-20)) },
    { type: 'experiment', title: 'No screens after 22:30', hypothesis: 'If I stop using screens at 22:30, I will fall asleep faster and reach 7 hours more often.', intervention: 'Phone charges in the kitchen from 22:30. Paper book only.', measurement: 'Minutes to fall asleep (rough guess) and hours slept', startDate: d(-6), endDate: d(7), status: 'running',
      observations: [{ id: uid(), date: d(-6), value: '35 min', note: 'Hard to put the phone down' }, { id: uid(), date: d(-5), value: '20 min', note: 'Read 15 pages instead' }] },
    // An earlier loop that closed: an experiment that worked and became a rule every plan now follows.
    { id: E1, type: 'experiment', title: 'Honest estimates', hypothesis: POLICIES.estimate.hyp(1.5), intervention: POLICIES.estimate.label(1.5), measurement: 'Share of planned tasks kept, compared with the two weeks before',
      policy: { kind: 'estimate', value: 1.5 }, startDate: d(-30), endDate: d(-24), status: 'done', observations: [],
      outcome: 'Kept 64% of plans with it, against 41% before. That looks like a real improvement.', learning: 'Estimates × 1.5 works for me.', adaptation: 'Now a standing rule that shapes every plan.' },
    { type: 'rule', title: POLICIES.estimate.label(1.5), policy: { kind: 'estimate', value: 1.5 }, since: d(-24), source: E1, active: true, evidence: 'Kept 64% of plans with it, against 41% before. That looks like a real improvement.' },
    { type: 'memory', kind: 'worked', title: 'Estimates × 1.5', body: 'Kept 64% of plans with it, against 41% before.', date: d(-24), links: [E1] },
    { type: 'memory', kind: 'failed', title: '25-minute focus timers on meeting days', body: 'Too many interruptions; the timer became one more thing to manage.', date: d(-20) },
    { type: 'memory', kind: 'worked', title: 'Planning tomorrow before closing the laptop', body: 'Five minutes at the end of the day made mornings start faster.', date: d(-14) },
    { type: 'memory', kind: 'decision', title: 'Delay the design course until v1 ships', why: 'Shipping is the bottleneck, and the course would compete for the same evening hours.', body: 'Options: start now / after v1', date: d(-10) },
    { type: 'memory', kind: 'lesson', title: 'Writing tasks take about 1.5× my estimate', body: 'Seen on the landing page copy and the onboarding emails.', date: d(-4) },
  ];
  // Eight closed days: what was planned, what happened, and the reason for each miss.
  const history = [
    [-9, ['readme', 'pricing', 'gymA']], [-8, ['hosting', 'maya']], [-6, ['readme', 'landing', 'read', 'gymB']], [-5, ['landing']],
    [-4, ['inbox', 'blog', 'plumber', 'groceries']], [-3, ['readme', 'inbox', 'deploy']], [-2, ['emails', 'read', 'gymC']], [-1, ['readme', 'walk', 'analytics']],
  ];
  for (const [n, keys] of history) {
    const date = d(n), xs = keys.map((k) => T[k]);
    const kept = xs.filter((x) => x.status === 'done' && x.doneDate === date).map((x) => x.id);
    const missed = xs.filter((x) => !kept.includes(x.id)).map((x) => ({ id: x.id, reason: ((x.skips || []).find((s) => s.date === date) || {}).reason || 'time' }));
    recs.push({ type: 'day', date, plannedIds: xs.map((x) => x.id), minutes: xs.reduce((s, x) => s + round5(est(x) * 1.5), 0), committedAt: date + 'T07:30:00.000Z', reviewedAt: date + 'T21:00:00.000Z', kept, missed, extras: [], note: '' });
  }
  const now = new Date().toISOString();
  const full = recs.map((r) => ({ id: r.id || uid(), createdAt: now, updatedAt: now, ...r, ex: true }));
  full.forEach((r) => S.records.set(r.id, r));
  await persist('records', (st) => full.forEach((r) => st.put(r)));
  await saveProfile({ identity: 'Someone who builds carefully and protects their energy', direction: 'Ship meaningful work at a pace I can keep for years, while staying healthy and close to the people I love.', values: ['Health', 'Craft', 'Relationships', 'Learning'], priorities: 'Ship v1 this month. Protect sleep.', capacityHours: 4, ex: true });
  S.seeded = true;
  await setMeta('seeded', true);
}
LB.seedExamples = seedExamples;

function registerSW() {
  LB.swState = 'none';
  if (!window.LB_PWA || !('serviceWorker' in navigator)) return;
  LB.swState = 'pending';
  navigator.serviceWorker.register('sw.js').then((reg) => navigator.serviceWorker.ready).then(() => { LB.swState = 'ready'; if (route.name === 'settings') render(); })
    .catch((e) => { console.warn('Service worker failed', e); LB.swState = 'error'; });
}

async function boot() {
  await dbInit();
  applyTheme();
  if (!S.seeded && S.records.size === 0 && S.storage === 'ok') { try { await seedExamples(); } catch (e) { console.error('Could not add examples', e); } }
  Object.assign(route, parseHash());
  onChange(() => render(false));
  render(false);
  window.addEventListener('hashchange', () => { const r = parseHash(); if (r.name !== route.name || r.sub !== route.sub) { Object.assign(route, r); render(true); } });
  window.addEventListener('online', () => render(false));
  window.addEventListener('offline', () => render(false));
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!S.settings.mode) applyTheme(); }); } catch (_) {}
  AI.detect().then(() => { if (['brain', 'settings'].includes(route.name)) render(false); });
  autoSnapshot().catch(() => {});
  registerSW();
  LB.ready = true;
  document.documentElement.dataset.ready = '1';
}
boot().catch((e) => {
  console.error(e);
  $('#view').innerHTML = `<div class="empty"><strong>Life Brain could not start.</strong> ${esc(e.message || e)}</div>`;
});
</script>
