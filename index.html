    <div class="sheet-foot">${g ? `<button type="button" class="btn icon-only danger" data-action="delete" data-id="${g.id}" aria-label="Delete goal">${icon('trash')}</button>` : ''}<span class="spacer"></span><button class="btn primary">${g ? 'Save' : 'Add goal'}</button></div></form>`,
  onMount(root) { root.addEventListener('change', otherDayChanged); } });
}
F.goal = async (form, v) => {
  const title = String(v.title || '').trim(), target = v.target === '' || v.target == null ? 0 : Number(v.target);
  if (!title) throw new Error('Say what you want, in a few words.');
  if (!Number.isFinite(target) || target < 0) throw new Error('Leave the number empty, or use 1 or more.');
  const old = get(form.dataset.id), log = { ...((old && old.log) || {}) };
  if (old && v.now !== undefined && v.now !== '') { // a correction is logged today, so the history still adds up
    const diff = Math.round(Number(v.now)) - goalNow(old);
    if (Number.isFinite(diff) && diff) log[today()] = (Number(log[today()]) || 0) + diff;
  }
  const g = await put({ ...(old || { type: 'goal', done: false, doneDate: '' }), title, why: String(v.why || '').trim(), by: pickedDay(v, 'by'), target: Math.round(target), unit: String(v.unit || '').trim(), log });
  goalDetail(g); // straight to the next thing: its first step
  if (!old) toast('Goal added. Now give it a first step.');
};

/* ===== Where you're heading, and fixes. The brain part of Life Brain: it compares what you do with what you
   said you want, and turns what it sees into one-tap changes. Worked out on the phone, from your own records. ===== */
const HEAD_COLORS = ['rgb(var(--brand))', 'rgb(var(--ink))', '#cb53fa', '#14a38b', '#f59e0b'];
function headingSection(D, t) {
  const act = activeGoals(D);
  if (!D.goals.length) {
    return `<section class="card mt-7" id="heading"><h2 class="font-display text-[19px] font-semibold tracking-tight">Where you’re heading</h2>
      <p class="heading-line mt-1 text-[15px] text-muted">Tell your brain what you want. With a goal or two, Home shows whether your days are heading there, and suggests fixes when they aren’t.</p>
      <button class="btn primary mt-4" data-action="goal-new">${icon('plus')}Add a goal</button></section>`;
  }
  const dir = direction(D, t), parts = dir.parts.filter((p) => !goalDone(p.g) || p.n).slice(0, 5);
  const color = (i) => HEAD_COLORS[i % HEAD_COLORS.length];
  const bar = dir.total ? `<div class="hbar mt-4" role="img" aria-label="${esc(parts.map((p) => `${p.g.title}: ${p.n}`).concat(`No goal: ${dir.none}`).join(', '))}">${parts.filter((p) => p.n).map((p) => `<i style="width:${(p.n / dir.total) * 100}%;background:${color(parts.indexOf(p))}"></i>`).join('')}${dir.none ? `<i class="none" style="width:${(dir.none / dir.total) * 100}%"></i>` : ''}</div>` : '';
  const rows = act.slice(0, 3).map((g) => {
    const s = goalStatus(D, g, t), i = parts.findIndex((p) => p.g.id === g.id), n = i >= 0 ? parts[i].n : 0;
    return `<li><button class="hrow-goal" data-action="goal-open" data-id="${g.id}"><span class="hdot" style="background:${i >= 0 && n ? color(i) : 'rgb(var(--line))'}"></span><span class="hname"><b>${esc(g.title)}</b><small class="state-${s.state}">${esc(goalStateText(g, s))}</small></span><span class="hnum">${n}</span></button></li>`;
  }).join('');
  return `<section class="card mt-7" id="heading"><div class="flex items-center justify-between gap-2"><h2 class="font-display text-[19px] font-semibold tracking-tight">Where you’re heading</h2><button class="link -my-2" data-action="goal-new">${icon('plus')}Goal</button></div>
    <p class="heading-line mt-1 font-display text-[18px] leading-snug" id="heading-line">${esc(headingLine(D, t))}</p>
    ${bar}${dir.total ? '<p class="mt-2 text-[13px] text-muted">Tasks finished in the last 4 weeks, by goal</p>' : ''}
    <ol class="hlist mt-2">${rows}${dir.total ? `<li><div class="hrow-goal"><span class="hdot none"></span><span class="hname"><b>No goal</b><small>Tasks not tied to any goal</small></span><span class="hnum">${dir.none}</span></div></li>` : ''}</ol>
    ${act.length > 3 ? `<button class="link" data-action="nav" data-to="goals">All ${act.length} goals</button>` : ''}</section>`;
}

/* ---- Fixes: specific changes, each one tap with Undo, or a ✦ that asks your AI to do the thinking ---- */
const FIXES = new Map();
function computeFixes(D, t) {
  const out = [], hasAI = AI.provider() !== 'none', tm = addDays(t, 1), snooze = S.settings.fixSnooze || {};
  const shown = (pulsePick(D, t) || {}).g; // Home's goal line already names this goal; a card that only opens it would repeat it
  for (const g of activeGoals(D)) {
    const s = goalStatus(D, g, t);
    if (!hasAI && shown && g.id === shown.id && (s.state === 'no-steps' || s.state === 'behind')) continue;
    if (s.state === 'no-steps') out.push({ id: 'steps-' + g.id, title: `Plan the next step for “${g.title}”`, text: 'A goal moves when there’s a concrete next thing to do.', label: hasAI ? '✦ Plan steps' : 'Add a step', run: () => (hasAI ? A['goal-steps']({ dataset: { id: g.id } }) : goalDetail(g)) });
    else if (s.state === 'stalled' && s.open.length && !s.open.some((x) => x.date && x.date >= t && x.date <= tm)) { // already on for today or tomorrow: nothing to fix
      const step = s.open.slice().sort((a, b) => (a.date || '9').localeCompare(b.date || '9') || byCreated(a, b))[0];
      out.push({ id: 'stall-' + g.id + '-' + t, title: `Get “${g.title}” moving`, text: `Nothing in ${s.idle} days. Put “${step.title}” on tomorrow?`, label: 'Put it on tomorrow', apply: async (rec) => { const x = get(step.id); if (x) await rec.update({ ...x, date: tm, moved: (x.moved || 0) + (x.date && x.date < tm ? 1 : 0) }); return `“${trunc(step.title, 30)}” is on tomorrow`; } });
    } else if (s.state === 'behind') out.push({ id: 'behind-' + g.id + '-' + weekStart(t), title: `Catch up on “${g.title}”`, text: s.perWeekNeed ? `It needs about ${plural(s.perWeekNeed, 'step')} a week to make ${fmtDate(g.by, { month: 'short', day: 'numeric' })}; lately ${s.perWeekNow}.` : 'At this pace it misses its date.', label: hasAI ? '✦ Plan my week' : 'Open goal', run: () => (hasAI ? A['plan-week']() : goalDetail(g)) });
  }
  // Overplanning: more on today than you usually finish in a day
  const cap = capacity(D, t), todays = D.tasks.filter((x) => !x.done && x.date === t);
  if (cap >= 0.5 && todays.length > Math.ceil(cap * 1.5) + 1) {
    const keep = Math.max(1, Math.round(cap)), extra = todays.filter((x) => !x.goalId).sort((a, b) => byCreated(b, a)).slice(0, todays.length - keep); // newest loose tasks go first
    if (extra.length) out.push({ id: 'lighten-' + t, title: 'Today is fuller than your usual day', text: `You finish about ${Math.round(cap * 10) / 10} a day and today has ${todays.length}. Tasks tied to goals stay.`, label: `Move ${extra.length} to later this week`, apply: async (rec) => { for (const [i, x] of extra.entries()) { const y = get(x.id); if (y) await rec.update({ ...y, date: addDays(t, 1 + (i % 6)), moved: (y.moved || 0) + 1 }); } return `Moved ${plural(extra.length, 'task')}`; } });
  }
  // A task that keeps getting pushed
  const pushed = D.tasks.filter((x) => !x.done && (x.moved || 0) >= 3).sort((a, b) => b.moved - a.moved)[0];
  if (pushed) out.push({ id: 'split-' + pushed.id, title: `“${trunc(pushed.title, 40)}” keeps getting moved`, text: `Moved ${pushed.moved} times. Smaller steps usually get done.`, label: hasAI ? '✦ Break it down' : 'Open it', run: () => (hasAI ? A['task-break']({ dataset: { id: pushed.id } }) : taskSheet(pushed)) });
  // Work that isn't tied to anything you said you want
  const loose = D.tasks.filter((x) => !x.done && !x.goalId), act = activeGoals(D);
  if (hasAI && act.length && loose.length >= 3) out.push({ id: 'link-' + t, title: `${plural(loose.length, 'open task')} aren’t tied to a goal`, text: 'Tie them, and Where you’re heading becomes accurate.', label: '✦ Tie to goals', run: () => A['goal-link']() });
  // Sunday or Monday: the weekly look back, once a week, when the AI is set up
  const wd = parseYmd(t).getDay(), lb = S.settings.lookBack;
  // Sunday and Monday share one id (Monday's date), so Not now holds for both days
  if ((wd === 0 || wd === 1) && hasAI && S.records.size >= 10 && (!lb || lb < addDays(t, -5))) out.push({ id: 'lookback-' + (wd === 0 ? addDays(t, 1) : t), title: 'Weekly look back', text: 'A short look at what got done and what slipped this week, written by your AI.', label: '✦ Write it', run: () => A['look-back']() });
  // Everything lives only on this phone, so a backup file is the one safety net against a cleared browser
  const last = S.lastExport ? daysBetween(S.lastExport.slice(0, 10), t) : null;
  if (S.records.size >= 15 && (last == null || last >= 30)) out.push({ id: 'backup', title: 'Save a backup file', text: `Everything lives only on this phone. ${last == null ? 'No backup file has been saved yet.' : `The last one was saved ${last} days ago.`}`, label: 'Save backup', run: () => A.export() });
  return out.filter((f) => !(snooze[f.id] && snooze[f.id] >= t)).slice(0, 5);
}
/* One fix at a time, so Home stays short. "1 of 4" steps to the next. Suggestions your AI prepared come first. */
function fixesSection(D, t) {
  const pend = pendingItems(), fixes = computeFixes(D, t);
  FIXES.clear(); fixes.forEach((f) => FIXES.set(f.id, f));
  const card = (title, text, btns, attrs, ai) => `<div class="fix-card !w-full" ${attrs}><div class="flex items-start gap-2">${ai ? `<span class="ai-mark">${icon('spark')}</span>` : ''}<div class="fix-title min-w-0 flex-1">${title}</div></div><p class="fix-text">${text}</p><div class="fix-btns">${btns}</div></div>`;
  const cards = [
    ...pend.map((it) => { const id = it.attrs.match(/data-id="([^"]*)"/)[1]; return { key: 'pending-' + id, html: (pager) => card(`<button class="bi-title text-left font-semibold" ${it.attrs}>${esc(it.title.replace(/^✦\s*/, ''))}</button>`, it.text, `<button class="btn sm primary" ${it.attrs}>Open</button><button class="btn sm ghost text-muted" data-action="pending-dismiss" data-id="${id}">Not now</button>${pager}`, '', true) }; }),
    ...fixes.map((f) => ({ key: f.id, html: (pager) => card(esc(f.title), esc(f.text), `<button class="btn sm primary" data-action="fix-apply" data-fix="${esc(f.id)}">${esc(f.label)}</button><button class="btn sm ghost text-muted" data-action="fix-dismiss" data-fix="${esc(f.id)}">Not now</button>${pager}`, `data-fix="${esc(f.id)}"`, f.label.startsWith('✦')) })),
  ];
  if (!cards.length) return '';
  const i = Math.max(0, cards.findIndex((c) => c.key === ui.fixAt)), next = cards[(i + 1) % cards.length];
  const pager = cards.length > 1 ? `<button class="link ml-auto tabular-nums" data-action="fix-next" data-next="${esc(next.key)}" aria-label="Next fix, ${i + 1} of ${cards.length}">${i + 1} of ${cards.length}${icon('right')}</button>` : '';
  return `<section class="mt-4" id="fixes" aria-label="Fixes for you">${cards[i].html(pager)}</section>`;
}
A['fix-next'] = (el) => { ui.fixAt = el.dataset.next; render(false); };

/* Goals in one line: the one that needs you, or that all is well. Tap for the goal (or all goals). */
/* The goal that needs you most: behind its date, then stalled longest, then missing a next step. */
function pulsePick(D, t) {
  const st = activeGoals(D).map((g) => ({ g, s: goalStatus(D, g, t) }));
  return st.find((x) => x.s.state === 'behind') || st.filter((x) => x.s.state === 'stalled').sort((a, b) => b.s.idle - a.s.idle)[0] || st.find((x) => x.s.state === 'no-steps') || null;
}
function goalPulse(D, t) {
  const row = (attrs, dot, text) => `<button class="pulse mt-4 flex w-full items-center gap-3 rounded-2xl bg-raised px-4 py-3.5 text-left" id="goal-pulse" ${attrs}><span class="hdot" style="background:${dot}"></span><span class="min-w-0 flex-1 truncate text-[15px] font-semibold">${esc(text)}</span><span class="text-muted">${icon('right')}</span></button>`;
  if (!D.goals.length) return row('data-action="goal-new"', 'rgb(var(--brand))', 'Add your first goal');
  const pick = pulsePick(D, t), n = activeGoals(D).length;
  if (!pick) return row('data-action="nav" data-to="goals"', 'rgb(var(--good))', n ? `${n === 1 ? 'Your goal is' : `All ${n} goals are`} on track` : 'Every goal is done');
  const name = trunc(pick.g.title, 34), s = pick.s;
  const text = s.state === 'behind' ? `${name} is behind` : s.state === 'stalled' ? `${name}: nothing in ${s.idle} days` : `${name} needs a next step`;
  return row(`data-action="goal-open" data-id="${pick.g.id}"`, s.state === 'no-steps' ? 'rgb(var(--muted))' : '#f0a23b', text);
}

A['fix-apply'] = async (el) => {
  const f = FIXES.get(el.dataset.fix);
  if (!f) return;
  if (f.run) { f.run(); return; }
  const undo = [], rec = {
    async create(r) { const x = await put(r, { quiet: true }); undo.push(() => del(x.id)); return x; },
    async update(r) { const old = get(r.id); await put(r, { quiet: true }); if (old) undo.push(() => put(old)); },
    async remove(id) { const old = get(id); if (!old) return; await del(id); undo.push(() => put(old)); },
  };
  const msg = await f.apply(rec);
  emit();
  haptic();
  toast(msg || 'Done', '', { action: 'Undo', onAction: async () => { for (const u of undo.reverse()) await u(); } });
};
A['fix-dismiss'] = async (el) => { // hidden for a week; old entries are dropped so the list stays small
  const t = today(), keep = Object.entries(S.settings.fixSnooze || {}).filter(([, d]) => isYmd(d) && d >= t);
  await saveSettings({ fixSnooze: { ...Object.fromEntries(keep), [el.dataset.fix]: addDays(t, 7) } });
};

/* ---- AI: plan the next steps for a goal ---- */
const GOALSTEPS_PROMPT = `Plan the next concrete steps toward one goal. Reply with JSON only, in this shape:
{"steps":[{"title":"...","date":"YYYY-MM-DD or empty"}]}
Rules:
- 3 to 6 steps in the order they should be done. The first one is small enough to start today.
- Each step takes under about two hours. Titles start with a verb. No emoji.
- Spread dates from today, at a pace the person can keep (they finish about the number of tasks per day given). Never after the goal's deadline.
- Don't repeat steps they already have.`;
A['goal-steps'] = (el) => {
  const g = get(el.dataset.id), t = today();
  if (!g) return;
  aiTool({ title: 'Plan steps', intro: `Your AI is planning the next steps for <b>${esc(g.title)}</b>. Nothing is added until you tap Add.`, system: GOALSTEPS_PROMPT,
    request: () => {
      const D = data(), s = goalStatus(D, g, t);
      return `Today is ${fmtDate(t, { weekday: 'long' })}, ${t}. They finish about ${capacity(D, t)} tasks a day.\n\nGoal: ${g.title}\nWhy: ${g.why || '(not given)'}\nDeadline: ${g.by || 'none'}\n${goalIsNumber(g) ? `Progress: ${goalNow(g)} of ${g.target} ${g.unit}\n` : ''}\nOpen steps:\n${s.open.map((x) => `- ${x.title}${x.date ? ' (' + x.date + ')' : ''}`).join('\n') || '(none)'}\nDone steps:\n${s.steps.filter((x) => x.done).slice(-10).map((x) => `- ${x.title}`).join('\n') || '(none)'}`;
    },
    onAnswer: (text, out) => {
      const j = pullJSON(text), have = new Set(goalSteps(data(), g).map((x) => x.title.toLowerCase()));
      const rows = (Array.isArray(j.steps) ? j.steps : []).slice(0, 8).map((s) => ({ on: true, title: String((s && s.title) || '').trim().slice(0, 200), date: day(s && s.date) })).filter((s) => s.title && !have.has(s.title.toLowerCase()));
      rows.forEach((s) => { if (s.date && s.date < t) s.date = t; if (g.by && s.date > g.by) s.date = g.by; });
      showReview(out, rows, (s, i) => `<div class="org-top"><input class="org-title" data-rev="title" data-i="${i}" value="${esc(s.title)}" maxlength="200" aria-label="Step"></div><div class="org-when">${dateField(i, s.date)}${s.date ? `<span class="small muted">${esc(relDate(s.date))}</span>` : ''}</div>`,
        async (sel, rec) => { const add = sel.filter((r) => r.title.trim()); for (const s of add) await rec.create({ type: 'task', title: s.title.trim(), date: day(s.date), done: false, doneDate: '', note: '', moved: 0, goalId: g.id }); return `Added ${plural(add.length, 'step')} to “${trunc(g.title, 30)}”`; }, 'Add');
    } });
};

/* ---- AI: tie open tasks to goals ---- */
const LINK_PROMPT = `Tie a person's open tasks to their goals. You get their goals (id, title, why) and their open tasks that have no goal (id, title). Reply with JSON only, in this shape:
{"links":[{"task":"task id","goal":"goal id or empty"}]}

/* ===== Organise: the AI reads one note (a brain dump) and suggests tasks, events, habits and goals.
   You see exactly what is sent, then check every suggestion before anything is added. ===== */
const ORGANISE_PROMPT = `You turn one person's messy note into items for their planner app. Reply with JSON only, no other text, in exactly this shape:
{"items":[{"kind":"task","title":"...","date":"YYYY-MM-DD or empty","goal":"goal title or empty"},{"kind":"event","title":"...","date":"YYYY-MM-DD","time":"HH:MM","end":"HH:MM or empty"},{"kind":"habit","title":"...","goal":"goal title or empty"},{"kind":"goal","title":"...","target":12,"unit":"books"}]}
Rules:
- task: something to do once. event: something at a set time (a meeting, call, class, appointment). habit: something to repeat regularly ("every evening", "daily", "mon/wed/fri"). goal: something they want to reach ("finish the paper", "read 12 books"). Give target and unit only when it is a count; otherwise target 0.
- Work out dates from words like "tomorrow", "friday", "next week" using today's date. If no date is given, leave it empty. Never invent a date.
- Times are 24-hour HH:MM. An event needs a date and a time; without them, make it a task.
- goal on a task or habit: the exact title of the one goal it moves forward, either a goal they already have (listed below) or a goal in your list. Empty if none.
- If a habit has set days, put them in the title, like "Gym (Mon/Wed/Fri)".
- Short titles in the person's own words. Tasks start with a verb. No emoji.
- Leave out thoughts, reasons and feelings: those stay in the note.
- Don't repeat anything they already have (listed below).
- At most 25 items.`;
const KINDS = { task: 'Task', event: 'Event', habit: 'Habit', goal: 'Goal' };
const ORG = { items: [], noteId: null, ctl: null };

function organiseRequest(n) {
  const D = data(), t = today();
  const open = D.tasks.filter((x) => !x.done).slice(0, 40).map((x) => x.title);
  return [`Today is ${fmtDate(t, { weekday: 'long' })}, ${t}.`, '',
    'They already have:',
    `Open tasks: ${open.length ? open.join('; ') : 'none'}`,
    `Habits: ${D.habits.length ? D.habits.map((h) => h.title).join('; ') : 'none'}`,
    `Goals: ${D.goals.length ? D.goals.map((g) => g.title).join('; ') : 'none'}`,
    `Upcoming events: ${D.events.filter((e) => e.date >= t).slice(0, 20).map((e) => `${e.title} (${e.date})`).join('; ') || 'none'}`,
    '', '## Note', n.title || '(no title)', String(n.body || '')].join('\n');
}
/* The answer should be JSON, but models sometimes wrap it in a code fence or a sentence. */
function parseItems(text) {
  let s = String(text || '').replace(/```(?:json)?/gi, '');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  let obj = null;
  if (a >= 0 && b > a) { try { obj = JSON.parse(s.slice(a, b + 1)); } catch (_) {} }
  if (!obj) { const c = s.indexOf('['), d = s.lastIndexOf(']'); if (c >= 0 && d > c) { try { obj = { items: JSON.parse(s.slice(c, d + 1)) }; } catch (_) {} } }
  const raw = obj && Array.isArray(obj.items) ? obj.items : Array.isArray(obj) ? obj : null;
  if (!raw) throw aiErr('bad_answer', 'The AI answered, but not in a form the app can read. Try again, or try another model in Settings.');
  const D = data(), have = new Set([...D.tasks.filter((x) => !x.done), ...D.habits, ...D.goals, ...D.events].map((r) => String(r.title).trim().toLowerCase()));
  const out = [];
  for (const r of raw.slice(0, 25)) {
    if (!r || typeof r !== 'object' || !KINDS[r.kind]) continue;
    const title = String(r.title || '').replace(/\s+/g, ' ').trim().slice(0, 200);
    if (!title) continue;
    const it = { kind: r.kind, title, date: day(r.date), time: TIME.test(r.time || '') ? r.time : '', end: TIME.test(r.end || '') ? r.end : '', target: clamp(Math.round(Number(r.target) || 0), 0, 100000), unit: String(r.unit || '').slice(0, 20), goal: String(r.goal || '').replace(/\s+/g, ' ').trim().slice(0, 120) };
    if (it.kind === 'event' && (!it.date || !it.time)) it.kind = 'task'; // an event without a day and time is really a task
    it.dup = have.has(title.toLowerCase());
    it.on = !it.dup;
    out.push(it);
  }
  return out;
}

/* Goals a task or habit here can be tied to: the ones you have, plus new ones ticked in this list */
const orgGoals = () => [...new Set(activeGoals(data()).map((g) => g.title).concat(ORG.items.filter((x) => x.on && x.kind === 'goal' && x.title.trim()).map((x) => x.title.trim())))];
function orgRow(it, i) {

    : it.kind === 'goal' ? `<input type="number" inputmode="numeric" min="0" data-org="target" data-i="${i}" value="${it.target ? esc(it.target) : ''}" placeholder="count" aria-label="Target, if you're counting"><input data-org="unit" data-i="${i}" value="${esc(it.unit)}" placeholder="unit" maxlength="20" aria-label="Unit">`

    <div class="org-main"><div class="org-top"><select data-org="kind" data-i="${i}" aria-label="Kind">${Object.entries(KINDS).map(([k, l]) => `<option value="${k}" ${it.kind === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <input class="org-title" data-org="title" data-i="${i}" value="${esc(it.title)}" maxlength="200" aria-label="Title"></div>
      <div class="org-when">${when}${gsel}${it.kind === 'task' && it.date ? `<span class="small muted">${esc(relDate(it.date, t))}</span>` : ''}${it.dup ? '<span class="small muted">Already in your app</span>' : ''}</div></div></div>`;
}
function renderOrganised() {

    ? `<div class="org-list" id="org-list">${ORG.items.map(orgRow).join('')}</div>

/* Edits in the suggestion list update the list in memory; changing the kind redraws that row. */
const orgChange = (ev) => {

A['organise-add'] = async () => {
  const n = get(ORG.noteId), from = n ? `From your note “${trunc(n.title || String(n.body || '').split('\n')[0], 60)}”` : '';
  const made = [], picked = ORG.items.filter((x) => x.on && x.title.trim());
  const bad = picked.find((it) => it.kind === 'event' && !day(it.date));
  if (bad) { toast(`“${trunc(bad.title.trim(), 30)}” needs a date to be an event.`, 'bad'); return; }
  // Goals first, so the tasks and habits in the same list can be tied to them
  const gid = new Map(activeGoals(data()).map((g) => [g.title.trim().toLowerCase(), g.id]));
  for (const it of picked.filter((x) => x.kind === 'goal')) {
    const g = await put({ type: 'goal', title: it.title.trim().slice(0, 120), why: '', by: '', target: it.target || 0, unit: it.unit.trim(), log: {}, done: false, doneDate: '' }, { quiet: true });
    made.push(g); gid.set(g.title.toLowerCase(), g.id);
  }
  const goalOf = (it) => gid.get(String(it.goal || '').trim().toLowerCase()) || '';
  for (const it of picked.filter((x) => x.kind !== 'goal')) {
    const title = it.title.trim();
    let r;
    if (it.kind === 'task') r = { type: 'task', title, date: day(it.date), done: false, doneDate: '', note: from, moved: 0, goalId: goalOf(it) };
    else if (it.kind === 'event') { r = { type: 'event', title, date: it.date, time: TIME.test(it.time) ? it.time : '', end: TIME.test(it.time) && TIME.test(it.end) ? it.end : '', note: from }; }
    else r = { type: 'habit', title: title.slice(0, 80), log: {}, goalId: goalOf(it) };
    made.push(await put(r, { quiet: true }));
  }
  if (ORG.noteId) await dropPending((p) => p.kind === 'organise' && p.noteId === ORG.noteId);
  closeSheet();
  emit();
  const by = (k) => made.filter((r) => r.type === k).length;
  const parts = [['task', 'task'], ['event', 'event'], ['habit', 'habit'], ['goal', 'goal']].filter(([k]) => by(k)).map(([k, w]) => plural(by(k), w));

/* ===== AI tools. Each one is a button. It shows exactly what will be sent, asks once, and either shows an
   answer or a list of suggested changes you check before anything happens. Every change can be undone. ===== */

/* ---- Shared parts ---- */
const needAI = () => {
  if (AI.provider() !== 'none') return true;
  closeSheet(); go('settings', 'ai'); toast('Add an API key first. Any service works.');
  return false;
};
/* Models sometimes wrap JSON in a code fence or a sentence; take the outermost object. */
function pullJSON(text) {
  const s = String(text || '').replace(/```(?:json)?/gi, '');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(s.slice(a, b + 1)); } catch (_) {} }
  throw aiErr('bad_answer', 'The AI answered, but not in a form the app can read. Try again, or try another model in Settings.');
}
const capacity = (D, t) => { // tasks actually finished per day, over the last 14 days
  const n = D.tasks.filter((x) => x.done && isYmd(x.doneDate) && x.doneDate >= addDays(t, -13) && x.doneDate <= t).length;
  return Math.round((n / 14) * 10) / 10;
};
const taskLine = (x, t) => `${x.id} | ${x.title}${x.goalId && get(x.goalId) ? ` | goal: ${get(x.goalId).title}` : ''}${x.date ? ` | due ${x.date}${x.date < t ? ' (overdue)' : ''}` : ' | no date'}${x.moved ? ` | moved ${x.moved} times` : ''}${x.note ? ` | note: ${trunc(x.note.replace(/\s+/g, ' '), 120)}` : ''}`;
const eventLine = (e) => `${e.date}${e.time ? ' ' + e.time + (e.end ? '-' + e.end : '') : ''}: ${e.title}`;

/* One sheet for every tool: intro, optional extra fields, the exact request, Send, then the result. */
const TOOL = { ctl: null };
/* One tap runs it: the sheet opens already asking. A tool that needs a question waits for you to type one. */
function aiTool({ title, intro, system, request, extra = '', sendLabel = 'Ask again', onAnswer, validate }) {
  if (!needAI()) return;
  const prov = AI.provider();
  openSheet({ title, body: `<p class="small">${intro}</p>${extra}
    <div id="tool-result"></div>
    <div class="row-end tool-row"><button class="btn" data-action="sheet-close">Close</button><button class="btn" id="tool-send">${esc(validate ? 'Ask' : sendLabel)}</button></div>
    <details class="preview-box"><summary>See what is sent to ${esc(AI.providerName(prov))}</summary><pre class="preview" id="tool-preview"></pre></details>`,
  onMount(root) {
    const refresh = () => { $('#tool-preview', root).textContent = system + '\n\n' + request(root); };
    refresh();
    root.addEventListener('input', (ev) => { if (ev.target.dataset && 'toolField' in ev.target.dataset) refresh(); });
    root.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.dataset && 'toolField' in ev.target.dataset) { ev.preventDefault(); $('#tool-send', root).click(); } });
    if (!validate) setTimeout(() => { const b = $('#tool-send', root); if (b && document.contains(b)) b.click(); }, 0);
    else { const f = $('[data-tool-field]', root); if (f) f.focus(); }
    $('#tool-send', root).addEventListener('click', async () => {
      const out = $('#tool-result', root), send = $('#tool-send', root);
      const problem = validate && validate(root);
      if (problem) { out.innerHTML = `<div class="ai-out"><p class="err" id="tool-error">${esc(problem)}</p></div>`; return; }
      TOOL.ctl = new AbortController();
      send.disabled = true;
      out.innerHTML = `<div class="ai-out flex items-center justify-between gap-3"><p class="flex items-center gap-2 text-muted"><span class="ai-mark animate-pulse">${icon('spark')}</span>Thinking…</p><button class="btn sm bg-raised" data-action="tool-stop">Stop</button></div>`;
      try {
        const text = await AI.call(request(root), { signal: TOOL.ctl.signal, system });
        if (!document.contains(out)) return;
        await onAnswer(text, out, root);
      } catch (e) {
        if (document.contains(out)) out.innerHTML = `<div class="ai-out"><p class="err" id="tool-error" data-code="${esc(e.code || 'error')}">${esc(e.message || 'Something went wrong.')}</p></div>`;
      } finally { if (document.contains(send)) { send.disabled = false; send.textContent = validate ? 'Ask' : 'Ask again'; } }
    });
  } });
}
A['tool-stop'] = () => { if (TOOL.ctl) TOOL.ctl.abort(); };

/* A list of suggested changes, each with a tick box and editable fields. rows: [{ on, ...fields }]. */
const REV = { rows: [], row: null, apply: null, label: 'Apply' };
function showReview(out, rows, row, apply, label = 'Apply') {
  Object.assign(REV, { rows, row, apply, label, out, after: null });
  drawReview();
}
function drawReview() {
  const out = REV.out;
  if (!out || !document.contains(out)) return;
  const n = REV.rows.filter((r) => r.on).length;
  out.innerHTML = REV.rows.length
    ? `<div class="org-list" id="rev-list">${REV.rows.map((r, i) => `<div class="org-item${r.on ? '' : ' off'}"><input type="checkbox" class="org-on" data-rev="on" data-i="${i}" ${r.on ? 'checked' : ''} aria-label="Include this change"><div class="org-main">${REV.row(r, i)}</div></div>`).join('')}</div>
       <div class="sticky-act flex justify-end"><button class="btn primary" id="rev-apply" data-action="rev-apply" ${n ? '' : 'disabled'}>${esc(REV.label)} ${n || ''}</button></div>`
    : '<div class="ai-out"><p class="muted" id="rev-empty">Nothing to change.</p></div>';
}
const revInput = (ev) => {
  const k = ev.target.dataset && ev.target.dataset.rev;
  if (!k) return;
  const r = REV.rows[Number(ev.target.dataset.i)];
  if (!r) return;
  r[k] = ev.target.type === 'checkbox' ? ev.target.checked : ev.target.value;
  if (k === 'on' || ev.target.tagName === 'SELECT') drawReview();
  else { const b = $('#rev-apply'); if (b) { const c = REV.rows.filter((x) => x.on).length; b.disabled = !c; b.textContent = `${REV.label} ${c || ''}`; } }
};
document.addEventListener('input', revInput);
document.addEventListener('change', (ev) => { if (ev.target.dataset && (ev.target.dataset.rev === 'on' || (ev.target.dataset.rev && ev.target.tagName === 'SELECT'))) revInput(ev); });
/* Changes go through a recorder so one Undo can reverse all of them. */
A['rev-apply'] = async () => {
  const undo = [], rec = {
    async create(r) { const x = await put(r, { quiet: true }); undo.push(() => del(x.id)); return x; },
    async update(r) { const old = get(r.id); await put(r, { quiet: true }); if (old) undo.push(() => put(old)); },
    async remove(id) { const old = get(id); if (!old) return; await del(id); undo.push(() => put(old)); },
  };
  const msg = await REV.apply(REV.rows.filter((r) => r.on), rec);
  if (REV.after) await REV.after();
  closeSheet(); emit();
  toast(msg || 'Done', '', { action: 'Undo', onAction: async () => { for (const f of undo.reverse()) await f(); } });
};
const dateField = (i, v, key = 'date') => `<input type="date" data-rev="${key}" data-i="${i}" value="${esc(v || '')}" aria-label="Date">`;

/* ---- 1. Break down a big task ---- */
const BREAK_PROMPT = `Split one task into 3 to 6 small, concrete steps that each take under about an hour. Reply with JSON only, in this shape:
{"steps":[{"title":"...","date":"YYYY-MM-DD or empty"}]}
Rules:
- Steps in the order they should be done. Each title starts with a verb. No emoji.
- If the task has a due date, spread the steps from today up to that date, never after it. If it has no due date, start from today and put one step per day.
- The first step should be small enough to start in five minutes.`;
A['task-break'] = (el) => {
  const x = get(el.dataset.id), t = today();
  if (!x) return;
  aiTool({ title: 'Break down', intro: `The AI suggests small steps for <b>${esc(x.title)}</b>. You check them before they’re added.`, system: BREAK_PROMPT,
    request: () => `Today is ${fmtDate(t, { weekday: 'long' })}, ${t}.\nThey usually finish about ${capacity(data(), t)} tasks a day.\n\nTask: ${x.title}\nDue: ${x.date || 'no date'}\n${x.moved ? `Moved ${x.moved} times already.\n` : ''}${x.note ? `Note: ${x.note}\n` : ''}`,
    onAnswer: (text, out) => {
      const j = pullJSON(text), steps = (Array.isArray(j.steps) ? j.steps : []).slice(0, 8).map((s) => ({ on: true, title: String((s && s.title) || '').trim().slice(0, 200), date: day(s && s.date) })).filter((s) => s.title);
      if (x.date) steps.forEach((s) => { if (s.date && s.date > x.date) s.date = x.date; });
      steps.push({ on: true, replace: true, title: `Replace “${trunc(x.title, 40)}” with these steps` });
      showReview(out, steps, (s, i) => s.replace ? `<span class="rev-note">${esc(s.title)}</span><span class="small muted">The big task is removed; Undo brings it back.</span>`
        : `<div class="org-top"><input class="org-title" data-rev="title" data-i="${i}" value="${esc(s.title)}" maxlength="200" aria-label="Step"></div><div class="org-when">${dateField(i, s.date)}${s.date ? `<span class="small muted">${esc(relDate(s.date))}</span>` : ''}</div>`,
      async (rows, rec) => {
        const add = rows.filter((r) => !r.replace && r.title.trim());
        for (const s of add) await rec.create({ type: 'task', title: s.title.trim(), date: day(s.date), done: false, doneDate: '', note: `Step of “${trunc(x.title, 60)}”`, moved: 0, goalId: x.goalId || '' });
        if (rows.some((r) => r.replace) && add.length) await rec.remove(x.id);
        return `Added ${plural(add.length, 'step')}`;
      }, 'Add');
    } });
};

/* Review "specs": how to ask, how to read the answer into rows, how to draw a row, how to apply.
   The same spec serves the button (ask now) and the automatic run (asked earlier, waiting for you). */
const SPECS = {};

/* ---- 2. Plan my week ---- */
const PLAN_PROMPT = `You plan one person's next 7 days. You get their open tasks (each with an id), their calendar, and how many tasks they really finish per day. Reply with JSON only, in this shape:
{"plan":[{"id":"...","date":"YYYY-MM-DD or empty"}],"note":"one short sentence about the week"}
Rules:
- Only use the ids given. Give each task a day from today to 6 days ahead, or "" to leave it unscheduled this week.
- Don't put more tasks on a day than they usually finish (round up), and fewer on days with several events.
- Never schedule a task after its due date. Overdue tasks go early in the week or are left unscheduled.
- Tasks for a goal that is behind or stalled go early in the week. Spread similar tasks out. Don't schedule everything: a realistic week beats a full one.`;
const planOpen = (D, t) => D.tasks.filter((x) => !x.done && (!x.date || x.date <= addDays(t, 6))).slice(0, 60);
SPECS.plan = {
  title: 'Plan my week', label: 'Apply', system: PLAN_PROMPT,
  ready: (D, t) => planOpen(D, t).length > 0,
  request: (t) => {
    const D = data(), evs = D.events.filter((e) => e.date >= t && e.date <= addDays(t, 6)).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    return `Today is ${fmtDate(t, { weekday: 'long' })}, ${t}.\nThey finish about ${capacity(D, t)} tasks a day (last 14 days).\n\n## Open tasks\n${planOpen(D, t).map((x) => taskLine(x, t)).join('\n') || '(none)'}\n\n## Goals\n${activeGoals(D).map((g) => goalForAI(D, g, t)).join('\n') || '(none)'}\n\n## Calendar, next 7 days\n${evs.map(eventLine).join('\n') || '(nothing)'}`;
  },
  parse: (text, t) => {
    const j = pullJSON(text), rows = [];
    for (const p of Array.isArray(j.plan) ? j.plan : []) {
      const x = p && get(String(p.id)); if (!x || x.type !== 'task' || x.done) continue;
      let d = day(p.date); if (d && (d < t || d > addDays(t, 6))) d = ''; if (d && x.date && x.date >= t && d > x.date) d = x.date;
      if (d === (x.date || '') || rows.some((r) => r.id === x.id)) continue;
      rows.push({ on: true, id: x.id, title: x.title, from: x.date || '', date: d });
    }
    return { rows, note: j.note ? trunc(String(j.note), 200) : '' };
  },
  still: (r) => { const x = get(r.id); return !!x && !x.done; },
  row: (r, i) => `<span class="rev-note">${esc(r.title)}</span><div class="org-when"><span class="small muted">${r.from ? esc(relDate(r.from)) : 'No date'} →</span>${dateField(i, r.date)}</div>`,
  apply: async (sel, rec) => { for (const r of sel) { const x = get(r.id); if (x) await rec.update({ ...x, date: day(r.date) }); } return `Planned ${plural(sel.length, 'task')}`; },
};

/* ---- 3. Clear the overdue pile ---- */
const OVERDUE_PROMPT = `Help clear a pile of overdue tasks. For each task (id given) choose one action:
"today" (do it today), "move" (to a later date, give "date"), "split" (too big: give 2 to 4 "steps"), "drop" (no longer worth doing).
Reply with JSON only, in this shape:
{"actions":[{"id":"...","action":"today|move|split|drop","date":"YYYY-MM-DD or empty","steps":["..."],"why":"under 12 words"}]}
Rules: no more than 3 tasks on today. Tasks moved many times are good candidates for split or drop. Only use the ids given.`;
const ACTIONS = { today: 'Do today', move: 'Move', split: 'Split', drop: 'Delete', keep: 'Leave as is' };
const overdueList = (D, t) => D.tasks.filter((x) => isOverdue(x, t)).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 40);
SPECS.overdue = {
  title: 'Sort out overdue', label: 'Apply', system: OVERDUE_PROMPT,
  ready: (D, t) => overdueList(D, t).length > 0,
  request: (t) => `Today is ${fmtDate(t, { weekday: 'long' })}, ${t}.\nThey finish about ${capacity(data(), t)} tasks a day.\n\n## Overdue tasks\n${overdueList(data(), t).map((x) => taskLine(x, t)).join('\n')}`,
  parse: (text, t) => {
    const j = pullJSON(text), rows = [];
    for (const a of Array.isArray(j.actions) ? j.actions : []) {
      const x = a && get(String(a.id)); if (!x || !isOverdue(x, t) || rows.some((r) => r.id === x.id)) continue;
      const action = ACTIONS[a.action] ? a.action : 'keep';
      const steps = (Array.isArray(a.steps) ? a.steps : []).map((s) => String(s || '').trim().slice(0, 200)).filter(Boolean).slice(0, 4);
      rows.push({ on: action !== 'keep', id: x.id, title: x.title, action: action === 'split' && !steps.length ? 'keep' : action, date: day(a.date) > t ? day(a.date) : addDays(t, 1), steps: steps.join('\n'), why: String(a.why || '').slice(0, 120) });
    }
    return { rows };
  },
  still: (r) => { const x = get(r.id); return !!x && !x.done && isOverdue(x, today()); },
  row: (r, i) => `<span class="rev-note">${esc(r.title)}</span><div class="org-when"><select data-rev="action" data-i="${i}" aria-label="What to do">${Object.entries(ACTIONS).map(([k, l]) => `<option value="${k}" ${r.action === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
    ${r.action === 'move' ? dateField(i, r.date) : ''}</div>${r.action === 'split' ? `<textarea class="rev-steps" data-rev="steps" data-i="${i}" rows="3" aria-label="Steps, one per line">${esc(r.steps)}</textarea>` : ''}${r.why ? `<span class="small muted">${esc(r.why)}</span>` : ''}`,
  apply: async (sel, rec) => {
    const t = today();
    let n = 0;
    for (const r of sel) {
      const x = get(r.id); if (!x) continue;
      if (r.action === 'today') await rec.update({ ...x, date: t, moved: (x.moved || 0) + 1 });
      else if (r.action === 'move' && day(r.date)) await rec.update({ ...x, date: r.date, moved: (x.moved || 0) + 1 });
      else if (r.action === 'drop') await rec.remove(x.id);
      else if (r.action === 'split') {
        const steps = String(r.steps).split('\n').map((v) => v.trim()).filter(Boolean);
        if (!steps.length) continue;
        for (const [k, v] of steps.entries()) await rec.create({ type: 'task', title: v, date: addDays(t, k), done: false, doneDate: '', note: `Step of “${trunc(x.title, 60)}”`, moved: 0, goalId: x.goalId || '' });
        await rec.remove(x.id);
      } else continue;
      n++;
    }
    return `Sorted ${plural(n, 'task')}`;
  },
};
/* Show a spec's rows in a sheet area; used after asking now and when opening a waiting suggestion. */
function reviewSpec(spec, out, rows, note = '') {
  showReview(out, rows, spec.row, spec.apply, spec.label);
  if (note && rows.length && $('#rev-list')) $('#rev-list').insertAdjacentHTML('beforebegin', `<p class="small" id="plan-note">${esc(note)}</p>`);
}
const specButton = (key, intro, empty) => () => {
  const spec = SPECS[key], t = today();
  const ready = pendingList().find((p) => p.kind === key && (p.rows || []).some(spec.still));
  if (ready) { A['pending-open']({ dataset: { id: ready.id } }); return; } // your AI already prepared this
  if (!spec.ready(data(), t)) { toast(empty); return; }
  aiTool({ title: spec.title, intro: intro(), system: spec.system, request: () => spec.request(t),
    onAnswer: (text, out) => { const r = spec.parse(text, t); reviewSpec(spec, out, r.rows, r.note); } });
};
A['plan-week'] = specButton('plan', () => 'The AI spreads your open tasks over the next 7 days, sized to what you usually finish. You check every move.', 'No open tasks to plan.');
A['overdue-sort'] = specButton('overdue', () => `The AI suggests what to do with each of your ${plural(overdueList(data(), today()).length, 'overdue task')}: do today, move, split or delete. You decide.`, 'Nothing is overdue.');

/* ---- 4. A line about today, on Home ---- */
const HOME_PROMPT = `Write one or two short sentences for the top of someone's day view: the single thing most worth knowing about today, from their records. Name the specific task, event or habit. If a goal is behind or stalled and something today could move it, that is often the thing. Plain words, no greeting, no list, no exclamation marks, under 40 words. Plain text only.`;
function homeRequest(t) {
  const D = data(), y = addDays(t, -1);
  return `Today is ${fmtDate(t, { weekday: 'long' })}, ${t}, ${fmtTime(`${LB.now().getHours()}:${pad(LB.now().getMinutes())}`)}.\n\n## Today's calendar\n${eventsOn(D, t).map(eventLine).join('\n') || '(nothing)'}\n\n## Due today or overdue\n${D.tasks.filter((x) => !x.done && x.date && x.date <= t).map((x) => taskLine(x, t)).join('\n') || '(nothing)'}\n\n## Done yesterday\n${doneOn(D, y).map((x) => x.title).join('; ') || '(nothing)'}\n\n## Habits (done in the last 7 days)\n${D.habits.map((h) => `${h.title}: ${habitCount(h, addDays(t, -7), addDays(t, -1))}/7${habitDone(h, t) ? ', done today' : ''}`).join('\n') || '(none)'}\n\n## Goals\n${activeGoals(D).map((g) => goalForAI(D, g, t)).join('\n') || '(none)'}\n\n## Notes for today or tomorrow\n${D.notes.filter((n) => [t, addDays(t, 1)].includes(noteDay(n))).map((n) => `${noteDay(n)}: ${n.title} ${trunc(String(n.body || '').replace(/\s+/g, ' '), 200)}`).join('\n') || '(none)'}`;
}
const saveHomeLine = (t, text) => saveSettings({ homeLine: { date: t, text: String(text).replace(/[*#`]/g, '').replace(/\s+/g, ' ').trim().slice(0, 300) } });
A['home-ai'] = () => {
  const t = today();
  aiTool({ title: 'About today', intro: 'The AI writes one line about today for the top of Home. It stays until tomorrow.', system: HOME_PROMPT,
    request: () => homeRequest(t),

};
const homeLine = () => { const h = S.settings.homeLine; return h && h.date === today() && h.text ? h.text : ''; };

/* ---- 5. Weekly look back ---- */
const WEEK_PROMPT = `Write a short look back on one person's last 7 days from their records, under 180 words, with three parts in bold: **Done**, **Slipped** (and why, if their notes say), **One thing to try next week**. If they have goals, say which ones the week moved and which it didn't. Use only what is in the records and say so when something is unclear. Be specific. No praise padding.`;
function weekRequest(t) {
  const D = data(), from = addDays(t, -6);
  const done = D.tasks.filter((x) => x.done && x.doneDate >= from && x.doneDate <= t);
  const slipped = D.tasks.filter((x) => !x.done && x.date && x.date < t && x.date >= addDays(t, -13));
  const notes = D.notes.filter((n) => noteDay(n) >= from && noteDay(n) <= t && !/^Look back · /.test(n.title || ''));
  return `This week: ${from} to ${t}.\n\n## Done (${done.length})\n${done.map((x) => `${x.doneDate}: ${x.title}`).join('\n') || '(nothing)'}\n\n## Still open past their date\n${slipped.map((x) => taskLine(x, t)).join('\n') || '(nothing)'}\n\n## Habits\n${D.habits.map((h) => `${h.title}: ${habitCount(h, from, t)} of 7 days`).join('\n') || '(none)'}\n\n## Goals\n${D.goals.map((g) => goalForAI(D, g, t)).join('\n') || '(none)'}\n\n## Calendar\n${D.events.filter((e) => e.date >= from && e.date <= t).map(eventLine).join('\n') || '(nothing)'}\n\n## Notes from this week\n${notes.map((n) => `${noteDay(n)} ${n.title}: ${trunc(String(n.body || '').replace(/\s+/g, ' '), 400)}`).join('\n') || '(none)'}`;
}
const saveLookBack = (t, text) => put({ type: 'note', title: 'Look back · ' + fmtDate(t, { month: 'short', day: 'numeric' }), body: text, pinned: false, date: t });
A['look-back'] = () => {
  const t = today();
  aiTool({ title: 'Weekly look back', intro: 'The AI looks at your last 7 days and writes a short look back. You can save it as a note.', system: WEEK_PROMPT,
    request: () => weekRequest(t),
    onAnswer: async (text, out) => {
      await saveSettings({ lookBack: t });
      out.innerHTML = `<div class="ai-out"><div class="prose" id="tool-answer">${mdLite(text)}</div><div class="row-end"><button class="btn sm primary" id="tool-save">Save as note</button></div></div>`;
      $('#tool-save', out).addEventListener('click', async (ev) => {
        const b = ev.currentTarget; // currentTarget is gone after the first await

      });
    } });
};

/* ---- 6. Ask your notes ---- */
const ASK_PROMPT = `Answer the person's question using only their notes below. Each note starts with a number like [3]. Cite the notes you used with their numbers in square brackets. If the notes don't answer it, say so plainly. Under 150 words.`;

/* ===== Automatic AI. When it's switched on in Settings, the AI does its thinking by itself while the app is
   open and online: a line about today, ideas for overdue tasks, organising a note you just wrote, a weekly
   look back, a Monday plan. Anything that would change your tasks waits on Home for one tap. ===== */
const AUTO_PARTS = [
  ['today', 'A line about today, the first time you open the app each day'],
  ['overdue', 'Ideas for overdue tasks, once a day when two or more are overdue'],
  ['notes', 'Organise a note when you close it'],
  ['week', 'A weekly look back on Sunday or Monday, saved to Notes'],
  ['plan', 'A plan for the week on Mondays'],
];
const AUTO = { busy: '', running: false };
LB.AUTO = AUTO;
const autoOn = (k) => { const a = S.settings.auto || {}; return !!a.on && (!k || a[k] !== false) && AI.provider() !== 'none'; };
const pendingList = () => (Array.isArray(S.settings.pending) ? S.settings.pending : []);
const savePending = (list) => saveSettings({ pending: list.slice(-10) });
const dropPending = (test) => savePending(pendingList().filter((p) => !test(p)));
const hashText = (s) => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return String(h); };

/* One automatic request: say what's happening on Home, remember exactly what was sent, record any failure. */
async function autoAsk(what, system, request) {
  AUTO.busy = what;
  if (route.name === 'home') render(false);
  try {
    const text = await AI.call(request, { system });
    await saveSettings({ autoLast: { at: new Date().toISOString(), what, text: trunc(system + '\n\n' + request, 20000) }, autoError: null });

/* ===== The AI box. Type anything into + with "Auto" picked, and your AI decides what it is: a task, habit,
   goal, note or calendar event. It's added straight away in the right place, the screen updates at once,
   and one Undo takes it back. Without an AI key, + works as before and you pick the kind yourself. ===== */
const OMNI_PROMPT = `
You are the AI Orchestration engine for the "Life Brain" mobile utility app.
The user is providing a chaotic raw text input, brain dump, or quick action string.
Analyze the input text and organize it into the correct app features.

You MUST return a clean, valid JSON object following this strict schema structure:
{
  "determinedType": "task" | "habit" | "goal" | "note" | "calendar",
  "title": "Clean concise title text optimized for short mobile rows",
  "extractedMeta": {
    "dueDate": "YYYY-MM-DD if mentioned, otherwise null",
    "frequency": "daily | weekly | null if it is a habit",
    "targetDeadline": "date string if goal deadline is implied, else null"
  },
  "summaryForNotes": "If the type is a note, clean up typos and structure it beautifully. Else null"
}

Do not include any conversational text or markdown formatting blockers. Return ONLY the JSON object.
`;
LB.OMNI_PROMPT = OMNI_PROMPT;
const OMNI_TYPES = { task: 'task', habit: 'habit', goal: 'goal', note: 'note', calendar: 'event' };
/* The model can't know today's date, so it travels with the text; that's how "tomorrow" becomes a date. */
const omniRequest = (raw, t = today()) => `Today is ${fmtDate(t, { weekday: 'long' })}, ${t}. Work out dates like "tomorrow" or "friday" from this.\n\nInput:\n${raw}`;
/* A date the model wrote as "2026-12-31" or "December 31, 2026" */
const anyDay = (s) => day(s) || (typeof s === 'string' && s.trim() && !Number.isNaN(Date.parse(s)) ? day(ymd(new Date(s))) : '');
/* A time anywhere in what you typed: "3pm", "9:30 am", "17:45". The schema has no time field, so it's read here. */
function timeIn(raw) {
  const m = raw.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i) || raw.match(/\b(\d{1,2}):(\d{2})\b/);
  if (!m) return '';
  let h = Number(m[1]); const min = Number(m[2] || 0), ap = (m[3] || '').toLowerCase();
  if (ap === 'pm' && h < 12) h += 12; if (ap === 'am' && h === 12) h = 0;
  return h <= 23 && min <= 59 ? `${pad(h)}:${pad(min)}` : '';
}
/* One AI answer → one record, in the shape every screen reads. Throws when the answer can't be used. */
function omniRecord(text, raw, t = today()) {
  const j = pullJSON(text), type = OMNI_TYPES[String(j.determinedType || '').trim().toLowerCase()];
  if (!type) throw aiErr('bad_answer', 'The AI answered, but didn’t say what kind of thing this is. Pick a kind above and add it yourself.');
  const meta = j.extractedMeta && typeof j.extractedMeta === 'object' ? j.extractedMeta : {};
  const title = String(j.title || '').replace(/\s+/g, ' ').trim().slice(0, 200) || trunc(raw.replace(/\s+/g, ' '), 120);
  const due = anyDay(meta.dueDate);
  if (type === 'task') return { type, title, date: due || t, done: false, doneDate: '', note: '', moved: 0, goalId: '' };
  if (type === 'event') return { type, title, date: due || t, time: timeIn(raw), end: '', note: '' };
  if (type === 'habit') return { type, title: (String(meta.frequency).toLowerCase() === 'weekly' && !/week/i.test(title) ? `${title} (weekly)` : title).slice(0, 80), log: {}, goalId: '' };
  if (type === 'goal') return { type, title: title.slice(0, 120), why: '', by: anyDay(meta.targetDeadline), target: 0, unit: '', log: {}, done: false, doneDate: '' };
  return { type: 'note', title, body: String(j.summaryForNotes || raw).trim().slice(0, 20000), pinned: false, date: t };
}

async function routeAIResponseToUI(text, raw) {
  const rec = await put(omniRecord(text, raw));
  const name = `“${trunc(rec.title, 40)}”`;
  const msg = rec.type === 'task' ? `Added task ${name} for ${relDate(rec.date)}`
    : rec.type === 'event' ? `Added ${name} to your calendar, ${relDate(rec.date)}${rec.time ? ' at ' + fmtTime(rec.time) : ''}`
    : rec.type === 'habit' ? `New habit ${name}, ready to tick`
    : rec.type === 'goal' ? `New goal ${name}${rec.by ? `, by ${fmtDate(rec.by, { month: 'short', day: 'numeric' })}` : ''}`

  return `<div class="conn${active === p ? ' on' : ''}" data-conn="${p}"><div class="conn-top"><button class="radio-btn" data-action="ai-use" data-p="${p}" role="radio" aria-checked="${active === p}" aria-label="Use ${esc(P.name)}"></button><b class="flex-1 font-semibold">${esc(P.name)}</b><span class="small">${S.aiKeys[p] ? '••••' + esc(S.aiKeys[p].slice(-4)) : ''}</span></div>
    <label class="field"><span>Model</span><input list="models-${p}" value="${esc(provModel(p))}" data-model-for="${p}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type a model name">
      <datalist id="models-${p}">${(models || []).map((m) => `<option value="${esc(m.id)}">${esc(m.free ? 'free' : '')}</option>`).join('')}</datalist></label>
    ${st ? `<p class="small mt-2 ${st.ok ? '!text-good' : '!text-bad'}" data-status="${p}">${esc(st.text)}</p>` : ''}
    <div class="chips mt-3"><button class="btn sm bg-raised" data-action="ai-check" data-p="${p}">Check key</button><button class="btn sm danger bg-raised" data-action="ai-remove" data-p="${p}">Remove</button></div></div>`;
}
document.addEventListener('input', (ev) => {
  if (ev.target.dataset.live !== 'ai-key') return;
  const d = detectProvider(ev.target.value), hint = $('#ai-detect'), sel = $('#f-aiprov');
  if (!hint) return;
  if (!ev.target.value.trim()) { hint.textContent = ''; return; }
  hint.textContent = d ? (d.sure ? `${PROVIDERS[d.id].name} key` : `Probably ${PROVIDERS[d.id].name}. If not, pick the service below.`) : 'Not sure which service this is. Pick it below.';
  if (d && sel && (!sel.value || sel.dataset.auto)) { sel.value = d.id; sel.dataset.auto = '1'; }
});
document.addEventListener('change', (ev) => {
  const p = ev.target.dataset && ev.target.dataset.modelFor;
  if (!p) return;
  const v = ev.target.value.trim();
  saveSettings({ ai: { models: { ...S.settings.ai.models, [p]: v } } }).then(() => toast(v ? `Using ${v}` : 'Model cleared')).catch((e) => toast(e.message, 'bad'));
});
async function commitConn({ p, key, base, models }) {
  if (key) S.aiKeys[p] = key;
  const ai = S.settings.ai;
  await saveSettings({ ai: {
    linked: [...new Set([...(ai.linked || []), p])], active: p,
    baseUrls: base ? { ...ai.baseUrls, [p]: base } : ai.baseUrls,
    models: { ...ai.models, [p]: ai.models[p] || (models ? pickModel(p, models) : PROVIDERS[p].fallback || '') },
  } });
  await storeAiKeys();
}
F['ai-connect'] = async (form, v) => {
  const key = String(v.key || '').trim(), d = detectProvider(key), p = v.provider || (d && d.id);
  if (!p || !PROVIDERS[p]) throw new Error('Can’t tell which service this key is for. Pick it under “Service and address”.');
  const P = PROVIDERS[p];
  if (!key && !P.local && p !== 'custom') throw new Error('Paste the key first.');
  if (/\s/.test(key)) throw new Error('The key has a space in it. Copy it again.');
  const base = String(v.base || '').trim().replace(/\/+$/, '');
  if (base) checkUrl(base);
  if (!base && !P.base) throw new Error('Add the server’s address. It usually ends in /v1.');
  const btn = $('button.primary', form), err = $('.err', form);
  btn.disabled = true; btn.textContent = 'Checking…';
  try {
    const models = await listModels(p, key, base || P.base);
    await commitConn({ p, key, base, models });
    aiStatus[p] = { ok: true, text: `Connected · ${plural(models.length, 'model')}` };
    render();
    toast(`Connected to ${P.name}`);
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Connect';
    if (['auth', 'credits', 'bad_url'].includes(e.code)) throw e;
    pendingConn = { p, key, base };
    err.innerHTML = `${esc(e.message)} <button type="button" class="btn sm" data-action="ai-connect-anyway">Save anyway</button>`;
  }
};
A['ai-connect-anyway'] = async () => {
  if (!pendingConn) return;
  const { p } = pendingConn;
  await commitConn(pendingConn);
  pendingConn = null;
  aiStatus[p] = { ok: false, text: 'Saved without checking. Type a model name if needed.' };
  render();
};
A['ai-use'] = async (el) => { await saveSettings({ ai: { active: el.dataset.p } }); };
A['ai-remove'] = async (el) => {
  const p = el.dataset.p, ai = S.settings.ai;
  delete S.aiKeys[p]; delete AIX.models[p]; delete aiStatus[p];
  await saveSettings({ ai: { linked: (ai.linked || []).filter((x) => x !== p), active: ai.active === p ? 'auto' : ai.active } });
  await storeAiKeys();
  toast(`${PROVIDERS[p].name} removed`);
};
A['ai-check'] = async (el) => {
  const p = el.dataset.p;
  el.disabled = true; el.textContent = 'Checking…';
  try { aiStatus[p] = { ok: true, text: await checkKey(p) }; } catch (e) { aiStatus[p] = { ok: false, text: e.message }; }
  render();
};
A['ai-remember'] = async (el) => {
  await saveSettings({ ai: { rememberKeys: !!el.checked } });
  await storeAiKeys();
  toast(el.checked ? 'Keys kept on this phone' : 'Keys kept in memory only');
};

/* ---- Data ---- */
function saveFile(filename, text) {
  const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Backup downloaded');
}
A.export = async () => { saveFile(`life-brain-backup-${today()}.json`, JSON.stringify(exportData(), null, 2)); await markExported(); };
document.addEventListener('change', async (ev) => {
  if (!ev.target.matches('[data-import]')) return;
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  if (file.size > 50 * 1024 * 1024) { toast('That file is too big to be a backup.', 'bad'); return; }
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (_) { toast('That file isn’t a backup.', 'bad'); return; }
  importPreview(validateImport(obj));
});
let pendingImport = null;
const NAMES = { task: 'tasks', event: 'events', note: 'notes', habit: 'habits', goal: 'goals' };
function importPreview(v) {
  pendingImport = v;
  openSheet({ title: 'Import backup', body: v.ok
    ? `<p>${Object.entries(v.counts).map(([k, n]) => `${n} ${NAMES[k]}`).join(', ') || 'Nothing in it.'}</p>
      <p class="small mt-2"><b>Add</b> keeps what you have and adds these. <b>Replace</b> clears everything first. A backup of what you have now is made either way.</p>
      <div class="sheet-foot justify-end"><button class="btn" data-action="import-go" data-mode="replace">Replace</button><button class="btn primary" data-action="import-go" data-mode="merge">Add</button></div>`
    : `<p class="err">${v.errors.map(esc).join('<br>')}</p><div class="sheet-foot justify-end"><button class="btn" data-action="sheet-close">Close</button></div>` });
}
LB.importPreview = importPreview;
A['import-go'] = async (el) => {
  if (!pendingImport || !pendingImport.ok) return;
  const mode = el.dataset.mode === 'replace' ? 'replace' : 'merge';
  if (mode === 'replace') {
    closeSheet();
    if (!(await confirmSheet({ title: 'Replace everything?', text: 'What you have now is replaced by the backup. A copy of it is kept under “Backups on this phone”.', confirmLabel: 'Replace', danger: true }))) return;
  }
  await importData(pendingImport, mode);
  pendingImport = null; snapCache = null;
  closeSheet();
  toast(mode === 'replace' ? 'Backup restored' : 'Backup added');
};
A['snap-restore'] = async (el) => {
  if (!(await confirmSheet({ title: 'Restore this backup?', text: 'What you have now is replaced. A copy of it is kept first, so you can undo this.', confirmLabel: 'Restore', danger: true }))) return;
  await restoreSnapshot(el.dataset.id);
  snapCache = null;
  toast('Backup restored');
};
A.wipe = async () => {
  if (!(await confirmSheet({ title: 'Delete everything?', text: 'Every task, event, note, habit, goal, key and backup on this phone is erased. This can’t be undone.', confirmLabel: 'Delete everything', danger: true, requireText: 'DELETE' }))) return;
  await deleteEverything();
  snapCache = null;
  go('home');
  toast('Everything deleted');
};

/* ---- How it works: shown once on first open, and any time from the menu ---- */
A.intro = () => {
  closeMenu();
  const row = (ic, name, text) => `<li><span class="nav-ic">${icon(ic)}</span><span><b>${name}</b><br>${text}</span></li>`;
  openSheet({ title: 'How Life Brain works', body: `<ul class="intro">
      ${row('home', 'Home', 'Open the app here. It shows what’s on today, where your days are heading compared with your goals, and fixes you can apply in one tap.')}
      ${row('today', 'Today', 'Type a task and press Enter. Tap the circle when it’s done, or swipe a task right. Swipe left to move it to tomorrow.')}
      ${row('calendar', 'Calendar', 'Tap a day to see it, or add a task, event or note to it.')}
      ${row('goal', 'Goals', 'Say what you want. Tie tasks and habits to it, and Home shows whether your days are heading there.')}
      ${row('notes', 'Notes', 'Write down the why. Tap Organise to turn a brain dump into tasks.')}
      ${row('progress', 'Progress', 'Your week in numbers, habits to keep, and what you might be missing.')}
    </ul>
    <p class="small mt-3">Everything is in the menu <b>☰</b> at the top left, and <b>+</b> adds anything from anywhere. With an AI key, <b>Auto</b> in + lets your AI decide what you typed is. Buttons with the colourful ✦ use your AI. Nothing changes until you tap, and Undo takes it back.</p>
    <div class="sheet-foot justify-end"><button class="btn primary" data-action="intro-done">Got it</button></div>` });
};
A['intro-done'] = async () => { closeSheet(); if (!S.settings.introSeen) await saveSettings({ introSeen: true }); };

/* ===== Start ===== */
function registerSW() {
  if (!window.LB_PWA || !('serviceWorker' in navigator)) return;
  LB.swState = 'pending';
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => { LB.swState = 'ready'; document.documentElement.dataset.sw = 'ready'; if (route.name === 'settings') render(); })
    .catch((e) => { console.warn('Service worker failed', e); LB.swState = 'error'; });
}
/* "#add" (the Add shortcut on the home-screen icon) opens the + sheet straight away, ready to type. */
function openAddFromLink() {
  if (location.hash !== '#add') return false;
  try { history.replaceState(null, '', '#' + route.name); } catch (_) {}
  A['quick-add']({ dataset: {} });
  return true;
}
async function boot() {
  await dbInit();
  applyTheme();
  let moved = 0;
  try { moved = await migrateOld(); } catch (e) { console.error('Could not bring over old data', e); }
  Object.assign(route, parseHash());
  onChange(() => render(false));
  render(false);
  if (moved) toast(`Brought over ${plural(moved, 'item')} from the old version`);
  if (!S.settings.introSeen && !window.LB_NO_INTRO) { A.intro(); saveSettings({ introSeen: true }).catch(() => {}); } // once, so nobody starts lost
  else openAddFromLink();
  window.addEventListener('hashchange', () => { if (openAddFromLink()) return; const r = parseHash(); if (r.name !== route.name || r.sub !== route.sub) { Object.assign(route, r); render(true); } });
  /* Past midnight, "today" changes: redraw when the app comes back. */
  let day = today();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== day) { day = today(); render(false); } });
  requestPersistence();
  autoSnapshot().catch(() => {});
  registerSW();
  setTimeout(() => autoRun(), 1500); // only does anything if Automatic is switched on
  LB.ready = true;
  document.documentElement.dataset.ready = '1';
}
boot().catch((e) => { console.error(e); $('#view').innerHTML = `<div class="empty">Life Brain couldn’t start: ${esc(e.message)}</div>`; });
</script>
</body>
